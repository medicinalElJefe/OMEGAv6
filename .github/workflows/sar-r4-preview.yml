name: SAR R4 Continuous OMEGA Preview

on:
  push:
    branches:
      - release/sar-r4-omega-continuous-field
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sar-r4-preview
  cancel-in-progress: true

env:
  SAR_PUBLIC_URL: https://omega-sar-r4.jeffdeweyeljefe.workers.dev

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify source and OMEGA field invariants
        working-directory: sar-accumulation-studio
        run: |
          npm run check
          npm test
      - name: Build self-contained GeoTIFF runtime
        working-directory: sar-accumulation-studio
        run: |
          npm install --no-package-lock
          mkdir -p vendor
          npx --yes esbuild@0.25.9 src/geotiff-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=vendor/geotiff.bundle.mjs
          test -s vendor/geotiff.bundle.mjs
      - name: Verify Cloudflare authorization
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@latest whoami
      - name: Dry-run isolated R4 worker
        run: npx wrangler@latest deploy --config wrangler.sar-r4.jsonc --dry-run --outdir .wrangler-sar-r4
      - name: Deploy isolated R4 worker
        run: npx wrangler@latest deploy --config wrangler.sar-r4.jsonc
      - name: Verify R4 public transport
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            code="$(curl -sS -o /tmp/r4.html -w '%{http_code}' -H 'cache-control: no-cache' "$SAR_PUBLIC_URL/?release=$GITHUB_SHA" || true)"
            if [ "$code" = 200 ] && grep -q 'OMEGA SAR' /tmp/r4.html; then break; fi
            test "$attempt" != 20 || { echo 'R4 root did not become live'; exit 1; }
            sleep 3
          done
          for module in r4-runtime.mjs r4-live-precision.mjs sar-authority.mjs sar-render-authority.mjs sar-measurement-authority.mjs omega-field-core.mjs omega-mode-stack.mjs omega-field-console.mjs earth-grid.mjs sentinel-console.mjs map-navigation-runtime.mjs interaction-runtime.mjs sar-focus-runtime.mjs sar-earth-overlay.mjs sar-browse-overlay.mjs; do
            ready=0
            for attempt in {1..20}; do
              code="$(curl -sS -o "/tmp/$module" -w '%{http_code}' -H 'cache-control: no-cache' "$SAR_PUBLIC_URL/src/$module?release=$GITHUB_SHA" || true)"
              if [ "$code" = 200 ]; then ready=1; break; fi
              sleep 2
            done
            test "$ready" = 1 || { echo "R4 $module did not become live after propagation window (last HTTP $code)"; exit 1; }
          done
          stac_ready=0
          for attempt in {1..12}; do
            code="$(curl -sS -o /tmp/stac.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'cache-control: no-cache' --data '{"collections":["sentinel-1-grd"],"limit":1,"intersects":{"type":"Point","coordinates":[-110.9747,32.2226]}}' "$SAR_PUBLIC_URL/api/stac/search" || true)"
            if [ "$code" = 200 ] && grep -q 'FeatureCollection' /tmp/stac.json; then stac_ready=1; break; fi
            sleep 2
          done
          test "$stac_ready" = 1 || { cat /tmp/stac.json || true; echo "R4 STAC proxy did not become healthy (last HTTP $code)"; exit 1; }
      - name: Install Chromium proof runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove authoritative continuous SAR Earth instrument
        working-directory: sar-accumulation-studio
        env:
          SAR_TEST_URL: ${{ env.SAR_PUBLIC_URL }}
        run: node tests/r4-authority-spine-e2e.mjs
      - name: Prove worldwide continuous field and real SAR anchoring
        working-directory: sar-accumulation-studio
        env:
          SAR_TEST_URL: ${{ env.SAR_PUBLIC_URL }}
        run: node tests/r4-continuous-field-e2e.mjs
      - name: Prove live high-fidelity precision surface
        working-directory: sar-accumulation-studio
        env:
          SAR_TEST_URL: ${{ env.SAR_PUBLIC_URL }}
        run: node tests/r4-live-precision-e2e.mjs
      - name: Archive R4 live visual proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sar-r4-live-visual-proof
          path: sar-accumulation-studio/test-results/r4-live-precision.png
          if-no-files-found: warn
          retention-days: 14
