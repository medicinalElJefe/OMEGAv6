name: SAR R4 Continuous OMEGA Preview

on:
  push:
    branches:
      - release/sar-r4-omega-continuous-field
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sar-r4-preview
  cancel-in-progress: true

env:
  SAR_PUBLIC_URL: https://omega-sar-r4.jeffdeweyeljefe.workers.dev

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify source, geometry, water, temporal, lemma, experience and OMEGA invariants
        working-directory: sar-accumulation-studio
        run: |
          npm run check
          npm test
          node --check src/lemma-state-calculus.mjs
          node --check src/sar-smooth-motion-runtime.mjs
          node --check src/sar-global-fabric-runtime.mjs
          node --check src/sar-woven-motion-runtime.mjs
          node --check src/omega-lemma-translator-runtime.mjs
          node --check src/sar-experience-runtime.mjs
          node --check src/r4-runtime.mjs
          node --check tests/r251-global-motion-e2e.mjs
          node --check tests/r252-experience-e2e.mjs
      - name: Build self-contained GeoTIFF runtime
        working-directory: sar-accumulation-studio
        run: |
          npm install --no-package-lock
          mkdir -p vendor
          npx --yes esbuild@0.25.9 src/geotiff-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=vendor/geotiff.bundle.mjs
          test -s vendor/geotiff.bundle.mjs
      - name: Verify Cloudflare authorization
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@latest whoami
      - name: Dry-run isolated R4 worker
        run: npx wrangler@latest deploy --config wrangler.sar-r4.jsonc --dry-run --outdir .wrangler-sar-r4
      - name: Deploy isolated R4 worker
        run: npx wrangler@latest deploy --config wrangler.sar-r4.jsonc
      - name: Verify R252 public transport and Earth awareness providers
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            code="$(curl -sS -o /tmp/r4.html -w '%{http_code}' -H 'cache-control: no-cache' "$SAR_PUBLIC_URL/?release=$GITHUB_SHA" || true)"
            if [ "$code" = 200 ] && grep -q 'OMEGA SAR' /tmp/r4.html; then break; fi
            test "$attempt" != 20 || { echo 'R4 root did not become live'; exit 1; }
            sleep 3
          done
          for module in r4-runtime.mjs r4-live-precision.mjs sar-authority.mjs sar-render-authority.mjs sar-measurement-authority.mjs sar-blade-geometry.mjs sar-blade-render-runtime.mjs sar-blade-lens-runtime.mjs sar-regional-measurement.mjs sar-regional-runtime.mjs lemma-state-calculus.mjs sar-smooth-motion-runtime.mjs sar-global-fabric-runtime.mjs sar-woven-motion-runtime.mjs omega-lemma-translator-runtime.mjs sar-experience-runtime.mjs water-geometry-core.mjs earth-awareness-runtime.mjs jrc-water-observation-runtime.mjs earth-temporal-core.mjs earth-temporal-sync.mjs omega-field-core.mjs omega-mode-stack.mjs omega-field-console.mjs earth-grid.mjs sentinel-console.mjs map-navigation-runtime.mjs interaction-runtime.mjs sar-focus-runtime.mjs sar-earth-overlay.mjs sar-browse-overlay.mjs r249-exact-lens-runtime.mjs; do
            ready=0
            for attempt in {1..20}; do
              code="$(curl -sS -o "/tmp/$module" -w '%{http_code}' -H 'cache-control: no-cache' "$SAR_PUBLIC_URL/src/$module?release=$GITHUB_SHA" || true)"
              if [ "$code" = 200 ]; then ready=1; break; fi
              sleep 2
            done
            test "$ready" = 1 || { echo "R4 $module did not become live after propagation window (last HTTP $code)"; exit 1; }
          done
          stac_ready=0
          for attempt in {1..12}; do
            code="$(curl -sS -o /tmp/stac.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'cache-control: no-cache' --data '{"collections":["sentinel-1-grd"],"limit":1,"bbox":[-120,25,-105,38]}' "$SAR_PUBLIC_URL/api/stac/search" || true)"
            if [ "$code" = 200 ] && grep -q 'FeatureCollection' /tmp/stac.json; then stac_ready=1; break; fi
            sleep 2
          done
          test "$stac_ready" = 1 || { cat /tmp/stac.json || true; echo "R4 STAC proxy did not become healthy (last HTTP $code)"; exit 1; }

          terrain_code="$(curl -sS -D /tmp/terrain.headers -o /tmp/terrain.png -w '%{http_code}' "$SAR_PUBLIC_URL/api/terrain?z=8&x=49&y=103" || true)"
          test "$terrain_code" = 200 || { cat /tmp/terrain.headers || true; echo "Terrain provider failed HTTP $terrain_code"; exit 1; }
          grep -qi 'content-type: image/png' /tmp/terrain.headers
          test -s /tmp/terrain.png

          water_code="$(curl -sS -D /tmp/water.headers -o /tmp/water.png -w '%{http_code}' "$SAR_PUBLIC_URL/api/water/jrc?layer=occurrence&z=8&x=49&y=103" || true)"
          test "$water_code" = 200 || { cat /tmp/water.headers || true; echo "JRC surface-water provider failed HTTP $water_code"; exit 1; }
          grep -qi 'content-type: image/png' /tmp/water.headers
          grep -qi 'x-omega-water-period: 1984-2024' /tmp/water.headers
          test -s /tmp/water.png

          usgs_code="$(curl -sS -o /tmp/usgs.json -w '%{http_code}' "$SAR_PUBLIC_URL/api/events/usgs?period=day" || true)"
          test "$usgs_code" = 200 && grep -q 'FeatureCollection' /tmp/usgs.json || { head -c 1000 /tmp/usgs.json || true; echo "USGS event provider failed HTTP $usgs_code"; exit 1; }

          eonet_code="$(curl -sS -o /tmp/eonet.json -w '%{http_code}' "$SAR_PUBLIC_URL/api/events/eonet?days=30&limit=10" || true)"
          test "$eonet_code" = 200 && grep -q 'FeatureCollection' /tmp/eonet.json || { head -c 1000 /tmp/eonet.json || true; echo "NASA EONET provider failed HTTP $eonet_code"; exit 1; }
      - name: Install Chromium proof runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove authoritative continuous SAR Earth instrument
        working-directory: sar-accumulation-studio
        env:
          SAR_TEST_URL: ${{ env.SAR_PUBLIC_URL }}
        run: node tests/r4-authority-spine-e2e.mjs
      - name: Prove R251 global SAR fabric, smooth motion and Mode188 translation
        working-directory: sar-accumulation-studio
        env:
          SAR_TEST_URL: ${{ env.SAR_PUBLIC_URL }}
        run: node tests/r251-global-motion-e2e.mjs
      - name: Prove R252 immersive map-first user experience
        working-directory: sar-accumulation-studio
        env:
          SAR_TEST_URL: ${{ env.SAR_PUBLIC_URL }}
        run: node tests/r252-experience-e2e.mjs
      - name: Archive R252 live visual proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sar-r252-immersive-experience-proof
          path: |
            sar-accumulation-studio/test-results/r251-global-motion.png
            sar-accumulation-studio/test-results/r252-immersive-experience.png
          if-no-files-found: warn
          retention-days: 14
