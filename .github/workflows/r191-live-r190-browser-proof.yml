name: R191 Live R190 Browser Proof

on:
  workflow_run:
    workflows: ["OMEGA Cloud Bridge CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: omega-r191-live-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  prove-deployed-r190-browser:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMEGA_E2E_URL: https://omegav6.jeffdeweyeljefe.workers.dev
      OMEGA_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact deployed main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install --no-fund
      - name: Install Chromium proof runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove exact promoted receipt and real deployed R190 browser execution
        run: node tests/r191-live-r190-browser-e2e.mjs
      - name: Record R191 live browser receipt
        if: always()
        run: |
          {
            echo "## R191 deployed R190 browser proof"
            echo "- Upstream Cloud Bridge run: ${{ github.event.workflow_run.id }}"
            echo "- Exact promoted SHA: $OMEGA_EXPECTED_SHA"
            echo "- Runtime: $OMEGA_E2E_URL"
            echo "- Required: governed build receipt source/promoted SHA equality"
            echo "- Required: desktop/mobile Visual Instrument render"
            echo "- Required: R188 inert before operator invocation"
            echo "- Required: desktop 20,736-state scan + 144 D×P projection cells"
            echo "- Required: no mutating network request from browser-local R188 scan"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
