name: OMEGA R157 Visual Truth Convergence

on:
  push:
    branches: [r157-visual-truth-convergence]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: omega-r157-visual-truth-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r157-visual-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prove R157 visual truth and renderer source bindings
        run: node tests/r157-visual-truth-convergence-invariants.mjs
      - name: Preserve R156 adaptive operating surface and R155 information architecture
        shell: bash
        run: |
          node tests/r156-adaptive-instrument-surface-invariants.mjs
          node tests/r156-global-navigator-invariants.mjs
          node tests/r155-navigation-information-architecture-invariants.mjs
      - name: Preserve visual-first navigation, deep donors and complete route authority
        shell: bash
        run: |
          node tests/r89-mobile-visual-first-flat-navigation-invariants.mjs
          node tests/r100-weave-instrument-invariants.mjs
          node tests/r109-route-deferred-specialist-fabric-invariants.mjs
          node tests/r118-full-system-operational-convergence-invariants.mjs
          node tests/r119-full-resolution-ultra-convergence-invariants.mjs
          node tests/r132-whole-system-experience-invariants.mjs
      - name: Preserve newest truth, motion, capacity, optical and whole-system authorities
        shell: bash
        run: |
          node tests/r151-all-modes-truth-fusion-invariants.mjs
          npx --yes tsx tests/r152-universal-truth-envelope.mts
          npx --yes tsx tests/r153-lemma-motion-now-continuity.mts
          npx --yes tsx tests/r154-relative-capacity-fabric.mts
          node tests/r1532-adaptive-external-search-invariants.mjs
          node tests/r155-whole-system-convergence-invariants.mjs
      - name: Complete inherited static regression and production build
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/omega-r157-preview.log 2>&1 &
          echo $! >/tmp/omega-r157-preview.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-r157-preview.log
          exit 1
      - name: Exercise R156 adaptive menu in desktop and mobile Chromium
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r156-adaptive-navigation-browser-e2e.mjs
      - name: Exercise R157 visual truth and causal controls in Chromium
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r157-visual-accuracy-browser-e2e.mjs
      - name: Exercise every registered route and visual stage in desktop and mobile Chromium
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r118-browser-operational-e2e.mjs
      - name: Browser diagnostics on failure
        if: failure()
        run: cat /tmp/omega-r157-preview.log || true
      - name: Canonical Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r157-canonical
