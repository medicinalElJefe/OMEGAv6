name: R59 Visible Diagnostic Gates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: R59 convergence invariant
        run: npm run test:r59
      - name: Startup and home inheritance
        run: npm run test:home
      - name: Nav 01 coherence
        run: node tests/navigation-coherence.mjs
      - name: Nav 02 interaction contract
        run: node tests/interaction-contract-invariants.mjs
      - name: Nav 03 actionable controls
        run: node tests/actionable-controls-invariants.mjs
      - name: Nav 04 R10 registry
        run: node tests/navigation-registry-r10-invariants.mjs
      - name: Nav 05 R12 functional domains
        run: node tests/navigation-functional-domains-r12-invariants.mjs
      - name: Nav 06 R13 professional workspace
        run: node tests/professional-workspace-r13-invariants.mjs
      - name: Nav 07 R16 hierarchy
        run: node tests/interface-hierarchy-r16-invariants.mjs
      - name: Nav 08 R17 capability authority
        run: node tests/capability-view-authority-r17-invariants.mjs
      - name: Nav 09 R20 workstation
        run: node tests/navigation-r20-workstation-invariants.mjs
      - name: Nav 10 R21 source-backed runtime
        run: node tests/source-backed-runtime-r21-invariants.mjs
      - name: Nav 11 R22 traversal binding
        run: node tests/mode-traversal-binding-r22-invariants.mjs
      - name: Nav 12 R23 capability truth
        run: node tests/capability-truth-r23-invariants.mjs
      - name: Nav 13 R27 single-frame
        run: node tests/single-frame-r27-invariants.mjs
      - name: Nav 14 R27 layout contract
        run: node tests/r27-layout-mode-contract.mjs
      - name: Nav 15 R31 shell
        run: node tests/shell-r31-invariants.mjs
      - name: Navigation aggregate
        run: npm run test:navigation
      - name: Application routing inheritance
        run: npm run test:applications
      - name: Visual inheritance
        run: npm run test:visual
      - name: Complete unchanged repository gate
        run: npm run check
