name: R237 Authenticated Rotation Repair

on:
  push:
    branches: [r237-hybrid-command-authority]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: r237-hybrid-command-authority
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Patch rotation authority and invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('src/workerR32.js')
          s = worker.read_text()
          old = "if(path==='/pair'&&request.method==='POST'){const body=await request.json().catch(()=>({})),existing=await this.get('bridgeSecretHash','');if(existing&&!body.rotate)return json({ok:true,state:'PAIRING_EXISTS',secretReturned:false});const secret=randomToken(24);await this.put('bridgeSecretHash',await sha256(secret));await this.put('bridgeCreatedAt',now());await this.event(existing?'PAIR_ROTATED':'PAIR_CREATED','A new Hybrid Link pairing credential was issued.');return json({ok:true,state:'PAIRING_READY',secretReturned:true,secret})}"
          new = "if(path==='/pair'&&request.method==='POST'){const body=await request.json().catch(()=>({})),existing=await this.get('bridgeSecretHash','');if(existing&&!body.rotate)return json({ok:true,state:'PAIRING_EXISTS',secretReturned:false});if(existing&&body.rotate&&!await this.authorized(request))return json({ok:false,code:'PAIR_AUTH_FAILED',reply:'Existing pairing must authenticate before rotation.'},401);const secret=randomToken(24);await this.put('bridgeSecretHash',await sha256(secret));await this.put('bridgeCreatedAt',now());await this.event(existing?'PAIR_ROTATED':'PAIR_CREATED','A new Hybrid Link pairing credential was issued.');return json({ok:true,state:'PAIRING_READY',secretReturned:true,secret})}"
          if old not in s:
              raise SystemExit('Expected vulnerable pair route not found exactly; refusing non-deterministic patch')
          worker.write_text(s.replace(old, new, 1))

          test = Path('tests/r237-hybrid-command-authority-invariants.mjs')
          t = test.read_text()
          anchor = "must(worker.includes(\"path.startsWith('/api/hybrid/jobs/')&&path.endsWith('/cancel')\"),'R237 public queued-job cancellation route missing');\n"
          addition = """const pairRoute=worker.indexOf(\"if(path==='/pair'&&request.method==='POST')\");
const rotationGate=worker.indexOf(\"existing&&body.rotate&&!await this.authorized(request)\",pairRoute);
const secretIssue=worker.indexOf(\"const secret=randomToken(24)\",pairRoute);
must(pairRoute>=0&&rotationGate>pairRoute&&secretIssue>rotationGate,'R237 existing-pair rotation must authenticate before any replacement secret is issued');
must(worker.includes(\"reply:'Existing pairing must authenticate before rotation.'\"),'R237 authenticated rotation refusal truth copy missing');
"""
          if addition not in t:
              if anchor not in t:
                  raise SystemExit('R237 invariant anchor missing; refusing ambiguous patch')
              t = t.replace(anchor, addition + anchor, 1)
              test.write_text(t)
          PY
      - name: Prove focused authority contract
        run: |
          node --check src/workerR32.js
          node tests/r237-hybrid-command-authority-invariants.mjs
      - name: Commit exact repair and remove scaffold
        shell: bash
        run: |
          git rm .github/workflows/r237-authenticated-rotation-repair.yml
          git add src/workerR32.js tests/r237-hybrid-command-authority-invariants.mjs
          git config user.name 'Jeffrey A Dewey'
          git config user.email 'b6qrfb57ky@privaterelay.appleid.com'
          git commit -m 'R237: require authenticated bridge-secret rotation'
          git push origin HEAD:r237-hybrid-command-authority
