name: OMEGA R158 Capability Universe Interaction Integrity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r158-capability-universe-convergence]

permissions:
  contents: read

concurrency:
  group: omega-r158-interaction-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r158:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm install --no-fund
      - name: Reject high-severity dependency regressions
        run: npm audit --audit-level=high
      - name: Prove R158 capability universe and interaction contract
        run: node tests/r158-capability-universe-invariants.mjs
      - name: Preserve R156 dimensional relativity truth boundaries
        run: node tests/r156-dimensional-relativity-evolution-invariants.mjs
      - name: Preserve admitted R155 ownership and interface authority
        shell: bash
        run: |
          node tests/r155-whole-system-convergence-invariants.mjs
          node tests/r155-navigation-information-architecture-invariants.mjs
      - name: Preserve route execution proof and admission boundaries
        shell: bash
        run: |
          node tests/r143-authoritative-ui-operation-chain-invariants.mjs
          node tests/r142-proof-aware-capability-lifecycle-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Canonical Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r158-dry-run
      - name: Install Chromium for visual interaction proof
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start built application locally
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/omega-r158-preview.log 2>&1 &
          echo $! >/tmp/omega-r158-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-r158-preview.log
          exit 1
      - name: Prove output planes remain uncovered during interaction
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r158-visual-interaction-e2e.mjs
      - name: Preserve every registered route in desktop and mobile Chromium
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r118-browser-operational-e2e.mjs
      - name: Browser diagnostics on failure
        if: failure()
        run: cat /tmp/omega-r158-preview.log || true
