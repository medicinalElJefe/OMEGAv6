name: R168.1 RCWA Byte Diagnostic

on:
  push:
    branches: [r168-1-rcwa-byte-attestation-repair]
    paths:
      - 'scripts/diagnose_rcwa_live_r1681.mjs'
      - '.github/workflows/r168-1-rcwa-byte-diagnostic.yml'
      - 'public/omega-rcwa-agent.py'
      - 'public/omega-rcwa-worker.py'
      - 'src/workerR34.js'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose_rcwa_live_r1681.mjs'
      - '.github/workflows/r168-1-rcwa-byte-diagnostic.yml'
      - 'public/omega-rcwa-agent.py'
      - 'public/omega-rcwa-worker.py'
      - 'src/workerR34.js'

permissions:
  contents: read

env:
  OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev

jobs:
  diagnose-live-rcwa-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build canonical assets
        run: npm run build
      - name: Compare repository, dist, static and Worker-served RCWA bytes
        run: node scripts/diagnose_rcwa_live_r1681.mjs
