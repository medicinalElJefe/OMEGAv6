name: Genesis R606-R611 Exact-Head Proof
on:
  pull_request:
    paths:
      - 'genesis/**'
      - 'tests/r60*-genesis*'
      - 'tests/r61*-genesis*'
      - '.github/workflows/genesis-exact-head.yml'
  workflow_dispatch:
jobs:
  genesis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Governed kernel and negative controls
        run: |
          npx tsx tests/r606-genesis-governance.mts
          npx tsx tests/r607-genesis-cycle.mts
          npx tsx tests/r608-genesis-independent-proof.mts
          npx tsx tests/r609-genesis-execution-boundary.mts
          npx tsx tests/r610-genesis-lease-store.mts
          npx tsx tests/r611-genesis-sqlite-recovery.mts
