name: OMEGA Cloud Bridge CI

on:
  push:
    branches: [main, full-restore]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev
  OMEGA_SAI_DOOR_URL: https://omega-sai-door-r256.jeffdeweyeljefe.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Audit locked application dependency tree
        run: npm audit --audit-level=high
      - name: Prove R163 canonical core-health boundary
        run: node tests/r163-canonical-core-health-truth-invariants.mjs
      - name: Prove R200.1 deployed total-experience proof boundaries
        run: node tests/r2001-deployed-total-experience-proof-invariants.mjs
      - name: Prove R202 operational source-authority convergence
        run: node tests/r202-operational-source-authority-invariants.mjs
      - name: Prove R237 authenticated Hybrid command authority
        run: node tests/r237-hybrid-command-authority-invariants.mjs
      - name: Prove R238 Hybrid host intelligence
        run: node tests/r238-hybrid-host-intelligence-invariants.mjs
      - name: Prove R239 resource governor and R240 recursive exact promotion boundaries
        run: |
          node tests/r239-adaptive-hybrid-resource-governor-invariants.mjs
          node tests/r240-recursive-exact-self-promotion-invariants.mjs
          node tests/r240-live-continuity-promotion-invariants.mjs
          node tests/r2481-deployment-receipt-audit-truth-invariants.mjs
      - name: Prove R258 private SAI doorway without new workflow authority
        run: |
          node tests/r256-private-sai-doorway-invariants.mjs
          node tests/r256-private-sai-doorway-protocol-e2e.mjs
          npx wrangler deploy --config wrangler.sai-door-r256.jsonc --dry-run --outdir .wrangler-r256-doorway
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run


  omega7-user-parity:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install
      - name: Build exact OMEGA7 candidate
        run: npm run build
      - name: Install pinned browser proof harness
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Start exact built preview
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/omega7-r446-vite.log 2>&1 &
          echo $! > /tmp/omega7-r446-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/?omega7=1 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega7-r446-vite.log
          exit 1
      - name: Prove 44-route desktop and mobile OMEGA7 parity
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/omega7-r446-browser-parity-e2e.mjs
      - name: Prove OMEGA7 failure containment and recovery
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/omega7-r447-failure-recovery-e2e.mjs
      - name: Prove OMEGA7 shell and representative-route performance budgets
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/omega7-r447-performance-e2e.mjs
      - name: Prove OMEGA7 to OMEGA6 rollback and re-entry
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/omega7-r449-rollback-e2e.mjs
      - name: Prove OMEGA7 failure isolation across all native families
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/omega7-r452-family-failure-e2e.mjs
      - name: Prove OMEGA7 full 44-route performance budgets
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/omega7-r452-full-performance-e2e.mjs
      - name: Prove R510 visual-functional HOME on exact built candidate
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
          OMEGA_R510_USE_FIXTURES: '1'
        run: node tests/r510-omega7-visual-functional-browser-e2e.mjs
      - name: Stop OMEGA7 parity preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/omega7-r446-vite.pid ]; then kill "$(cat /tmp/omega7-r446-vite.pid)" || true; fi


  candidate-cloudflare-preview:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: omega-r512-candidate-preview
      cancel-in-progress: false
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OMEGA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      OMEGA_HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-fund
      - name: Wait for production-proven base before Preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OMEGA_RELEASE_GUARD_MODE: PR
          OMEGA_PR_NUMBER: ${{ github.event.pull_request.number }}
          OMEGA_EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/releaseCandidateGuardR210.mjs
      - name: Install pinned candidate browser proof runtime
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Require Cloudflare Preview credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error title=R512 PREVIEW AUTH REQUIRED::OMEGA_CLOUDFLARE_TOKEN is unavailable.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error title=R512 PREVIEW ACCOUNT REQUIRED::CLOUDFLARE_ACCOUNT_ID is unavailable.'; exit 1; }
      - name: Deploy isolated exact-head Cloudflare Preview
        id: preview
        shell: bash
        run: |
          set -Eeuo pipefail
          PREVIEW_NAME="pr-${{ github.event.pull_request.number }}-${OMEGA_CANDIDATE_SHA:0:8}"
          echo "name=$PREVIEW_NAME" >> "$GITHUB_OUTPUT"
          OUT="$(mktemp)"
          export GITHUB_SHA="$OMEGA_CANDIDATE_SHA"
          export GITHUB_REF_NAME="$OMEGA_HEAD_REF"
          export OMEGA_CANDIDATE_SHA
          unset OMEGA_PROMOTED_SHA OMEGA_ROLLBACK_SHA
          npx --yes wrangler@4.148.0 preview --config wrangler.preview-r512.jsonc --worker-name omegav6 --name "$PREVIEW_NAME" --ignore-base-config --message "R512 exact candidate $OMEGA_CANDIDATE_SHA" --json > "$OUT"
          cat "$OUT"
          PREVIEW_URL="$(PREVIEW_NAME="$PREVIEW_NAME" node - "$OUT" <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync(process.argv[2],'utf8').trim();
          let parsed=null;
          try{parsed=JSON.parse(raw)}catch{}
          const urls=[];
          const walk=value=>{
            if(typeof value==='string'&&/^https:\/\//i.test(value))urls.push(value);
            else if(Array.isArray(value))for(const x of value)walk(x);
            else if(value&&typeof value==='object')for(const x of Object.values(value))walk(x);
          };
          if(parsed)walk(parsed);
          if(!urls.length)for(const match of raw.matchAll(/https:\/\/[^\s"'<>]+/g))urls.push(match[0]);
          const prefix=`${process.env.PREVIEW_NAME}-omegav6.`;
          const url=urls.find(x=>x.includes(prefix))||null;
          if(!url)throw new Error(`R512 Preview URL missing for ${process.env.PREVIEW_NAME}; observed ${JSON.stringify(urls)}`);
          process.stdout.write(url.replace(/\/$/,''));
          NODE
          )"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "R512 exact candidate Preview: $PREVIEW_URL"
      - name: Prove candidate-owned assets and visual-functional runtime before merge
        env:
          OMEGA_E2E_URL: ${{ steps.preview.outputs.url }}
          OMEGA_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tests/r512-cloudflare-candidate-preview-browser-e2e.mjs
          node tests/r499-sequential-bridge-browser-e2e.mjs
          node tests/r510-omega7-visual-functional-browser-e2e.mjs
      - name: Delete exact candidate Preview
        if: always()
        shell: bash
        env:
          PREVIEW_NAME: ${{ steps.preview.outputs.name }}
        run: |
          if [ -n "$PREVIEW_NAME" ]; then
            npx --yes wrangler@4.148.0 preview delete --config wrangler.preview-r512.jsonc --worker-name omegav6 --name "$PREVIEW_NAME" --skip-confirmation || true
          fi

  cloudflare-auth-probe:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Verify production secret availability
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=AUTH REQUIRED::Repository secret OMEGA_CLOUDFLARE_TOKEN is not available to the production environment."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=ACCOUNT REQUIRED::CLOUDFLARE_ACCOUNT_ID is not available to the production environment."
            exit 1
          fi
          echo "Cloudflare production secrets are present."
      - name: Verify Cloudflare token without deployment
        run: npx wrangler whoami

  deploy-main:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: omega-canonical-production-deploy
      cancel-in-progress: false
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact deployment checkout
        shell: bash
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error title=DEPLOY CHECKOUT DRIFT::Expected workflow SHA $GITHUB_SHA but checkout resolved to $checked_out_sha."
            exit 1
          fi
          echo "Exact deployment checkout bound to $checked_out_sha."
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify this run still owns current main
        shell: bash
        run: |
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "::error title=SUPERSEDED RELEASE::This run targets $GITHUB_SHA but current main is $current_main. Refusing production deployment."
            exit 1
          fi
          echo "Exact current-main ownership confirmed for $GITHUB_SHA."
      - name: Bind promoted merge lineage
        shell: bash
        run: |
          if git rev-parse --is-shallow-repository | grep -qx true; then
            echo "::error title=SHALLOW LINEAGE UNSAFE::Deployment checkout became shallow before merge-parent binding."
            exit 1
          fi
          parents="$(git cat-file -p "$GITHUB_SHA" | awk '/^parent /{print $2}')"
          set -- $parents
          if [ "$#" -ne 2 ]; then
            echo "::error title=LINEAGE REQUIRED::Promoted main commit must be an exact two-parent merge commit before release lineage can be bound."
            exit 1
          fi
          echo "OMEGA_ROLLBACK_SHA=$1" >> "$GITHUB_ENV"
          echo "OMEGA_CANDIDATE_SHA=$2" >> "$GITHUB_ENV"
          echo "OMEGA_PROMOTED_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Bound governed release lineage without exposing credentials."
      - name: Refuse production unless exact candidate passed full acceptance sequence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OMEGA_RELEASE_GUARD_MODE: PUSH
        run: node scripts/releaseCandidateGuardR210.mjs
      - run: npm install
      - name: Install pinned browser proof runtime
        run: npm install --no-save playwright@1.63.0
      - name: Audit locked application dependency tree
        run: npm audit --audit-level=high
      - name: Cloudflare authorization preflight
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=AUTH REQUIRED::Repository secret OMEGA_CLOUDFLARE_TOKEN is not available to the production deployment job."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Cloudflare account discovery::CLOUDFLARE_ACCOUNT_ID is not set; Wrangler will attempt account discovery from the API token."
          fi
      - name: Stage, prove, and Deploy canonical OMEGA Worker
        id: deploy_worker
        env:
          OMEGA_WORKER_NAME: omegav6
        run: bash scripts/staged-cloudflare-release.sh
      - name: Deploy isolated private SAI doorway
        id: sai_doorway
        run: npx wrangler deploy --config wrangler.sai-door-r256.jsonc
      - name: Verify private SAI doorway non-disclosure boundary
        id: sai_doorway_hidden
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_SAI_DOOR_URL.replace(/\/$/,'');
          const invalid='x'.repeat(64);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function hidden(path){
            let last='';
            for(let attempt=1;attempt<=12;attempt++){
              try{
                const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}});
                const text=await r.text();
                if(r.status===404&&String(r.headers.get('x-robots-tag')||'').includes('noindex')){console.log(`R258 PRIVATE HIDDEN PASS ${path} attempt ${attempt}`);return}
                last=`HTTP ${r.status} ${text.slice(0,180)}`;
              }catch(e){last=String(e)}
              await sleep(5000);
            }
            throw new Error(`R258 private hidden-boundary verification failed ${path}: ${last}`);
          }
          await hidden('/');
          await hidden('/sai-door/'+invalid);
          await hidden('/api/admin/sai-peers');
          console.log('R258 private SAI doorway deployed and public discovery boundary is closed.');
          NODE
      - name: Verify canonical public runtime
        id: live_runtime
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const targets=[['root','/'],['health','/api/health'],['core-health','/api/core-health'],['status','/api/status'],['restoration','/api/restoration'],['hybrid','/api/hybrid/status']];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function verifyCoreHealth(response,data,path){
            if(data.schema!=='OMEGA_CANONICAL_CORE_HEALTH_R163'||data.revision!=='R163'||data.state!=='LIVE'||data.ok!==true)throw new Error(`R163 core health schema/state mismatch on ${path}`);
            if(data.canonicalRequest!==true)throw new Error(`R163 canonical request identity missing on ${path}`);
            if(data.requiredBindings?.assets!==true||data.requiredBindings?.durableRuntime!==true)throw new Error(`R163 required core binding proof missing on ${path}`);
            if(data.executionPlanes?.sovereignGateway?.requiredForCoreHealth!==false)throw new Error(`R163 optional sovereign gateway boundary regressed on ${path}`);
            if(data.executionPlanes?.canonicalAdmission?.authority!=='R125')throw new Error(`R163 canonical admission authority regressed on ${path}`);
            if(response.headers.get('x-omega-core-health')!=='R163-FIRST-HAND')throw new Error(`R163 first-hand health header missing on ${path}`);
            if(response.headers.get('x-omega-canonical-origin')!==base)throw new Error(`R163 canonical origin header mismatch on ${path}`);
          }
          function verifyHybrid(data){
            const current=Array.isArray(data.devices)?data.devices.filter(d=>d?.online&&!d?.revoked):[];
            if(data.state==='VERIFIED_DEVICE_ONLINE'){
              if(data.nativeExecutionClaimed!==true||current.length<1)throw new Error('Hybrid claims PC online without a current authenticated device heartbeat');
              return;
            }
            if(data.state==='DEVICE_PROOF_REQUIRED'){
              if(data.nativeExecutionClaimed!==false||current.length!==0)throw new Error('Hybrid claims device-proof-required while current online proof exists');
              return;
            }
            throw new Error(`Hybrid returned unsupported truth state ${data.state}`);
          }
          async function probe(name,path){
            let last='';
            for(let attempt=1;attempt<=12;attempt++){
              try{
                const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}});
                const text=await r.text();
                if(r.ok && text.length){
                  const data=path.startsWith('/api/')?JSON.parse(text):null;
                  if(path==='/api/health'||path==='/api/core-health')verifyCoreHealth(r,data,path);
                  if(path==='/api/hybrid/status')verifyHybrid(data);
                  console.log(`LIVE VERIFY ${name}: HTTP ${r.status} attempt ${attempt}`);
                  return;
                }
                last=`HTTP ${r.status} ${text.slice(0,240)}`;
              }catch(e){last=e instanceof Error?e.message:String(e)}
              await sleep(5000);
            }
            throw new Error(`${name} verification failed: ${last}`);
          }
          for(const [name,path] of targets) await probe(name,path);
          console.log(`OMEGA R163 public verification PASS: ${base}`);
          NODE
      - name: Verify canonical Hybrid agent download
        id: hybrid_agent
        shell: bash
        run: |
          node <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const expectedSha256=createHash('sha256').update(readFileSync('public/omega-hybrid-agent.py')).digest('hex');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let attempt=1;attempt<=12;attempt++){
            try{
              const r=await fetch(base+'/api/hybrid/agent-download',{headers:{'cache-control':'no-cache'}});
              const text=await r.text();
              if(!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0,240)}`);
              if(text.length<1000) throw new Error(`agent too small: ${text.length} bytes`);
              if(!text.startsWith('#!/usr/bin/env python3')) throw new Error('agent is not Python source');
              if(!text.includes("DEFAULT_SERVER='https://omegav6.jeffdeweyeljefe.workers.dev'")) throw new Error('agent canonical server binding missing');
              if(!text.includes('OMEGA Hybrid Link agent')) throw new Error('agent signature missing');
              const origin=r.headers.get('x-omega-canonical-origin');
              if(origin!==base) throw new Error(`canonical origin header mismatch: ${origin}`);
              const version=r.headers.get('x-omega-agent-version');
              if(!version) throw new Error('agent version header missing');
              const servedSha256=createHash('sha256').update(text).digest('hex');
              const receiptSha256=r.headers.get('x-omega-agent-sha256');
              if(servedSha256!==expectedSha256) throw new Error(`agent source SHA-256 mismatch: expected ${expectedSha256}, received ${servedSha256}`);
              if(receiptSha256!==expectedSha256) throw new Error(`agent receipt SHA-256 mismatch: ${receiptSha256}`);
              console.log(`OMEGA HYBRID AGENT LIVE PASS · ${version} · ${text.length} bytes · sha256 ${servedSha256} · ${origin}`);
              process.exit(0);
            }catch(error){last=error instanceof Error?error.message:String(error)}
            await sleep(5000);
          }
          throw new Error(`canonical Hybrid agent verification failed: ${last}`);
          NODE
      - name: Verify Federation Run and canonical RCWA downloads
        id: federation_rcwa
        run: node scripts/verify_federation_live_r1681.mjs
      - name: Verify R8 Earth evidence and governed Hybrid contracts
        id: earth_r8
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          async function get(path){
            const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}});
            const raw=await r.text();
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${raw.slice(0,500)}`);
            return JSON.parse(raw);
          }
          async function post(path,body){
            const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify(body)});
            const raw=await r.text();
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${raw.slice(0,500)}`);
            return JSON.parse(raw);
          }
          const caps=await get('/api/hybrid/capabilities');
          if(!String(caps.state||'').includes('DEVICE_PROOF_REQUIRED')) throw new Error('R8 Hybrid capability truth gate missing');
          if(!Array.isArray(caps.operations)||!caps.operations.includes('TRAIN_LOCAL')||!caps.operations.includes('BUILD')||!caps.operations.includes('READ_VISIBLE_TEXT')||!caps.operations.includes('SAR_R344_CLOSURE')) throw new Error('R345 Hybrid typed operation registry incomplete');
          if(caps.trainLocal?.foundationWeightsChanged!==false) throw new Error('TRAIN_LOCAL foundation-weight truth boundary regressed');
          const plan=await post('/api/hybrid/plan',{prompt:'Inspect this project, hash the tree, repair the smallest proven defect, build, test, package, and return proof.',root:'.'});
          if(plan.draft?.state!=='DRAFT_ONLY_NOT_QUEUED'||plan.draft?.confirmed!==false||plan.draft?.deviceId!==null) throw new Error('Hybrid draft mutated queue/confirmation/device state');
          if(!Array.isArray(plan.draft?.operations)||plan.draft.operations[0]?.op!=='INDEX'||plan.draft.operations[1]?.op!=='HASH_TREE') throw new Error('broad-root discovery gate missing from Hybrid draft');
          const validation=await post('/api/hybrid/validate',{plan:plan.draft});
          if(validation.valid!==true) throw new Error(`Hybrid validation failed: ${JSON.stringify(validation)}`);
          const earth=await get('/api/earth/evidence?lat=32.2217&lon=-110.9265');
          if(earth.schema!=='OMEGA_EARTH_EVIDENCE_V1'||earth.target?.crs!=='WGS84 / EPSG:4326'||String(earth.evidenceHash||'').length!==64) throw new Error('R8 Earth evidence schema/hash/WGS84 contract missing');
          for(const source of ['usgs','eonet','swpc','openMeteo']) if(!earth.sources?.[source]) throw new Error(`Earth source envelope missing ${source}`);
          const noaa=await get('/api/earth/noaa/catalog');
          if(noaa.schema!=='OMEGA_EARTH_NOAA_CATALOG_V1'||!Array.isArray(noaa.coverages)||noaa.coverages.length!==9) throw new Error('NOAA nine-coverage catalog missing');
          for(const id of ['G19-CONUS','G19-FD','G18-FD','G19-CAR','G19-CAM','G19-TAW','G19-CAN','G18-WUS','G18-TPW']) if(!noaa.coverages.some(x=>x.id===id)) throw new Error(`NOAA coverage missing ${id}`);
          console.log('OMEGA R8 PUBLIC RESTORE PASS · Earth evidence envelope + NOAA 9 coverage identities + Hybrid V90 draft/validation');
          NODE
      - name: Verify R9 Earth ground traversal contracts
        id: earth_r9
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const r=await fetch(base+'/api/earth/ground/evidence?lat=32.2217&lon=-110.9265&radius=750',{headers:{'cache-control':'no-cache'}});
          const raw=await r.text();
          if(!r.ok) throw new Error(`ground evidence HTTP ${r.status}: ${raw.slice(0,600)}`);
          const g=JSON.parse(raw);
          if(g.schema!=='OMEGA_EARTH_GROUND_EVIDENCE_V1'||g.target?.crs!=='WGS84 / EPSG:4326'||String(g.evidenceHash||'').length!==64) throw new Error('R9 ground schema/WGS84/hash contract missing');
          for(const level of ['EARTH','REGION','CITY','STREET','GROUND']) if(!g.levels?.[level]) throw new Error(`R9 hierarchy missing ${level}`);
          for(const source of ['kartaView','usgsEpqs','osmReverse','osmOverpass']) if(!g.sources?.[source]) throw new Error(`R9 source envelope missing ${source}`);
          if(g.levels.STREET?.state==='RETURNED_KARTAVIEW_PHOTO'&&!g.levels.STREET?.photo) throw new Error('street evidence claimed without returned photo');
          if(g.levels.GROUND?.state==='RETURNED_USGS_ELEVATION'&&!Number.isFinite(Number(g.levels.GROUND?.elevationM))) throw new Error('ground elevation claimed without numeric USGS value');
          console.log('OMEGA R9 PUBLIC GROUND PASS · Earth→Region→City→Street→Ground source envelopes verified; unavailable providers allowed without synthetic substitution');
          NODE
      - name: Verify live route-before-generation and AI synthesis
        id: live_ai
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          async function post(path,body){
            const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify(body)});
            const text=await r.text();
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${text.slice(0,400)}`);
            return JSON.parse(text);
          }
          const text='Explain the current OMEGA continuity relationship in one concise sentence.';
          const route=await post('/api/route-preview',{text});
          if(!String(route.route||'').startsWith('ROUTED_MODEL')) throw new Error(`route-before-generation classifier did not select model route: ${JSON.stringify(route)}`);
          const context={address:11498,stateId:11499,phase:8,decision:'TURN',modePolicy:'ALL',modeCount:179,nextAddress:11499,metrics:{continuity:.5,plasticity:.5,contradiction:.2,burden:.3,scar:.2,evidence:.5}};
          const chat=await post('/api/chat',{text,context});
          if(chat.ok!==true) throw new Error(`chat did not return ok: ${JSON.stringify(chat)}`);
          if(chat.modelInvoked!==true) throw new Error(`Workers AI synthesis did not execute; fallback is not accepted as AI LIVE PASS: ${JSON.stringify(chat)}`);
          if(!String(chat.provider||'').startsWith('WORKERS_AI:')) throw new Error(`unexpected live synthesis provider: ${chat.provider}`);
          if(String(chat.reply||'').trim().length<12) throw new Error('live AI returned an empty/insufficient reply');
          console.log(`OMEGA LIVE AI PASS · ${chat.provider} · route ${route.route}`);
          NODE
      - name: Record exact live production observability
        id: production_observability_r471
        if: always() && steps.deploy_worker.outcome == 'success'
        env:
          OMEGA_WORKER_VERSION_ID: ${{ steps.deploy_worker.outputs.candidate_version_id }}
        run: node scripts/verify_production_observability_r471.mjs
      - name: Upload exact live production observability receipt
        if: always() && steps.production_observability_r471.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: omega-production-observability-${{ github.sha }}
          path: artifacts/omega-production-observability-r471.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify deployed R200 total-experience browser on exact promoted SHA
        id: browser_r200
        shell: bash
        run: OMEGA_E2E_URL="$OMEGA_PUBLIC_URL" OMEGA_EXPECTED_SHA="$OMEGA_PROMOTED_SHA" node tests/r200-current-browser-proof-e2e.mjs
      - name: Verify deployed R510 visual-functional HOME on exact promoted runtime
        id: browser_r510
        shell: bash
        run: OMEGA_E2E_URL="$OMEGA_PUBLIC_URL" OMEGA_EXPECTED_SHA="$OMEGA_PROMOTED_SHA" node tests/r510-omega7-visual-functional-browser-e2e.mjs
      - name: Verify live R202 operational source-authority surface
        id: live_r202
        run: node scripts/verify_live_operational_source_authority_r202.mjs
      - name: Verify live R237 authenticated Hybrid command authority
        id: live_r237
        if: always() && steps.deploy_worker.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify_live_hybrid_command_authority_r237.mjs
      - name: Verify live R238 Hybrid host intelligence
        id: live_r238
        if: always() && steps.deploy_worker.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify_live_hybrid_host_intelligence_r238.mjs
      - name: Enforce complete Hybrid live-proof closure
        if: always() && steps.deploy_worker.outcome == 'success'
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.live_r237.outcome }}" != "success" ]; then
            echo "::error title=R237 LIVE PROOF FAILED::R237 outcome=${{ steps.live_r237.outcome }}"
            failed=1
          fi
          if [ "${{ steps.live_r238.outcome }}" != "success" ]; then
            echo "::error title=R238 LIVE PROOF FAILED::R238 outcome=${{ steps.live_r238.outcome }}"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "R240.1 production truth closure FAILED: both R237 and R238 live proofs are independently observable and both are required."
            exit 1
          fi
          echo "R240.1 production truth closure PASS: R237 and R238 live proofs both succeeded."
      - name: Roll back canonical OMEGA Worker on post-promotion proof failure
        if: failure() && steps.deploy_worker.outputs.previous_version_id != '' && steps.deploy_worker.outputs.rollback_eligible == 'true'
        id: rollback_worker
        shell: bash
        run: |
          status_json="$(mktemp)"
          npx wrangler deployments status --name omegav6 --json > "$status_json"
          node - "$status_json" "${{ steps.deploy_worker.outputs.candidate_version_id }}" <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const candidate=process.argv[3],rows=[];
          function walk(value){
            if(!value||typeof value!=='object')return;
            if(Array.isArray(value)){for(const x of value)walk(x);return}
            const id=typeof value.version_id==='string'?value.version_id:(typeof value.versionId==='string'?value.versionId:null);
            const raw=value.percentage??value.traffic_percentage??value.trafficPercentage;
            const pct=Number(raw);
            if(id&&Number.isFinite(pct)&&pct>0.001)rows.push({id,pct});
            for(const x of Object.values(value))walk(x);
          }
          walk(data);
          const serving=[...new Map(rows.map(x=>[x.id,x])).values()];
          if(serving.length!==1||serving[0].id!==candidate||serving[0].pct<99.999){
            console.error(`ROLLBACK OWNERSHIP LOST: candidate=${candidate} serving=${JSON.stringify(serving)}`);
            process.exit(1);
          }
          console.log(`Rollback ownership confirmed: exact candidate ${candidate} still owns 100% traffic.`);
          NODE
          rm -f "$status_json"
          npx wrangler rollback "${{ steps.deploy_worker.outputs.previous_version_id }}" --name omegav6 --message "OMEGA automatic rollback after live proof failure for $GITHUB_SHA"
      - name: Refuse rollback to an unproved or known-bad baseline
        if: failure() && steps.deploy_worker.outputs.previous_version_id != '' && steps.deploy_worker.outputs.rollback_eligible != 'true'
        shell: bash
        run: echo "::warning title=ROLLBACK REFUSED::Post-promotion proof failed, but the previous Worker did not prove usable and cannot regain production authority."
      - name: Record deployment receipt
        if: always()
        shell: bash
        run: |
          {
            echo "## OMEGA production deployment"
            echo "- Commit: $GITHUB_SHA"
            echo "- Candidate: ${OMEGA_CANDIDATE_SHA:-UNAVAILABLE}"
            echo "- Rollback: ${OMEGA_ROLLBACK_SHA:-UNAVAILABLE}"
            echo "- Runtime: $OMEGA_PUBLIC_URL"
            echo "- Private SAI doorway: $OMEGA_SAI_DOOR_URL"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Production deployment concurrency: serialized · no in-progress cancellation"
            echo "- Verify job: ${{ needs.verify.result }}"
            echo "- Deployment job: ${{ job.status }}"
            echo "- Canonical Worker staged proof + promotion: ${{ steps.deploy_worker.outcome }}"
            echo "- Previous Cloudflare Worker version: ${{ steps.deploy_worker.outputs.previous_version_id || 'UNAVAILABLE' }}"
            echo "- Candidate Cloudflare Worker version: ${{ steps.deploy_worker.outputs.candidate_version_id || 'UNAVAILABLE' }}"
            echo "- Candidate semantic/browser proof: ${{ steps.deploy_worker.outputs.staged_proof || 'NOT_PROVEN' }}"
            echo "- Release mode: ${{ steps.deploy_worker.outputs.release_mode || 'NOT_REACHED' }}"
            echo "- Previous baseline rollback eligibility: ${{ steps.deploy_worker.outputs.rollback_eligible || 'NOT_PROVEN' }}"
            echo "- Automatic rollback after post-promotion failure: ${{ steps.rollback_worker.outcome || 'not-needed' }}"
            echo "- R258 isolated private SAI doorway deployment: ${{ steps.sai_doorway.outcome }}"
            echo "- R258 private non-disclosure proof: ${{ steps.sai_doorway_hidden.outcome }}"
            echo "- R163 first-hand canonical core health/public runtime: ${{ steps.live_runtime.outcome }}"
            echo "- Canonical Hybrid agent bytes/SHA: ${{ steps.hybrid_agent.outcome }}"
            echo "- Federation + canonical RCWA downloads: ${{ steps.federation_rcwa.outcome }}"
            echo "- R8 Earth/NOAA + Hybrid V90 contracts: ${{ steps.earth_r8.outcome }}"
            echo "- R9 Earth ground source hierarchy: ${{ steps.earth_r9.outcome }}"
            echo "- Workers AI route-before-generation + synthesis: ${{ steps.live_ai.outcome }}"
            echo "- R200.1 exact promoted-SHA desktop/mobile browser proof: ${{ steps.browser_r200.outcome }}"
            echo "- R202 operational source-authority live proof: ${{ steps.live_r202.outcome }}"
            echo "- R237 authenticated Hybrid command authority live proof: ${{ steps.live_r237.outcome }}"
            echo "- R238 Hybrid host intelligence live proof: ${{ steps.live_r238.outcome }}"
            echo "- R239 resource governance remains source-gated by verify job; live command surface reports a declared R239 tier."
            echo "- R240/R322 truth boundary: one canonical ci.yml writer; normal releases use previous@100/candidate@0 exact override proof. If Cloudflare rejects that split specifically for incompatible Durable Object exports and the previous Worker is positively proved to be the application-withholding interlock, R322 permits forward-only candidate@100 export-set recovery followed immediately by the same semantic/browser proof; the broken previous Worker never regains rollback authority. R237/R238 remain independently required after canonical deployment succeeds."
            echo "- R202 archive residual debt remains explicit: AT09 desktop health check PLANNED; AT10 forensic hash ledger PLANNED"
            echo "- Browser proof harness: Playwright 1.63.0 pinned; locked application dependency audit enforced at high severity; current run result is reported by the audit step"
            echo "- R199.1 packaging hygiene: 500 KiB initial-entry budget + clean durable exports + v7 JavaScript actions"
            echo "- Hybrid native execution: VERIFIED_DEVICE_ONLINE requires a current authenticated non-revoked heartbeat; otherwise DEVICE_PROOF_REQUIRED"
          } >> "$GITHUB_STEP_SUMMARY"


  continue-governed-selfbuild:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deploy-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Continue governed self-build after exact production success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo "::notice title=R512 SEQUENCE YIELD::Verify continuation still owns current main: this run owns $GITHUB_SHA but main is $CURRENT_MAIN. A newer canonical run owns the next development turn."
            exit 0
          fi
          echo "Verify continuation still owns current main · $GITHUB_SHA"
          STATE_JSON="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/contents/public/omega-r170-selfbuild-state.json?ref=$GITHUB_SHA" --jq .content | tr -d '\n' | base64 -d > "$STATE_JSON"
          STATIC_EXHAUSTED=true
          while IFS= read -r TARGET; do
            [ -n "$TARGET" ] || continue
            if ! gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET?ref=$GITHUB_SHA" >/dev/null 2>&1; then
              STATIC_EXHAUSTED=false
              break
            fi
          done < <(node - "$STATE_JSON" <<'NODE'
          const fs=require('fs');
          const state=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const row of Array.isArray(state.roadmap)?state.roadmap:[])if(row?.target)console.log(row.target);
          NODE
          )
          rm -f "$STATE_JSON"

          if [ "$STATIC_EXHAUSTED" = true ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/r223-cloudflare-evolution.yml/dispatches" -f ref=main -f 'inputs[immediate_cycle]=true'
            echo "R392 event-driven continuation dispatched to CLOUD-01/R388 after canonical production proof for $GITHUB_SHA; SG001–SG005 source targets are all present."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/r170-governed-selfbuild.yml/dispatches" -f ref=main
            echo "R330 event-driven continuation dispatched to R170 after canonical production proof for $GITHUB_SHA; bounded static roadmap remains incomplete."
          fi
