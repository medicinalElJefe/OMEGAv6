name: OMEGA Cloud Bridge CI

on:
  push:
    branches: [main, full-restore]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

  cloudflare-auth-probe:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify production secret availability
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=AUTH REQUIRED::Repository secret OMEGA_CLOUDFLARE_TOKEN is not available to the production environment."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=ACCOUNT REQUIRED::CLOUDFLARE_ACCOUNT_ID is not available to the production environment."
            exit 1
          fi
          echo "Cloudflare production secrets are present."
      - name: Verify Cloudflare token without deployment
        run: npx wrangler whoami

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind promoted merge lineage
        shell: bash
        run: |
          parents="$(git show -s --format=%P "$GITHUB_SHA")"
          set -- $parents
          if [ "$#" -ne 2 ]; then
            echo "::error title=LINEAGE REQUIRED::Promoted main commit must be an exact two-parent merge commit before release lineage can be bound."
            exit 1
          fi
          echo "OMEGA_ROLLBACK_SHA=$1" >> "$GITHUB_ENV"
          echo "OMEGA_CANDIDATE_SHA=$2" >> "$GITHUB_ENV"
          echo "OMEGA_PROMOTED_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Bound governed release lineage without exposing credentials."
      - run: npm install
      - name: Cloudflare authorization preflight
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=AUTH REQUIRED::Repository secret OMEGA_CLOUDFLARE_TOKEN is not available to the production deployment job."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Cloudflare account discovery::CLOUDFLARE_ACCOUNT_ID is not set; Wrangler will attempt account discovery from the API token."
          fi
      - name: Deploy canonical OMEGA Worker
        run: npx wrangler deploy
      - name: Verify canonical public runtime
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const targets=[['root','/'],['health','/api/health'],['status','/api/status'],['restoration','/api/restoration'],['hybrid','/api/hybrid/status']];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function probe(name,path){
            let last='';
            for(let attempt=1;attempt<=12;attempt++){
              try{
                const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}});
                const text=await r.text();
                if(r.ok && text.length){
                  const data=path.startsWith('/api/')?JSON.parse(text):null;
                  if(path==='/api/hybrid/status' && (data.state!=='DEVICE_PROOF_REQUIRED'||data.nativeExecutionClaimed!==false)) throw new Error('Hybrid truth gate regression');
                  console.log(`LIVE VERIFY ${name}: HTTP ${r.status} attempt ${attempt}`);
                  return;
                }
                last=`HTTP ${r.status} ${text.slice(0,240)}`;
              }catch(e){last=String(e)}
              await sleep(5000);
            }
            throw new Error(`${name} verification failed: ${last}`);
          }
          for(const [name,path] of targets) await probe(name,path);
          console.log(`OMEGA public verification PASS: ${base}`);
          NODE
      - name: Verify canonical Hybrid agent download
        shell: bash
        run: |
          node <<'NODE'
          const {createHash}=require('node:crypto');
          const {readFileSync}=require('node:fs');
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const expectedSha256=createHash('sha256').update(readFileSync('public/omega-hybrid-agent.py')).digest('hex');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let attempt=1;attempt<=12;attempt++){
            try{
              const r=await fetch(base+'/api/hybrid/agent-download',{headers:{'cache-control':'no-cache'}});
              const text=await r.text();
              if(!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0,240)}`);
              if(text.length<1000) throw new Error(`agent too small: ${text.length} bytes`);
              if(!text.startsWith('#!/usr/bin/env python3')) throw new Error('agent is not Python source');
              if(!text.includes("DEFAULT_SERVER='https://omegav6.jeffdeweyeljefe.workers.dev'")) throw new Error('agent canonical server binding missing');
              if(!text.includes('OMEGA Hybrid Link agent')) throw new Error('agent signature missing');
              const origin=r.headers.get('x-omega-canonical-origin');
              if(origin!==base) throw new Error(`canonical origin header mismatch: ${origin}`);
              const version=r.headers.get('x-omega-agent-version');
              if(!version) throw new Error('agent version header missing');
              const servedSha256=createHash('sha256').update(text).digest('hex');
              const receiptSha256=r.headers.get('x-omega-agent-sha256');
              if(servedSha256!==expectedSha256) throw new Error(`agent source SHA-256 mismatch: expected ${expectedSha256}, received ${servedSha256}`);
              if(receiptSha256!==expectedSha256) throw new Error(`agent receipt SHA-256 mismatch: ${receiptSha256}`);
              console.log(`OMEGA HYBRID AGENT LIVE PASS · ${version} · ${text.length} bytes · sha256 ${servedSha256} · ${origin}`);
              process.exit(0);
            }catch(error){last=error instanceof Error?error.message:String(error)}
            await sleep(5000);
          }
          throw new Error(`canonical Hybrid agent verification failed: ${last}`);
          NODE
      - name: Verify R8 Earth evidence and governed Hybrid contracts
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          async function get(path){
            const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}});
            const raw=await r.text();
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${raw.slice(0,500)}`);
            return JSON.parse(raw);
          }
          async function post(path,body){
            const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify(body)});
            const raw=await r.text();
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${raw.slice(0,500)}`);
            return JSON.parse(raw);
          }
          const caps=await get('/api/hybrid/capabilities');
          if(!String(caps.state||'').includes('DEVICE_PROOF_REQUIRED')) throw new Error('R8 Hybrid capability truth gate missing');
          if(!Array.isArray(caps.operations)||!caps.operations.includes('TRAIN_LOCAL')||!caps.operations.includes('BUILD')||!caps.operations.includes('READ_VISIBLE_TEXT')) throw new Error('R8 Hybrid typed operation registry incomplete');
          if(caps.trainLocal?.foundationWeightsChanged!==false) throw new Error('TRAIN_LOCAL foundation-weight truth boundary regressed');
          const plan=await post('/api/hybrid/plan',{prompt:'Inspect this project, hash the tree, repair the smallest proven defect, build, test, package, and return proof.',root:'.'});
          if(plan.draft?.state!=='DRAFT_ONLY_NOT_QUEUED'||plan.draft?.confirmed!==false||plan.draft?.deviceId!==null) throw new Error('Hybrid draft mutated queue/confirmation/device state');
          if(!Array.isArray(plan.draft?.operations)||plan.draft.operations[0]?.op!=='INDEX'||plan.draft.operations[1]?.op!=='HASH_TREE') throw new Error('broad-root discovery gate missing from Hybrid draft');
          const validation=await post('/api/hybrid/validate',{plan:plan.draft});
          if(validation.valid!==true) throw new Error(`Hybrid validation failed: ${JSON.stringify(validation)}`);
          const earth=await get('/api/earth/evidence?lat=32.2217&lon=-110.9265');
          if(earth.schema!=='OMEGA_EARTH_EVIDENCE_V1'||earth.target?.crs!=='WGS84 / EPSG:4326'||String(earth.evidenceHash||'').length!==64) throw new Error('R8 Earth evidence schema/hash/WGS84 contract missing');
          for(const source of ['usgs','eonet','swpc','openMeteo']) if(!earth.sources?.[source]) throw new Error(`Earth source envelope missing ${source}`);
          const noaa=await get('/api/earth/noaa/catalog');
          if(noaa.schema!=='OMEGA_EARTH_NOAA_CATALOG_V1'||!Array.isArray(noaa.coverages)||noaa.coverages.length!==9) throw new Error('NOAA nine-coverage catalog missing');
          for(const id of ['G19-CONUS','G19-FD','G18-FD','G19-CAR','G19-CAM','G19-TAW','G19-CAN','G18-WUS','G18-TPW']) if(!noaa.coverages.some(x=>x.id===id)) throw new Error(`NOAA coverage missing ${id}`);
          console.log('OMEGA R8 PUBLIC RESTORE PASS · Earth evidence envelope + NOAA 9 coverage identities + Hybrid V90 draft/validation');
          NODE
      - name: Verify R9 Earth ground traversal contracts
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const r=await fetch(base+'/api/earth/ground/evidence?lat=32.2217&lon=-110.9265&radius=750',{headers:{'cache-control':'no-cache'}});
          const raw=await r.text();
          if(!r.ok) throw new Error(`ground evidence HTTP ${r.status}: ${raw.slice(0,600)}`);
          const g=JSON.parse(raw);
          if(g.schema!=='OMEGA_EARTH_GROUND_EVIDENCE_V1'||g.target?.crs!=='WGS84 / EPSG:4326'||String(g.evidenceHash||'').length!==64) throw new Error('R9 ground schema/WGS84/hash contract missing');
          for(const level of ['EARTH','REGION','CITY','STREET','GROUND']) if(!g.levels?.[level]) throw new Error(`R9 hierarchy missing ${level}`);
          for(const source of ['kartaView','usgsEpqs','osmReverse','osmOverpass']) if(!g.sources?.[source]) throw new Error(`R9 source envelope missing ${source}`);
          if(g.levels.STREET?.state==='RETURNED_KARTAVIEW_PHOTO'&&!g.levels.STREET?.photo) throw new Error('street evidence claimed without returned photo');
          if(g.levels.GROUND?.state==='RETURNED_USGS_ELEVATION'&&!Number.isFinite(Number(g.levels.GROUND?.elevationM))) throw new Error('ground elevation claimed without numeric USGS value');
          console.log('OMEGA R9 PUBLIC GROUND PASS · Earth→Region→City→Street→Ground source envelopes verified; unavailable providers allowed without synthetic substitution');
          NODE
      - name: Verify live route-before-generation and AI synthesis
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          async function post(path,body){
            const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify(body)});
            const text=await r.text();
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${text.slice(0,400)}`);
            return JSON.parse(text);
          }
          const text='Explain the current OMEGA continuity relationship in one concise sentence.';
          const route=await post('/api/route-preview',{text});
          if(!String(route.route||'').startsWith('ROUTED_MODEL')) throw new Error(`route-before-generation classifier did not select model route: ${JSON.stringify(route)}`);
          const context={address:11498,stateId:11499,phase:8,decision:'TURN',modePolicy:'ALL',modeCount:179,nextAddress:11499,metrics:{continuity:.5,plasticity:.5,contradiction:.2,burden:.3,scar:.2,evidence:.5}};
          const chat=await post('/api/chat',{text,context});
          if(chat.ok!==true) throw new Error(`chat did not return ok: ${JSON.stringify(chat)}`);
          if(chat.modelInvoked!==true) throw new Error(`Workers AI synthesis did not execute; fallback is not accepted as AI LIVE PASS: ${JSON.stringify(chat)}`);
          if(!String(chat.provider||'').startsWith('WORKERS_AI:')) throw new Error(`unexpected live synthesis provider: ${chat.provider}`);
          if(String(chat.reply||'').trim().length<12) throw new Error('live AI returned an empty/insufficient reply');
          console.log(`OMEGA LIVE AI PASS · ${chat.provider} · route ${route.route}`);
          NODE
      - name: Record deployment receipt
        if: always()
        shell: bash
        run: |
          {
            echo "## OMEGA production deployment"
            echo "- Commit: $GITHUB_SHA"
            echo "- Candidate: ${OMEGA_CANDIDATE_SHA:-UNAVAILABLE}"
            echo "- Rollback: ${OMEGA_ROLLBACK_SHA:-UNAVAILABLE}"
            echo "- Runtime: $OMEGA_PUBLIC_URL"
            echo "- Verify job: ${{ needs.verify.result }}"
            echo "- Deployment job: ${{ job.status }}"
            echo "- Live AI synthesis: required for deployment PASS"
            echo "- R8 Earth/NOAA + Hybrid V90 contracts: required for deployment PASS"
            echo "- R9 Earth ground source hierarchy: required for deployment PASS"
            echo "- Hybrid native execution: must remain DEVICE_PROOF_REQUIRED until paired-host proof"
          } >> "$GITHUB_STEP_SUMMARY"
