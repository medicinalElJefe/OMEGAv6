name: OMEGA R151 Sovereign Build Execution Spine

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, r151-sovereign-build-execution-spine]

permissions:
  contents: read

concurrency:
  group: omega-r151-sovereign-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r151:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove authenticated sovereign build execution spine
        run: node tests/r151-sovereign-build-execution-spine-invariants.mjs
      - name: Preserve unified executor and exact Hybrid proof closure
        run: |
          node tests/r147-unified-executor-fabric-invariants.mjs
          node tests/r142-proof-aware-capability-lifecycle-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r132-hybrid-execution-plane-invariants.mjs
      - name: Preserve zero-drift PC connector and admission boundaries
        run: |
          node tests/r127-hybrid-zero-drift-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Canonical Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r151-dry-run
