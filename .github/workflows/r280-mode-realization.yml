name: R280 Mode Realization

on:
  pull_request:
    branches: [main]
  push:
    branches: [r280-mode-realization-promotion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r280:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Prove R280 mode realization and Heavy Bio boundaries
        run: npx --yes tsx tests/r280-mode-realization.mts
      - name: Prove production bundle still compiles
        run: npm run build
      - name: Confirm read-only workflow authority
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('.github/workflows/r280-mode-realization.yml','utf8');
          if(!/permissions:\s*\n\s*contents: read/.test(s)) process.exit(1);
          console.log('R280 authority boundary PASS - contents read only');
          NODE
