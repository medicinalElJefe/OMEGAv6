name: R887 Sphere Agent Fabric
on:
  pull_request:
    paths:
      - 'src/sphereAgentFabricR887.mjs'
      - 'src/SphereAgentInstrumentR887.tsx'
      - 'src/sphereAgentInstrumentR887.css'
      - 'src7/workspaces/ScienceWorkspaceR441.tsx'
      - 'tests/r887-sphere-agent-fabric-invariants.mjs'
      - '.github/workflows/r887-sphere-agent-fabric.yml'
  workflow_dispatch:
jobs:
  fabric-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/r887-sphere-agent-fabric-invariants.mjs
      - run: node tests/r777-science-instrument-navigation-invariants.mjs
      - run: npm run build
