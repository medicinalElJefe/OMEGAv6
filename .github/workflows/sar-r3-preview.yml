name: SAR R3 Preview

on:
  push:
    branches:
      - release/sar-r3-workstation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sar-r3-preview
  cancel-in-progress: true

env:
  SAR_PUBLIC_URL: https://omega-sar-r3.jeffdeweyeljefe.workers.dev

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify SAR source
        working-directory: sar-accumulation-studio
        run: |
          npm run check
          npm test
      - name: Build self-contained GeoTIFF browser runtime
        working-directory: sar-accumulation-studio
        run: |
          npm install --no-package-lock
          mkdir -p vendor
          npx --yes esbuild@0.25.9 src/geotiff-entry.mjs --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=vendor/geotiff.bundle.mjs
          test -s vendor/geotiff.bundle.mjs
          echo "GeoTIFF bundle bytes: $(wc -c < vendor/geotiff.bundle.mjs)"
      - name: Verify Cloudflare authorization
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@latest whoami
      - name: Dry-run R3 worker
        run: npx wrangler@latest deploy --config wrangler.sar-r3.jsonc --dry-run --outdir .wrangler-sar-r3
      - name: Deploy R3 worker
        run: npx wrangler@latest deploy --config wrangler.sar-r3.jsonc
      - name: Verify R3 root, module, vendor, and API transport
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            code="$(curl -sS -o /tmp/r3.html -w '%{http_code}' -H 'cache-control: no-cache' "$SAR_PUBLIC_URL/" || true)"
            if [ "$code" = 200 ] && grep -q 'OMEGA SAR · R3' /tmp/r3.html; then break; fi
            test "$attempt" != 20 || { echo 'R3 root identity did not become live'; exit 1; }
            sleep 3
          done
          code="$(curl -sS -o /tmp/r3-app.mjs -w '%{http_code}' -H 'cache-control: no-cache' "$SAR_PUBLIC_URL/src/app.mjs")"
          test "$code" = 200 || { echo "R3 app module HTTP $code"; exit 1; }
          grep -q "visual: 'earth'" /tmp/r3-app.mjs
          for module in location.mjs sar-earth-overlay.mjs sentinel-console.mjs; do
            code="$(curl -sS -o "/tmp/$module" -w '%{http_code}' "$SAR_PUBLIC_URL/src/$module")"
            test "$code" = 200 || { echo "R3 $module HTTP $code"; exit 1; }
          done
          code="$(curl -sS -o /tmp/geotiff.mjs -w '%{http_code}' "$SAR_PUBLIC_URL/vendor/geotiff.bundle.mjs")"
          test "$code" = 200 || { echo "R3 GeoTIFF bundle HTTP $code"; exit 1; }
          test "$(wc -c < /tmp/geotiff.mjs)" -gt 50000 || { echo 'R3 GeoTIFF bundle unexpectedly small'; exit 1; }
          code="$(curl -sS -o /tmp/stac.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"collections":["sentinel-1-grd"],"limit":1,"intersects":{"type":"Point","coordinates":[-110.9747,32.2226]}}' "$SAR_PUBLIC_URL/api/stac/search")"
          test "$code" = 200 || { cat /tmp/stac.json; echo "R3 same-origin STAC proxy HTTP $code"; exit 1; }
          grep -q 'FeatureCollection' /tmp/stac.json
          gibs_source='https://gibs.earthdata.nasa.gov/wms/epsg4326/nrt/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&SRS=EPSG%3A4326&BBOX=-180%2C-90%2C180%2C90&WIDTH=512&HEIGHT=256&FORMAT=image%2Fpng&TRANSPARENT=FALSE&TIME=2026-09-07&LAYERS=VIIRS_NOAA21_CorrectedReflectance_TrueColor&STYLES='
          code="$(curl -sS -D /tmp/gibs.headers -o /tmp/gibs.bin -w '%{http_code}' --get --data-urlencode "url=$gibs_source" "$SAR_PUBLIC_URL/api/gibs")"
          test "$code" = 200 || { echo "R3 NASA GIBS proxy HTTP $code"; cat /tmp/gibs.headers; exit 1; }
          grep -qi '^content-type: image/' /tmp/gibs.headers || { echo 'R3 NASA GIBS upstream did not return an image'; cat /tmp/gibs.headers; head -c 800 /tmp/gibs.bin || true; exit 1; }
      - name: Install Chromium proof runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove real live Sentinel-1 workflow
        working-directory: sar-accumulation-studio
        env:
          SAR_TEST_URL: ${{ env.SAR_PUBLIC_URL }}
        run: node tests/r3-live-data-e2e.mjs
