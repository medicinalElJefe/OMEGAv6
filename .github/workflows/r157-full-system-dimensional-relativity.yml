name: OMEGA R157 Full System + Capability Manifold

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OMEGA_E2E_URL: http://127.0.0.1:4173

jobs:
  prove-r157:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Prove R156 dimensional relativity
        run: node tests/r156-dimensional-relativity-evolution-invariants.mjs

      - name: Prove R157 capability manifold
        run: node tests/r157-capability-manifold-invariants.mjs

      - name: Prove R157 full one-system convergence
        run: node tests/r157-full-one-system-convergence-invariants.mjs

      - name: Preserve R48 current successor ledger
        run: node tests/r48-completion-convergence-invariants.mjs

      - name: Preserve R95 one-system recovery ancestry
        run: node tests/r95-full-system-recovery-invariants.mjs

      - name: Preserve dimensional R24 ancestry
        run: node tests/dimensional-relativity-r24-invariants.mjs

      - name: Preserve Woven Continuity R77 ancestry
        run: node tests/r77-woven-continuity-invariants.mjs

      - name: Preserve R132 relational physics ancestry
        run: node tests/r132-relational-physics-manifold-invariants.mjs

      - name: Preserve R134 woven relativity continuum ancestry
        run: node tests/r134-woven-relativity-continuum-invariants.mjs

      - name: Preserve latest R155 navigation information architecture
        run: node tests/r155-navigation-information-architecture-invariants.mjs

      - name: Compile native Hybrid and RCWA agents
        run: |
          python -m py_compile public/omega-hybrid-agent.py
          python -m py_compile public/omega-rcwa-agent.py
          python -m py_compile public/omega-rcwa-worker.py

      - name: Preserve R127 Hybrid zero-drift connector
        run: node tests/r127-hybrid-zero-drift-invariants.mjs

      - name: Preserve R132 Hybrid execution plane
        run: node tests/r132-hybrid-execution-plane-invariants.mjs

      - name: Preserve R141 Hybrid proof closure
        run: node tests/r141-hybrid-proof-scar-replay-invariants.mjs

      - name: Preserve R142 proof-aware capability lifecycle
        run: node tests/r142-proof-aware-capability-lifecycle-invariants.mjs

      - name: Preserve R151 native build execution spine
        run: node tests/r151-sovereign-build-execution-spine-invariants.mjs

      - name: Preserve R153 adaptive sovereign missions
        run: node tests/r153-adaptive-sovereign-build-missions-invariants.mjs

      - name: Full inherited static regression and production build
        run: npm run check

      - name: Install Chromium for all-route desktop and mobile proof
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact production build locally
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/omega-r157-preview.log 2>&1 &
          echo $! >/tmp/omega-r157-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-r157-preview.log
          exit 1

      - name: Exercise all 44 routes on desktop and mobile
        run: node tests/r118-browser-operational-e2e.mjs

      - name: Browser diagnostics on failure
        if: failure()
        run: cat /tmp/omega-r157-preview.log || true

      - name: Canonical Worker bundle dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r157-dry-run
