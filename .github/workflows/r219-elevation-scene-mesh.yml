name: R219 Source-Backed Elevation Scene Mesh

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/world/elevationSceneMeshR219.js'
      - 'tests/r219-source-backed-elevation-mesh-invariants.mjs'
      - '.github/workflows/r219-elevation-scene-mesh.yml'
  push:
    branches: [r219-source-backed-elevation-mesh]

permissions:
  contents: read

jobs:
  prove-r219-elevation-scene-mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove R219 source-backed elevation mesh
        run: node tests/r219-source-backed-elevation-mesh-invariants.mjs
      - name: Preserve R218 evidence-bound WGS84 field
        run: node tests/r218-geospatial-scene-field-invariants.mjs
      - name: Preserve R217 through R208 render and world lineage
        run: |
          node tests/r217-evidence-reconstruction-frame-invariants.mjs
          node tests/r216-evidence-reconstruction-intent-invariants.mjs
          node tests/r215-render-artifact-continuity-invariants.mjs
          node tests/r214-render-attempt-continuity-invariants.mjs
          node tests/r213-adaptive-render-attempt-lineage-invariants.mjs
          node tests/r211-render-intent-lineage-invariants.mjs
          node tests/r208-durable-mission-world-head-binding-invariants.mjs
      - name: Preserve mission, federation and canonical-world continuity
        run: |
          node tests/r206-world-mission-continuity-invariants.mjs
          node tests/r174-living-world-pulse-invariants.mjs
          node tests/r173-federation-ledger-world-observer-invariants.mjs
          node tests/r172-federation-ledger-world-binding-invariants.mjs
          node tests/r171-federation-receipt-world-reconciler-invariants.mjs
          node tests/r114-federation-closure-invariants.mjs
          node tests/r140-unified-living-operation-fabric.mjs
          node tests/r136-living-world-frame-invariants.mjs
          node tests/r134-canonical-world-continuity.mjs
          node tests/r149-durable-world-head-continuity-invariants.mjs
      - name: Preserve Hybrid, Earth and computed-reality truth gates
        run: |
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
      - name: Preserve R125 admission authority
        run: node tests/r125-accuracy-engine-invariants.mjs
      - name: Run inherited regression and production build
        run: npm run check
      - name: Prove canonical Worker package remains deployable
        run: npx wrangler deploy --dry-run --outdir .wrangler-r219-dry-run
