name: R256 Private SAI Doorway

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/privateSaiDoorwayR256.js'
      - 'src/privateSaiAdminR256.js'
      - 'src/privateSaiDoorwayWorkerR256.js'
      - 'wrangler.sai-door-r256.jsonc'
      - 'tests/r256-private-sai-doorway-*.mjs'
      - '.github/workflows/r256-private-sai-doorway.yml'
  push:
    branches: [main]
    paths:
      - 'src/privateSaiDoorwayR256.js'
      - 'src/privateSaiAdminR256.js'
      - 'src/privateSaiDoorwayWorkerR256.js'
      - 'wrangler.sai-door-r256.jsonc'
      - 'tests/r256-private-sai-doorway-*.mjs'
      - '.github/workflows/r256-private-sai-doorway.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMEGA_SAI_DOOR_URL: https://omega-sai-door-r256.jeffdeweyeljefe.workers.dev

jobs:
  verify-private-doorway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: R256 source isolation invariants
        run: node tests/r256-private-sai-doorway-invariants.mjs
      - name: R256 A2A MCP ledger executable proof
        run: node tests/r256-private-sai-doorway-protocol-e2e.mjs
      - name: Compile isolated private Worker without deployment
        run: npx wrangler deploy --config wrangler.sai-door-r256.jsonc --dry-run --outdir .wrangler-r256-doorway

  deploy-private-doorway:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify-private-doorway
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Require existing Cloudflare production authorization
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error title=AUTH REQUIRED::OMEGA_CLOUDFLARE_TOKEN missing'; exit 1; }
          npx wrangler whoami
      - name: Deploy isolated R256 SAI doorway only
        run: npx wrangler deploy --config wrangler.sai-door-r256.jsonc
      - name: Prove public non-disclosure boundary
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_SAI_DOOR_URL.replace(/\/$/,'');
          const invalid='x'.repeat(64);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function retry(path){let last='';for(let i=1;i<=12;i++){try{const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}}),text=await r.text();if(r.status===404&&String(r.headers.get('x-robots-tag')||'').includes('noindex')){console.log(`R256 hidden boundary PASS ${path} attempt ${i}`);return}last=`HTTP ${r.status} ${text.slice(0,180)}`}catch(e){last=String(e)}await sleep(5000)}throw new Error(`R256 hidden-boundary verification failed ${path}: ${last}`)}
          await retry('/');
          await retry('/sai-door/'+invalid);
          await retry('/api/admin/sai-peers');
          console.log('R256 deployed private surface proves 404/non-index disclosure boundary. Valid capability proof is intentionally performed out-of-band with the private invite token.');
          NODE
