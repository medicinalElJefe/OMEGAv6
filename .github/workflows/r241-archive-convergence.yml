name: R241 Archive Convergence Visual Intelligence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r241-archive-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-r241:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked application dependencies
        run: npm install

      - name: Audit locked application dependency tree
        run: npm audit --audit-level=high

      - name: Prove R241 archive convergence boundaries
        run: node tests/r241-archive-convergence-invariants.mjs

      - name: Prove converged R239 user-navigation boundaries
        run: node tests/r239-user-navigation-convergence-invariants.mjs

      - name: Prove R242 navigation lemma calculus
        run: node tests/r242-navigation-lemma-calculus-invariants.mjs

      - name: Prove R245 Full Overall Canon convergence without a new workflow authority
        run: node tests/r245-full-overall-canon-invariants.mjs

      - name: Prove R248 contribution fabric and operational calculus governor
        run: |
          node tests/r248-relative-contribution-fabric-invariants.mjs
          node tests/r248-operational-calculus-governor-invariants.mjs

      - name: Prove R249 operational convergence controls real work without new authority
        run: node tests/r249-operational-convergence-invariants.mjs

      - name: Prove R245 shared R170 and CLOUD-01 governed self-build convergence
        run: node tests/r245-governed-selfbuild-convergence-invariants.mjs

      - name: Re-prove inherited continuous field and Hybrid command boundaries
        run: |
          node tests/continuous-field-r13-invariants.mjs
          node tests/r237-hybrid-command-authority-invariants.mjs

      - name: Prove R283.1 workflow topology repair and inherited SAR truth stack
        shell: bash
        run: |
          node tests/r2831-workflow-topology-repair-invariants.mjs
          node tests/r283-sar-full-stack-invariants.mjs
          for f in tests/r280-*.mjs; do node "$f"; done

      - name: Prove R286/R305 Heavy Bio, interaction authority and all-surface boundaries
        run: |
          npx --yes tsx tests/r282-bio-medical-production-invariants.mts
          npx --yes tsx tests/r284-bio-mode-experience-invariants.mts
          node tests/r286-ui-interaction-integrity-invariants.mjs

      - name: Prove R279/R284 Earth truth and WGS84 geometry
        run: |
          node tests/r279-earth-truth-navigation-invariants.mjs
          npx --yes tsx tests/r284-earth-visual-fidelity.mts

      - name: Prove R289 recovered-menu design on the live navigator
        run: node tests/r289-recovered-menu-navigation-invariants.mjs

      - name: Run complete application check and production build
        run: npm run check

      - name: Prove Worker package remains deployable without deployment
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-r241

      - name: Install pinned browser proof runtime
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Prove built R241/R239/R242/R245/R279/R281/R282/R283/R284/R286/R289/R305 convergence in the real UI
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/r305-browser-failure.txt /tmp/r305-browser-suite.log
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/omega-r241-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null || {
            {
              echo 'suite=VITE_PREVIEW_STARTUP'
              echo 'status=1'
              echo '--- vite tail ---'
              tail -n 160 /tmp/omega-r241-vite.log || true
            } > /tmp/r305-browser-failure.txt
            cat /tmp/r305-browser-failure.txt
            exit 1
          }

          run_browser() {
            local test_file="$1"
            local suite_log=/tmp/r305-browser-suite.log
            : > "$suite_log"
            echo "::group::R305 browser proof ${test_file}"
            set +e
            timeout --signal=TERM --kill-after=15s 300s env OMEGA_E2E_URL=http://127.0.0.1:4173 node "$test_file" > "$suite_log" 2>&1
            local status=$?
            set -e
            cat "$suite_log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              {
                echo "suite=${test_file}"
                echo "status=${status}"
                echo 'status_124=bounded_300_second_timeout'
                echo '--- suite tail ---'
                tail -n 180 "$suite_log" || true
                echo '--- vite tail ---'
                tail -n 160 /tmp/omega-r241-vite.log || true
              } > /tmp/r305-browser-failure.txt
              echo "::error title=R305 BROWSER PROOF FAILED::${test_file} exited with status ${status}; status 124 means the bounded 300-second suite timeout fired."
              cat /tmp/r305-browser-failure.txt
              exit "$status"
            fi
          }

          run_browser tests/r241-archive-convergence-browser-e2e.mjs
          run_browser tests/r239-user-navigation-browser-e2e.mjs
          run_browser tests/r245-full-overall-canon-browser-e2e.mjs
          run_browser tests/r279-earth-views-browser-e2e.mjs
          run_browser tests/r281-bio-instrument-browser-e2e.mjs
          run_browser tests/r282-bio-medical-production-browser-e2e.mjs
          run_browser tests/r284-bio-mode-workbench-browser-e2e.mjs
          run_browser tests/r289-live-master-menu-browser-e2e.mjs
          run_browser tests/r286-all-surface-browser-e2e.mjs

      - name: Upload R305 browser failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r305-browser-failure-${{ github.run_id }}
          path: /tmp/r305-browser-failure.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Prove R240.1 semantic verifier against exact served runtime
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            SERVED_SHA="$(node - <<'NODE'
          const base=(process.env.OMEGA_PUBLIC_URL||'').replace(/\/$/,'');
          const response=await fetch(base+'/omega-build-receipt.json',{headers:{'cache-control':'no-cache'}});
          if(!response.ok)throw new Error(`build receipt HTTP ${response.status}`);
          const body=await response.json();
          const sha=body?.promotion?.promotedMergeSha||body?.source?.sha||'';
          if(!/^[0-9a-f]{40}$/i.test(sha))throw new Error(`invalid served SHA ${sha||'NONE'}`);
          process.stdout.write(sha);
          NODE
          )"
            echo "R241 live semantic proof attempt $attempt targets exact served runtime $SERVED_SHA"
            if OMEGA_PROMOTED_SHA="$SERVED_SHA" node scripts/verify_live_hybrid_command_authority_r237.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 2; fi
          done
          echo 'R241 could not obtain one internally consistent exact served-runtime semantic proof after 3 bounded attempts.' >&2
          exit 1

      - name: Summarize authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## R241/R305 Archive Convergence + Navigation + Full Canon + Earth/SAR + Heavy Bio/UI proof'
            echo "- Candidate: $GITHUB_SHA"
            echo '- Browser proof is bounded to 30 minutes and each of the nine real-browser suites is bounded to 300 seconds with exact failing-suite/status, suite-tail, Vite-tail, and an uploaded short-lived diagnostic artifact on failure; proof content is never skipped or weakened.'
            echo '- R305 preserves the R304 direct-selector specificity closure while enforcing 44×44 coarse-pointer actions, 44px form height, reduced-motion behavior, horizontal containment and 44/44 route reachability in the real browser.'
            echo '- 1,728 deterministic D×P×R aggregate topology nodes over the exact existing 20,736-state packet.'
            echo '- R242 applies PARTITION → EXCHANGE/TRANSFORM → INVARIANT CARRY → SCAR/RESIDUAL CARRY → RE-CONTEXTUALIZE/REPARTITION to navigation state.'
            echo '- R245 correlates runtime, production receipt, Hybrid, capability and governed self-build truth into one read-only observation epoch.'
            echo '- R248 factors contributors and derives CΩ/Φ/q/Λ/evidence/uncertainty/scar from current returned software/Hybrid/resource/job evidence.'
            echo '- R248 governs the real R247→R153 mission objective and recursion budget; R249 carries the same law into actual first-cycle step sequence and autonomous planning width.'
            echo '- R249 STAY/TURN/ESCALATE scheduling values remain software-operational, not physical measurements.'
            echo '- R245 exposes 7 Canon axes, 7 permanent strata, 12 logical organs and 12→144→1,728→20,736→248,832 address/scheduling levels without physical-dimension inflation.'
            echo '- R283.1 preserves SAR Truth as an eighth Earth surface while the redundant standalone SAR workflow remains archived inside the 24-workflow governance bound.'
            echo '- R284 WGS84 Planet keeps returned NASA GIBS source brightness distinct from UTC illumination, terminator, grid and other declared rendering transforms.'
            echo '- R281 preserves calibrated instrument evidence, uncertainty, provenance, 12 domains, 12 context layers, seven physical scales and the 62-mode canon overlay.'
            echo '- R282 preserves intended-use measurands, freshness/unit/AMR/uncertainty gates, risk, audit, controlled change and clinical-release authority separation.'
            echo '- R286 exposes all 241 analytical channels through metadata-bound menus, evidence filters, mode-specific analytical visuals, education and read-only comparison without inventing biological mappings.'
            echo '- R289 presents the recovered 12-menu taxonomy on the actual R88/R239 navigator strictly downstream of the R242 lemma; it remains a filter over the same 44 routes, not a second router.'
            echo '- Every analytical channel retains measurement authority 0; clinical influence remains owned by R282 scope-matched validation and explicit authorization.'
            echo '- R153 mutation, R147 dispatch, R146 durable history, R141 exact return, R240 source promotion and R125 sole CanonState admission remain unchanged.'
            echo '- R201/R203 remain retired.'
            echo '- PR live proof binds to the exact SHA actually served by the canonical Worker rather than a moving Git ref.'
            echo '- This workflow is pull-request/manual proof-only; it has no main push trigger and no deployment step; ci.yml remains the canonical production writer.'
          } >> "$GITHUB_STEP_SUMMARY"
