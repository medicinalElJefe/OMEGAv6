name: R241 Archive Convergence Visual Intelligence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r241-archive-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-r241:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked application dependencies
        run: npm install

      - name: Audit locked application dependency tree
        run: npm audit --audit-level=high

      - name: Prove R241 archive convergence boundaries
        run: node tests/r241-archive-convergence-invariants.mjs

      - name: Prove converged R239 user-navigation boundaries
        run: node tests/r239-user-navigation-convergence-invariants.mjs

      - name: Prove R242 navigation lemma calculus
        run: node tests/r242-navigation-lemma-calculus-invariants.mjs

      - name: Prove R245 Full Overall Canon convergence without a new workflow authority
        run: node tests/r245-full-overall-canon-invariants.mjs

      - name: Prove R248 contribution fabric and operational calculus governor
        run: |
          node tests/r248-relative-contribution-fabric-invariants.mjs
          node tests/r248-operational-calculus-governor-invariants.mjs

      - name: Prove R249 operational convergence controls real work without new authority
        run: node tests/r249-operational-convergence-invariants.mjs

      - name: Prove R245 shared R170 and CLOUD-01 governed self-build convergence
        run: node tests/r245-governed-selfbuild-convergence-invariants.mjs

      - name: Re-prove inherited continuous field and Hybrid command boundaries
        run: |
          node tests/continuous-field-r13-invariants.mjs
          node tests/r237-hybrid-command-authority-invariants.mjs

      - name: Prove R283.1 workflow topology repair and inherited SAR truth stack
        shell: bash
        run: |
          node tests/r2831-workflow-topology-repair-invariants.mjs
          node tests/r283-sar-full-stack-invariants.mjs
          for f in tests/r280-*.mjs; do node "$f"; done

      - name: Prove R286 Heavy Bio medical-production, 241-mode and interaction boundaries
        run: |
          npx --yes tsx tests/r282-bio-medical-production-invariants.mts
          npx --yes tsx tests/r284-bio-mode-experience-invariants.mts
          node tests/r286-ui-interaction-integrity-invariants.mjs
          node tests/r313-navigation-scroll-settle-invariants.mjs

      - name: Prove R279/R284 Earth truth and WGS84 geometry
        run: |
          node tests/r279-earth-truth-navigation-invariants.mjs
          npx --yes tsx tests/r284-earth-visual-fidelity.mts

      - name: Prove R289 recovered-menu design on the live navigator
        run: node tests/r289-recovered-menu-navigation-invariants.mjs

      - name: Prove R314/R315 numerical compute and Woven cross-skin evolution
        run: |
          node tests/r314-woven-numerical-compute-invariants.mjs
          node tests/r314-expression-compute-invariants.mjs
          node tests/r315-woven-system-traversal-invariants.mjs

      - name: Prove R316 research advancement contracts inside accumulated proof authority
        run: npx --yes tsx tests/r316-research-advancement-invariants.mts

      - name: Run complete application check and production build
        run: npm run check

      - name: Prove Worker package remains deployable without deployment
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-r241

      - name: Install pinned browser proof runtime
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser proof · R313 panel disclosure contract · fail fast
        id: panel_disclosure
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r313-panel-disclosure-ci-wrapper.mjs'

      - name: Capture exact R313 panel disclosure failure
        if: failure() && steps.panel_disclosure.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: r313-panel-disclosure-failure
          path: r313-panel-disclosure-failure.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Browser proof · R241 archive convergence
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r241-archive-convergence-browser-e2e.mjs'

      - name: Browser proof · R239 user navigation
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r239-user-navigation-browser-e2e.mjs'

      - name: Browser proof · R245 Full Overall Canon
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r245-full-overall-canon-browser-e2e.mjs'

      - name: Browser proof · R279 Earth views
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r279-earth-views-browser-e2e.mjs'

      - name: Browser proof · R281 inherited Bio instrument
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r281-bio-instrument-browser-e2e-base.mjs'

      - name: Browser proof · R282 Bio medical production
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r282-bio-medical-production-browser-e2e.mjs'

      - name: Browser proof · R284 Bio mode workbench
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r284-bio-mode-workbench-browser-e2e.mjs'

      - name: Browser proof · R289 live master menu
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r289-live-master-menu-browser-e2e.mjs'

      - name: Browser proof · R286 canonical all-surface routes
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r286-all-surface-browser-e2e.mjs'

      - name: Browser diagnostic · R313 Command Center scroll geometry
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r313-command-center-scroll-diagnostic-browser-e2e.mjs'

      - name: Browser diagnostic · R313 Modes scroll ownership
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r313-modes-scroll-diagnostic-browser-e2e.mjs'

      - name: Browser proof · R286 accumulated no-dead-control contract
        run: bash scripts/run_r241_browser_proof.sh 'node tests/r286-all-surface-no-dead-controls-ci-wrapper.mjs'

      - name: Browser proof · R313 full safe-control interaction contract
        id: full_control
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run_r241_browser_proof.sh 'node tests/r313-full-control-interaction-browser-e2e.mjs' 2>&1 | tee r313-full-control-interaction.log

      - name: Capture exact R313 full-control interaction failure
        if: failure() && steps.full_control.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: r313-full-control-interaction-failure
          path: r313-full-control-interaction.log
          if-no-files-found: error
          retention-days: 3

      - name: Prove R240.1 semantic verifier against exact served runtime
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            SERVED_VERSION="$(node - <<'NODE'
          const base=(process.env.OMEGA_PUBLIC_URL||'').replace(/\/$/,'');
          const response=await fetch(base+`/api/core-health?r241=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
          const raw=await response.text();
          let body=null;
          try{body=JSON.parse(raw)}catch{throw new Error(`core-health was not JSON: ${raw.slice(0,180)}`)}
          if(!response.ok)throw new Error(`core-health HTTP ${response.status}: ${raw.slice(0,300)}`);
          if(body?.schema!=='OMEGA_CANONICAL_CORE_HEALTH_R163'||body?.revision!=='R163'||body?.state!=='LIVE'||body?.ok!==true||body?.canonicalRequest!==true)throw new Error(`invalid R163 core-health identity ${body?.schema||'NONE'}/${body?.revision||'NONE'}/${body?.state||'NONE'}`);
          if(response.headers.get('x-omega-core-health')!=='R163-FIRST-HAND')throw new Error('core-health lost first-hand R163 response identity');
          const version=String(body?.runtimeVersion?.id||'').trim();
          if(!version)throw new Error('core-health did not return Cloudflare Worker Version ID');
          process.stdout.write(version);
          NODE
          )"
            echo "R241 live semantic proof attempt $attempt pins exact served Cloudflare Worker version $SERVED_VERSION"
            if OMEGA_EXPECTED_WORKER_VERSION_ID="$SERVED_VERSION" OMEGA_WORKER_VERSION_ID="$SERVED_VERSION" OMEGA_WORKER_NAME=omegav6 node scripts/verify_live_hybrid_command_authority_r237.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 2; fi
          done
          echo 'R241 could not obtain one internally consistent exact Worker-version semantic proof after 3 bounded attempts.' >&2
          exit 1

      - name: Summarize authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## R241 accumulated interface-integrity, Woven compute and R316 research-advancement proof'
            echo "- Candidate: $GITHUB_SHA"
            echo '- R313 disclosure is fail-fast and diagnostic-transport only: the unchanged strict child acceptance remains authoritative; failure capture does not convert a red gate to green.'
            echo '- R313 full safe-control output is retained on failure as diagnostic transport only; the unchanged interaction assertions remain authoritative and red still blocks promotion.'
            echo '- R314 numerical evaluation and R315 Woven field/traversal invariants are explicit proof gates, including frame-relative 12^k source/target continuity and recoverable scar/history carry.'
            echo '- R316 fabrication-transform/tolerance, optical-field polarization, relational identity, experiment residual, spectral observation, acquisition provenance and topology-aware scheduler contracts are proved here without adding a workflow authority.'
            echo '- R316 physical fabrication, FDTD/measurement results, device availability and external-provider outputs remain evidence/device/provider gated until independently returned.'
            echo '- R241 manual live semantic proof pins the first-hand R163 Cloudflare Worker Version ID; PR exact-head proof remains source/build/browser only so a stale production runtime cannot deadlock its own governed replacement.'
            echo '- Governed staged promotion remains stricter: canonical ci.yml keeps the previous serving version at 100% ordinary traffic, admits the exact candidate to the current deployment at 0% for version-override proof, and promotes only after semantic + browser proof; only a separately usability-proved previous baseline may later receive rollback authority.'
            echo '- Browser acceptance is decomposed into individually named proofs so a failure identifies its actual contract without weakening any assertion.'
            echo '- R281 inherited Bio proof is isolated from the accumulated no-dead-control and R313 contracts; the latter remain explicit blocking gates.'
            echo '- R313 Command Center and Modes geometry diagnostics are observational only and run before the unchanged blocking R286 no-dead-control contract.'
            echo '- R286/R313 retain legacy all-surface coverage plus no-dead-control, disclosure, occlusion, desktop/mobile and safe-interaction contracts.'
            echo '- R125 sole CanonState admission, R141 exact return, R146 durable history, R147 dispatch, R153 mutation and R240 source promotion remain unchanged.'
            echo '- R201/R203 remain retired.'
            echo '- This workflow is PR/manual proof-only; it has no main push trigger and no deployment step; ci.yml remains the canonical production writer and live release authority.'
          } >> "$GITHUB_STEP_SUMMARY"
