          npx --yes tsx tests/r284-earth-visual-fidelity.mts

      - name: Prove R289 recovered-menu design on the live navigator
        run: node tests/r289-recovered-menu-navigation-invariants.mjs

      - name: Prove R314/R315 numerical compute and Woven cross-skin evolution
        run: |
          node tests/r314-woven-numerical-compute-invariants.mjs
          node tests/r314-expression-compute-invariants.mjs
      
      - name: Prove R327/R328 SAR + source-exact semantic convergence
        run: |
          node tests/r327-sar-cog-zstd-georef-invariants.mjs
          node tests/r328-source-exact-canon-invariants.mjs
          node scripts/r314-convergence-audit.mjs --compact > /tmp/r314-r328-audit.json
          node tests/r315-woven-system-traversal-invariants.mjs

      - name: Prove R316 research advancement contracts inside accumulated proof authority
        run: npx --yes tsx tests/r316-research-advancement-invariants.mts

      - name: Prove R334 proof-governed calibrated data convergence
        run: npm run test:r334

      - name: Prove R335 calibrated data full-system propagation and autonomy handoff
        run: npm run test:r335

      - name: Prove R340 v4 ablation round-trip forecast propagation
        run: npm run test:r340

      - name: Run complete application check and production build
        run: npm run check

      - name: Prove Worker package remains deployable without deployment
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-r241

      - name: Install pinned browser proof runtime
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Start one shared R241 preview server
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/omega-r241-shared-preview.log
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 >"$log" 2>&1 &
          pid=$!
          echo "$pid" > /tmp/omega-r241-shared-preview.pid
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$log" >&2; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$log" >&2; exit 1; fi
          echo 'OMEGA_E2E_URL=http://127.0.0.1:4173' >> "$GITHUB_ENV"
          echo "R241 shared preview ready pid=$pid"

      - name: Browser proof · R313 panel disclosure contract · exhaustive partition
        id: panel_disclosure
        shell: bash
        run: |
          set -o pipefail
          OMEGA_BROWSER_PROOF_TIMEOUT_SEC=1320 bash scripts/run_r241_browser_proof.sh 'R313_DISCLOSURE_SHARDS=16 R313_DISCLOSURE_MAX_PARALLEL=4 R313_DISCLOSURE_SHARD_TIMEOUT_SEC=360 bash scripts/run_r313_disclosure_shards.sh && node tests/r318-viewport-ownership-browser-e2e.mjs'

      - name: Capture exact R313 panel disclosure failure
        if: failure() && steps.panel_disclosure.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: r313-panel-disclosure-failure
