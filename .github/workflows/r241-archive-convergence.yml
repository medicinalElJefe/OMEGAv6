name: R241 Archive Convergence Visual Intelligence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r241-archive-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-r241:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked application dependencies
        run: npm install

      - name: Audit locked application dependency tree
        run: npm audit --audit-level=high

      - name: Prove R241 archive convergence boundaries
        run: node tests/r241-archive-convergence-invariants.mjs

      - name: Prove converged R239 user-navigation boundaries
        run: node tests/r239-user-navigation-convergence-invariants.mjs

      - name: Prove R242 navigation lemma calculus
        run: node tests/r242-navigation-lemma-calculus-invariants.mjs

      - name: Prove R245 Full Overall Canon convergence without a new workflow authority
        run: node tests/r245-full-overall-canon-invariants.mjs

      - name: Prove R248 contribution fabric and operational calculus governor
        run: |
          node tests/r248-relative-contribution-fabric-invariants.mjs
          node tests/r248-operational-calculus-governor-invariants.mjs

      - name: Prove R249 operational convergence controls real work without new authority
        run: node tests/r249-operational-convergence-invariants.mjs

      - name: Prove R245 shared R170 and CLOUD-01 governed self-build convergence
        run: node tests/r245-governed-selfbuild-convergence-invariants.mjs

      - name: Re-prove inherited continuous field and Hybrid command boundaries
        run: |
          node tests/continuous-field-r13-invariants.mjs
          node tests/r237-hybrid-command-authority-invariants.mjs

      - name: Prove R283.1 workflow topology repair and inherited SAR truth stack
        shell: bash
        run: |
          node tests/r2831-workflow-topology-repair-invariants.mjs
          node tests/r283-sar-full-stack-invariants.mjs
          for f in tests/r280-*.mjs; do node "$f"; done

      - name: Prove R282 and R284 Heavy Bio production/mode boundaries
        run: |
          npx --yes tsx tests/r282-bio-medical-production-invariants.mts
          npx --yes tsx tests/r284-bio-mode-experience-invariants.mts

      - name: Run complete application check and production build
        run: npm run check

      - name: Prove Worker package remains deployable without deployment
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-r241

      - name: Install pinned browser proof runtime
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Start exact built candidate for sequential browser proof
        shell: bash
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/omega-r241-vite.log 2>&1 &
          echo $! > /tmp/omega-r241-vite.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null || { cat /tmp/omega-r241-vite.log; exit 1; }

      - name: Browser proof · R241 archive convergence
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r241-archive-convergence-browser-e2e.mjs

      - name: Browser proof · R239 user navigation
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r239-user-navigation-browser-e2e.mjs

      - name: Browser proof · R245 Full Overall Canon
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r245-full-overall-canon-browser-e2e.mjs

      - name: Browser proof · R279/R281/R283 Earth views
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r279-earth-views-browser-e2e.mjs

      - name: Browser proof · R281 Heavy Bio instrument surface
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r281-bio-instrument-browser-e2e.mjs

      - name: Browser proof · R282 Heavy Bio medical-production controls
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r282-bio-medical-production-browser-e2e.mjs

      - name: Browser proof · R284 Heavy Bio 241-mode experience
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r284-bio-mode-workbench-browser-e2e.mjs

      - name: Prove R240.1 semantic verifier against exact served runtime
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            SERVED_SHA="$(node - <<'NODE'
          const base=(process.env.OMEGA_PUBLIC_URL||'').replace(/\/$/,'');
          const response=await fetch(base+'/omega-build-receipt.json',{headers:{'cache-control':'no-cache'}});
          if(!response.ok)throw new Error(`build receipt HTTP ${response.status}`);
          const body=await response.json();
          const sha=body?.promotion?.promotedMergeSha||body?.source?.sha||'';
          if(!/^[0-9a-f]{40}$/i.test(sha))throw new Error(`invalid served SHA ${sha||'NONE'}`);
          process.stdout.write(sha);
          NODE
          )"
            echo "R241 live semantic proof attempt $attempt targets exact served runtime $SERVED_SHA"
            if OMEGA_PROMOTED_SHA="$SERVED_SHA" node scripts/verify_live_hybrid_command_authority_r237.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 2; fi
          done
          echo 'R241 could not obtain one internally consistent exact served-runtime semantic proof after 3 bounded attempts.' >&2
          exit 1

      - name: Summarize authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## R241 Archive + Navigation + Full Canon + Earth/SAR + R281/R282/R284 Heavy Bio proof'
            echo "- Candidate: $GITHUB_SHA"
            echo '- R242 keeps PARTITION → EXCHANGE/TRANSFORM → INVARIANT CARRY → SCAR/RESIDUAL CARRY → RE-CONTEXTUALIZE/REPARTITION for navigation state.'
            echo '- R245 preserves 12→144→1,728→20,736→248,832 as logical/address levels rather than physical dimensions.'
            echo '- R279/R281/R283 prove the current eight-view Earth/SAR experience without fabricated observation pixels.'
            echo '- R281 preserves calibrated instrument evidence, uncertainty, provenance, 12 domains, 12 layers, seven physical scales and the 62-mode canon radial visualization.'
            echo '- R282 preserves intended-use measurands, freshness/unit/AMR/uncertainty gates, risk, audit, controlled change and clinical-release authority separation.'
            echo '- R284 exposes all 241 analytical channels through metadata-bound menus, evidence filters, mode-specific analytical visuals, education and read-only comparison without inventing biological mappings.'
            echo '- Every R284 analytical channel has measurement authority 0; clinical influence remains owned by R282 scope-matched validation and authorization.'
            echo '- R283 SAR proof remains converged here while active workflow topology stays within the R170 maximum of 24.'
            echo '- R153 mutation, R147 dispatch, R146 durable history, R141 exact return, R240 source promotion and R125 sole CanonState admission remain unchanged.'
            echo '- This workflow is proof-only; ci.yml remains the canonical production writer.'
          } >> "$GITHUB_STEP_SUMMARY"
