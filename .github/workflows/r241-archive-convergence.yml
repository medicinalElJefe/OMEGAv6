name: R241 Archive Convergence Visual Intelligence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r241-archive-convergence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove-r241:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked application dependencies
        run: npm install

      - name: Audit locked application dependency tree
        run: npm audit --audit-level=high

      - name: Prove R241 archive convergence boundaries
        run: node tests/r241-archive-convergence-invariants.mjs

      - name: Prove converged R239 user-navigation boundaries
        run: node tests/r239-user-navigation-convergence-invariants.mjs

      - name: Prove R242 navigation lemma calculus
        run: node tests/r242-navigation-lemma-calculus-invariants.mjs

      - name: Prove R245 Full Overall Canon convergence without a new workflow authority
        run: node tests/r245-full-overall-canon-invariants.mjs

      - name: Re-prove inherited continuous field and Hybrid command boundaries
        run: |
          node tests/continuous-field-r13-invariants.mjs
          node tests/r237-hybrid-command-authority-invariants.mjs

      - name: Run complete application check and production build
        run: npm run check

      - name: Prove Worker package remains deployable without deployment
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-r241

      - name: Install pinned browser proof runtime
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Prove built R241/R239/R242/R245 convergence in the real UI
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/omega-r241-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null || { cat /tmp/omega-r241-vite.log; exit 1; }
          OMEGA_E2E_URL=http://127.0.0.1:4173 node tests/r241-archive-convergence-browser-e2e.mjs
          OMEGA_E2E_URL=http://127.0.0.1:4173 node tests/r239-user-navigation-browser-e2e.mjs
          OMEGA_E2E_URL=http://127.0.0.1:4173 node tests/r245-full-overall-canon-browser-e2e.mjs

      - name: Prove R240.1 semantic verifier against exact served runtime
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            SERVED_SHA="$(node - <<'NODE'
          const base=(process.env.OMEGA_PUBLIC_URL||'').replace(/\/$/,'');
          const response=await fetch(base+'/omega-build-receipt.json',{headers:{'cache-control':'no-cache'}});
          if(!response.ok)throw new Error(`build receipt HTTP ${response.status}`);
          const body=await response.json();
          const sha=body?.promotion?.promotedMergeSha||body?.source?.sha||'';
          if(!/^[0-9a-f]{40}$/i.test(sha))throw new Error(`invalid served SHA ${sha||'NONE'}`);
          process.stdout.write(sha);
          NODE
          )"
            echo "R241 live semantic proof attempt $attempt targets exact served runtime $SERVED_SHA"
            if OMEGA_PROMOTED_SHA="$SERVED_SHA" node scripts/verify_live_hybrid_command_authority_r237.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 2; fi
          done
          echo 'R241 could not obtain one internally consistent exact served-runtime semantic proof after 3 bounded attempts.' >&2
          exit 1

      - name: Summarize authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## R241 Archive Convergence + R239/R242 Navigation + R245 Full Overall Canon'
            echo "- Candidate: $GITHUB_SHA"
            echo '- 1,728 deterministic D×P×R aggregate topology nodes over the exact existing 20,736-state packet.'
            echo '- R242 applies PARTITION → EXCHANGE/TRANSFORM → INVARIANT CARRY → SCAR/RESIDUAL CARRY → RE-CONTEXTUALIZE/REPARTITION to navigation state.'
            echo '- R245 correlates runtime, production receipt, Hybrid, capability and governed self-build truth into one read-only observation epoch.'
            echo '- R245 exposes 7 Canon axes, 7 permanent strata, 12 logical organs and 12→144→1,728→20,736→248,832 address/scheduling levels without physical-dimension inflation.'
            echo '- R245 desktop/mobile built-browser proof requires the actual System Atlas surface, preserves the R153 executor and proves manual observation refresh remains non-mutating.'
            echo '- R245 delegates mutation/execution to existing Build Out/R153/Hybrid authorities and owns no POST/PUT/DELETE, executor, production writer or Canon admission path.'
            echo '- Exact route identity outranks prefix/token/metadata search; ambiguity and empty results carry explicit residuals rather than fabricated destinations.'
            echo '- Route filaments are source routeNext-derived; neighbor filaments are deterministic display topology.'
            echo '- Gradient/curl/variance are display proxies, not physical measurement claims.'
            echo '- Typed cognition is read-only through proposal; permission/execution/return/Canon remain separately gated.'
            echo '- R239 navigation remains converged in this proof plane: six workspaces, complete 44-route registry, immediate aria-hidden/inert close, ancestor-aware visible-canvas sanity, exhaustive route activation, and mobile containment.'
            echo '- No 25th workflow authority is introduced; R245 proof is converged into this existing R241 proof plane and active workflow topology remains within the R170 governed bound.'
            echo '- R147 dispatch, R146 durable history, R141 exact return and R125 sole CanonState admission remain unchanged.'
            echo '- R201/R203 remain retired.'
            echo '- PR live proof binds to the exact SHA actually served by the canonical Worker; it does not compare against a moving Git ref.'
            echo '- This workflow is pull-request/manual proof-only; it has no main push trigger and no deployment step; ci.yml remains the canonical production writer.'
          } >> "$GITHUB_STEP_SUMMARY"
