name: R241 Archive Convergence Visual Intelligence
# R501 TOTAL GITHUB ACCEPTANCE · semantic no-op touch to force current-lineage GitHub proof.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r241-archive-convergence-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  stale-head-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      current: ${{ steps.head.outputs.current }}
      observed_head: ${{ steps.head.outputs.observed_head }}
      candidate_head: ${{ steps.head.outputs.candidate_head }}
      inherit: ${{ steps.inherit.outputs.inherit }}
      inheritance_reason: ${{ steps.inherit.outputs.reason }}
    steps:
      - name: Verify candidate is still the PR head before expensive proof
        id: head
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "observed_head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "candidate_head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "R241 stale-head preflight: manual run, exact requested SHA remains eligible."
            exit 0
          fi
          observed="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/pull/${PR_NUMBER}/head" | awk 'NR==1{print $1}')"
          if [ -z "$observed" ]; then
            echo "::error title=R241 HEAD LOOKUP FAILED::Could not resolve current head for PR #${PR_NUMBER}."
            exit 1
          fi
          echo "observed_head=$observed" >> "$GITHUB_OUTPUT"
          echo "candidate_head=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$observed" = "$EVENT_HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "R241 stale-head preflight PASS · PR #${PR_NUMBER} current head $observed matches exact event head $EVENT_HEAD_SHA."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "R241 stale-head preflight OBSOLETE · event head $EVENT_HEAD_SHA is retained as history but current PR #${PR_NUMBER} head is $observed; synthetic workflow SHA $GITHUB_SHA is not used as candidate identity; expensive proof is skipped."
          fi

      - name: Evaluate exact-base proof inheritance
        id: inherit
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const out=(key,value)=>fs.appendFileSync(process.env.GITHUB_OUTPUT,`${key}=${String(value).replaceAll('\n',' ')}\n`);
          if(process.env.EVENT_NAME!=='pull_request'){
            out('inherit','false');
            out('reason','manual dispatch requires direct exact-head proof');
            process.exit(0);
          }

          const repo=process.env.REPOSITORY;
          const base=process.env.BASE_SHA;
          const head=process.env.HEAD_SHA;
          const token=process.env.GH_TOKEN;
          const headers={
            accept:'application/vnd.github+json',
            authorization:`Bearer ${token}`,
            'x-github-api-version':'2022-11-28'
          };
          const get=async path=>{
            const r=await fetch(`https://api.github.com/repos/${repo}${path}`,{headers});
            const raw=await r.text();
            if(!r.ok)throw new Error(`GitHub ${path} HTTP ${r.status}: ${raw.slice(0,300)}`);
            return JSON.parse(raw);
          };

          const comparison=await get(`/compare/${base}...${head}`);
          const files=(comparison.files||[]).map(x=>String(x.filename||'')).filter(Boolean);
          const docsOnly=files.length>0&&files.every(file=>file.startsWith('docs/')&&file.endsWith('.md'));
          if(!docsOnly){
            out('inherit','false');
            out('reason',`runtime-or-proof-affecting diff requires direct proof (${files.length} changed files)`);
            process.exit(0);
          }

          const runs=await get(`/actions/runs?head_sha=${base}&event=pull_request&per_page=100`);
          const proof=(runs.workflow_runs||[]).find(run=>
            run.name==='R241 Archive Convergence Visual Intelligence'&&
            run.status==='completed'&&
            run.conclusion==='success'&&
            String(run.head_sha||'')===base
          );
          if(!proof){
            out('inherit','false');
            out('reason','exact base SHA has no successful R241 proof to inherit');
            process.exit(0);
          }

          out('inherit','true');
          out('reason',`documentation-only successor of exact R241-proved base ${base}; inherited run ${proof.id}`);
          console.log(`R469 R241 PROOF INHERITANCE PASS · head ${head} changes documentation only · exact base ${base} is R241-proved by run ${proof.id} · runtime and proof harness are unchanged.`);
          NODE

  inherit-r241-proof:
    needs: stale-head-preflight
    if: needs.stale-head-preflight.outputs.current == 'true' && needs.stale-head-preflight.outputs.inherit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Carry exact-base R241 proof across documentation-only successor
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REASON: ${{ needs.stale-head-preflight.outputs.inheritance_reason }}
        run: |
          set -euo pipefail
          echo "R469 inherited R241 proof: $REASON"
          {
            echo '## R469 exact-base proof inheritance'
            echo "- Candidate head: $HEAD_SHA"
            echo "- Exact proved base: $BASE_SHA"
            echo "- $REASON"
            echo '- Inheritance is allowed only for docs/*.md-only diffs from an exact base SHA whose own pull-request R241 workflow completed successfully.'
            echo '- Any runtime, workflow, test, script, package, configuration or other non-documentation change forces the unchanged direct R241 proof jobs.'
            echo '- This carries proof across a representation-only successor; it does not create deployment, source-promotion or CanonState authority.'
          } >> "$GITHUB_STEP_SUMMARY"

  prove-r241-interactions:
    needs: stale-head-preflight
    if: needs.stale-head-preflight.outputs.current == 'true' && needs.stale-head-preflight.outputs.inherit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact interaction candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact interaction head identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA" || { echo "::error title=R241 INTERACTION CHECKOUT DRIFT::Expected $EXPECTED_HEAD_SHA but got $actual"; exit 1; }

      - name: Use Node 24 for interaction proof
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore R408 interaction workload scar
        uses: actions/cache@v4
        with:
          path: .omega/proof-workload
          key: r408-proof-workload-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            r408-proof-workload-${{ runner.os }}-${{ github.job }}-

      - name: Install exact locked interaction graph
        run: npm install

      - name: Build exact candidate for interaction proof
        run: npm run build

      - name: Install pinned interaction browser runtime
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Start isolated R313 interaction preview
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/omega-r313-interaction-preview.log
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 >"$log" 2>&1 &
          pid=$!
          echo "$pid" > /tmp/omega-r313-interaction-preview.pid
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$log" >&2; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$log" >&2; exit 1; fi
          echo 'OMEGA_E2E_URL=http://127.0.0.1:4173' >> "$GITHUB_ENV"
          echo "R313 isolated interaction preview ready pid=$pid"

      - name: Browser proof · R313 full safe-control interaction contract
        id: full_control
        shell: bash
        run: |
          set -o pipefail
          OMEGA_BROWSER_PROOF_TIMEOUT_SEC=1500 bash scripts/run_r241_browser_proof.sh 'R313_PROOF_SHARDS=16 R313_SHARD_MAX_PARALLEL=4 R313_SHARD_TIMEOUT_SEC=480 bash scripts/run_r313_control_shards.sh' 2>&1 | tee r313-full-control-interaction.log

      - name: Retain R408 interaction workload scar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r408-interaction-workload-scar-${{ github.run_id }}
          path: .omega/proof-workload/r408-scar.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture exact R313 full-control interaction failure
        if: failure() && steps.full_control.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: r313-full-control-interaction-failure
          path: r313-full-control-interaction.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop isolated R313 interaction preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/omega-r313-interaction-preview.pid ]; then
            pid="$(cat /tmp/omega-r313-interaction-preview.pid)"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
          rm -f /tmp/omega-r313-interaction-preview.pid

      - name: Summarize R313 interaction authority boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## R313 exact-SHA exhaustive interaction proof'
            echo "- Candidate: $GITHUB_SHA"
            echo '- All 88 desktop/mobile route cases remain assigned exactly once through the R355 measured-workload partition.'
            echo '- Sixteen deterministic shards execute in four bounded four-way waves; each child remains capped at 480s and the parent at 1500s. The larger transport budget is evidence-calibrated from the exact-head System Atlas interaction workload and does not weaken any child assertion.'
            echo '- This job is blocking and fail-closed. Cancellation, timeout, missing shard, duplicate case, dead control, page error, overflow, or actionability failure remains red.'
            echo '- This job has no deployment or CanonState mutation authority.'
          } >> "$GITHUB_STEP_SUMMARY"

  prove-r241:
    needs: stale-head-preflight
    if: needs.stale-head-preflight.outputs.current == 'true' && needs.stale-head-preflight.outputs.inherit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate head identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA" || { echo "::error title=R241 CHECKOUT DRIFT::Expected $EXPECTED_HEAD_SHA but got $actual"; exit 1; }

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore R408 main proof workload scar
        uses: actions/cache@v4
        with:
          path: .omega/proof-workload
          key: r408-proof-workload-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
