name: Deploy public federation surfaces
on:
  push:
    branches:
      - verify-four-live-links
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare authorization
        run: npx --yes wrangler@4.129.0 whoami
      - name: Deploy public Optical surface
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.optical-public.jsonc
      - name: Deploy public Sovereign surface
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.sovereign-public.jsonc
      - name: Verify all four public surfaces
        run: python scripts/verify_four_links.py
