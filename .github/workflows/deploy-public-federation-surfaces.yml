name: Deploy public federation surfaces
on:
  push:
    branches:
      - verify-four-live-links
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify Cloudflare authorization
        run: npx wrangler whoami
      - name: Deploy public Optical surface
        run: npx wrangler deploy src/opticalPublicWorker.js --name omega-optical-cloud-woven2 --compatibility-date 2026-08-29
      - name: Deploy public Sovereign surface
        run: npx wrangler deploy src/sovereignPublicWorker.js --name omega-sovereign-convergence --compatibility-date 2026-08-29
      - name: Verify all four public surfaces
        run: python scripts/verify_four_links.py
