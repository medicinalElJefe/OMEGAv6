name: OMEGA Release Evidence Live Verify

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev

jobs:
  verify-release-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact promoted source and verify release evidence plus R144 attestation
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const expected=process.env.GITHUB_SHA;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let attempt=1;attempt<=180;attempt++){
            try{
              const [eRes,bRes,aRes]=await Promise.all([
                fetch(base+'/api/release-evidence',{headers:{'cache-control':'no-cache'}}),
                fetch(base+'/omega-build-receipt.json',{headers:{'cache-control':'no-cache'}}),
                fetch(base+'/api/runtime-attestation',{headers:{'cache-control':'no-cache'}})
              ]);
              const eText=await eRes.text(),bText=await bRes.text(),aText=await aRes.text();
              if(!eRes.ok||!bRes.ok||!aRes.ok)throw new Error(`HTTP evidence=${eRes.status} receipt=${bRes.status} attestation=${aRes.status}`);
              const e=JSON.parse(eText),b=JSON.parse(bText),a=JSON.parse(aText);
              if(e?.source?.sha!==expected||a?.source?.sha!==expected){last=`waiting for source ${expected}; release=${e?.source?.sha||'NONE'} attestation=${a?.source?.sha||'NONE'}`;await sleep(5000);continue}
              if(e.schema!=='OMEGA_RELEASE_EVIDENCE_V1')throw new Error(`wrong release schema ${e.schema}`);
              if(b.schema!=='OMEGA_GOVERNED_BUILD_RECEIPT_V1')throw new Error(`wrong receipt schema ${b.schema}`);
              if(a.schema!=='OMEGA_RUNTIME_DEPLOYMENT_ATTESTATION_R144'||a.revision!=='R144')throw new Error(`wrong runtime attestation ${a.schema}/${a.revision}`);
              if(!b.receiptSha256||e?.packageReceipt?.receiptSha256!==b.receiptSha256||a?.packageReceipt?.receiptSha256!==b.receiptSha256)throw new Error('package receipt SHA-256 is not bound across release evidence and runtime attestation');
              if(!String(e?.runtimeVersion?.id||'').trim()||!String(a?.runtimeVersion?.id||'').trim())throw new Error('Cloudflare runtime Version ID missing');
              if(e.runtimeVersion.id!==a.runtimeVersion.id||a?.bindings?.cloudflareVersionId!==a.runtimeVersion.id)throw new Error('Cloudflare runtime Version ID binding mismatch');
              if(a?.bindings?.sourceSha!==expected||a?.bindings?.packageReceiptSha256!==b.receiptSha256)throw new Error('R144 source/package bindings mismatch');
              if(e?.runtimeAuthority?.cloudflareVersionMetadata!=='RETURNED'||a?.runtimeAuthority?.cloudflareVersionMetadata!=='RETURNED')throw new Error('Cloudflare version metadata not returned');
              if(e?.runtimeAuthority?.publicWorkerMutationAuthority!==false||a?.runtimeAuthority?.publicWorkerMutationAuthority!==false||a?.runtimeAuthority?.canonicalMutation!==false)throw new Error('read-only runtime authority regressed');
              if(a?.authorityChain?.uiOperationChain?.revision!=='R143'||a?.authorityChain?.capabilityLifecycle?.revision!=='R142'||a?.authorityChain?.hybridExecutionProof?.revision!=='R141'||a?.authorityChain?.canonicalAdmission?.revision!=='R125')throw new Error('R144 authority chain mismatch');
              if(a?.lifecycle?.implemented!=='IMPLEMENTED'||a?.lifecycle?.deployed!=='CLOUDFLARE_VERSION_RETURNED'||a?.lifecycle?.live!=='CURRENT_RUNTIME_RESPONSE_RETURNED')throw new Error('implemented/deployed/live runtime facts are not bound');
              if(a?.lifecycle?.tested!=='EXTERNAL_GITHUB_EVIDENCE_REQUIRED'||a?.lifecycle?.verified!=='EXTERNAL_FIRST_HAND_PROBE_REQUIRED')throw new Error('tested/verified truth boundary regressed');
              if(!['MERGE_LINEAGE_BOUND','EXTERNAL_RELEASE_LEDGER_REQUIRED'].includes(a?.lifecycle?.merged))throw new Error('merged state must remain explicit');
              if(e?.externalGates?.candidateQa!=='EXTERNAL_GITHUB_EVIDENCE_REQUIRED'||e?.externalGates?.postDeployVerification!=='EXTERNAL_FIRST_HAND_PROBE_REQUIRED'||e?.externalGates?.rollback!=='EXTERNAL_RELEASE_LEDGER_REQUIRED')throw new Error('external governance truth boundary regressed');
              if(!String(e.evidenceSha256||'').match(/^[a-f0-9]{64}$/)||!String(a.attestationSha256||'').match(/^[a-f0-9]{64}$/))throw new Error('release/attestation SHA-256 missing');
              console.log(`OMEGA R144 LIVE VERIFIED · source ${expected} · worker version ${a.runtimeVersion.id} · receipt ${b.receiptSha256} · attestation ${a.attestationSha256}`);
              process.exit(0);
            }catch(error){last=error instanceof Error?error.message:String(error)}
            await sleep(5000);
          }
          throw new Error(`canonical R144 runtime-attestation verification failed: ${last}`);
          NODE
