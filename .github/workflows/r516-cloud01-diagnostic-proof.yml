name: R516 CLOUD-01 Diagnostic Proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud01-diagnostic-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check CLOUD-01 diagnostics and cron-source invariants
        run: |
          node --check scripts/r515-cloud01-cycle-diagnostics.mjs
          node --check tests/r516-cloud01-diagnostics-truth-invariants.mjs
          node --check tests/r516-cloud01-scheduler-boundary-invariants.mjs
          node tests/r516-cloud01-diagnostics-truth-invariants.mjs
          node tests/r516-cloud01-scheduler-boundary-invariants.mjs
          node scripts/r515-cloud01-cycle-diagnostics.mjs
      - name: Preserve exact proof boundary
        run: |
          echo 'This check proves repository configuration and receipt generation only.'
          echo 'Cloudflare scheduled invocations, live Worker behavior, and production promotion require independent evidence.'
          echo 'R125 canonical admission and ci.yml production-writer authority are unchanged.'
