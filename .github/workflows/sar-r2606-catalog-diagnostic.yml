name: SAR R260.6 Catalog Diagnostic

on:
  push:
    branches:
      - r260-6-catalog-activation-liveness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-live-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Chromium proof runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose production target catalog activation
        working-directory: sar-accumulation-studio
        env:
          SAR_TEST_URL: https://omega-sar-r4.jeffdeweyeljefe.workers.dev
        run: node tests/r260-6-catalog-diagnostic-e2e.mjs
      - name: Reproduce complete production measured-workstation gate
        working-directory: sar-accumulation-studio
        env:
          SAR_TEST_URL: https://omega-sar-r4.jeffdeweyeljefe.workers.dev
        run: node tests/r253-balanced-viewport-e2e.mjs
