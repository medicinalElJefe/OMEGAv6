name: R881 regenerate reviewed Vite lockfile
on:
  push:
    branches:
      - security/r881-picomatch-exposure-census
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/security/r881-picomatch-exposure-census'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve pinned Vite 6.2.7 and regenerate actual npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify no vulnerable picomatch in resolved graph
        run: |
          npm audit --audit-level=high
          npm ci --ignore-scripts
          npm run build
      - name: Commit exact regenerated lockfile only after audit and build pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(r881): lock audited Vite 6.2.7 dependency graph"
            git push origin HEAD:security/r881-picomatch-exposure-census
          fi
