name: R316 Research Advancement Proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r316-research-advancement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-r316:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install locked application dependencies
        run: npm install

      - name: Prove R316 research advancement contracts
        run: npx --yes tsx tests/r316-research-advancement-invariants.mts

      - name: Build exact candidate
        run: npm run build

      - name: Summarize truth boundary
        if: always()
        run: |
          {
            echo '## R316 Research Advancement Proof'
            echo "- Candidate: $GITHUB_SHA"
            echo '- Proves fabrication-transform, optical-field, relational-identity, experiment-residual, spectral-observation, acquisition-provenance and hardware-scheduler software contracts.'
            echo '- Atlas 12→144→1,728→20,736→248,832 remains representational/address resolution only.'
            echo '- Physical fabrication, FDTD, measurement and hardware availability remain evidence/device gated until independently returned.'
            echo '- This workflow has no deployment authority; ci.yml remains the sole main-push production deployment writer.'
          } >> "$GITHUB_STEP_SUMMARY"
