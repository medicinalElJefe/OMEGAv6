name: R170.1 One-Shot Workflow Archive Migration

on:
  push:
    branches: [r170-1-production-proven-governed-selfbuild]
    paths:
      - '.github/workflows/r170-1-one-shot-workflow-archive.yml'

permissions:
  contents: write

concurrency:
  group: omega-r170-one-shot-archive
  cancel-in-progress: false

jobs:
  archive-superseded-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r170-1-production-proven-governed-selfbuild
          fetch-depth: 0
      - name: Byte-preserve superseded active workflows outside Actions directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows-archive
          KEEP='^(ci\.yml|r168-1-rcwa-byte-diagnostic\.yml|r168-genesis-r192-attestation\.yml|r169-federation-attestation-world-lens\.yml|r170-current-convergence\.yml|r170-governed-selfbuild\.yml|r170-1-one-shot-workflow-archive\.yml)$'
          MOVED=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [[ "$name" =~ $KEEP ]]; then continue; fi
            git mv "$f" ".github/workflows-archive/$name"
            MOVED=$((MOVED+1))
          done
          echo "Archived $MOVED superseded workflow definitions without changing their bytes."
          test -f .github/workflows-archive/r124-self-contained-continuous-build.yml
          test -f .github/workflows-archive/r124-selfbuild-gate.yml
          test ! -f .github/workflows/r124-self-contained-continuous-build.yml
          test ! -f .github/workflows/r124-selfbuild-gate.yml
          git diff --cached --check
      - name: Commit archive migration on isolated R170 branch
        shell: bash
        run: |
          git config user.name 'OMEGA R170 Workflow Governor'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'R170.1 archive superseded workflow execution authorities without deleting lineage'
          git push origin HEAD:r170-1-production-proven-governed-selfbuild
