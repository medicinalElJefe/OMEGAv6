name: OMEGA R168 Whole-System Truth Performance Restoration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r168-whole-system-truth-performance-restoration]

concurrency:
  group: r168-whole-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-r168:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMEGA_E2E_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm install --no-fund
      - name: Reject high-severity dependency regressions
        run: npm audit --audit-level=high
      - name: Prove R168 whole-system restoration and real runtime storage
        run: node tests/r168-whole-system-truth-performance-restoration-invariants.mjs
      - name: Prove R168 current-successor restoration convergence
        run: node tests/r168-full-restoration-current-successor-invariants.mjs
      - name: Prove Build Out uses the admitted adaptive mission spine
        run: node tests/r168-buildout-adaptive-mission-spine-invariants.mjs
      - name: Prove live woven rendering uses adaptive performance
        run: node tests/r168-adaptive-traversal-performance-invariants.mjs
      - name: Prove updated capability and transition truth
        run: |
          node tests/capability-truth-r23-invariants.mjs
          node tests/transition-authority-r23-invariants.mjs
          node tests/single-frame-r27-invariants.mjs
      - name: Preserve family completion, whole-system and current Optical authority
        run: |
          node tests/r153-full-system-completion-invariants.mjs
          node tests/r155-whole-system-convergence-invariants.mjs
          node tests/r167-active-optical-r1532-convergence-invariants.mjs
      - name: Preserve R168.1 byte-exact RCWA and federation propagation acceptance
        env:
          OMEGA_RCWA_PROPAGATION_ATTEMPTS: '3'
          OMEGA_FEDERATION_PROPAGATION_ATTEMPTS: '3'
        run: |
          node --check scripts/diagnose_rcwa_live_r1681.mjs
          node --check scripts/verify_federation_live_r1681.mjs
          node scripts/verify_federation_live_r1681.mjs
      - name: Preserve current federation attestation world-scar continuity
        run: |
          node tests/r168-genesis-r192-attestation-invariants.mjs
          node tests/r169-federation-attestation-world-lens-invariants.mjs
          node tests/r166-development-residual-world-lens-invariants.mjs
      - name: Preserve durable execution, reflex swarm and admission boundaries
        run: |
          node tests/r146-durable-operation-execution-invariants.mjs
          node tests/r164-reflex-autonomic-swarm-convergence-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
      - name: Preserve current advanced calculus and capacity authorities
        run: |
          npx tsx tests/r154-relative-capacity-fabric.mts
          node tests/r125-accuracy-engine-invariants.mjs
      - name: Navigation and application integrity
        run: |
          node tests/r155-navigation-information-architecture-invariants.mjs
          npm run test:navigation
          npm run test:applications

      # The inherited gate is intentionally split into named proof bands. Each band
      # still executes its original contracts; continue-on-error only lets this one
      # diagnostic run identify every broken band before the aggregate gate fails.
      - name: Inherited band A · syntax, routes, restore, home, portability, cloud and visual
        id: inherited_a
        continue-on-error: true
        run: |
          node --check src/worker.js
          node --check src/workerR34.js
          node --check src/workerR101.js
          node --check src/workerLiveStateR51.js
          node --check src/workerPacketProofR52.js
          node --check src/workerDeltaMeshR53.js
          node --check src/workerProofChainR54.js
          node --check src/workerPerformanceProviderR55.js
          node --check src/workerR8.js
          node --check src/workerR9.js
          node --check src/workerR27.js
          node --check src/workerR32.js
          node --check src/workerR33.js
          npm run test:routes
          npm run test:restore
          npm run test:home
          npm run test:portability
          npm run test:cloud
          npm run test:visual
      - name: Inherited band B · depth, lineage, PC, trajectory, relativity, world and governance
        id: inherited_b
        continue-on-error: true
        run: |
          npm run test:depth
          npm run test:lineage
          npm run test:pc-spine
          npm run test:trajectory
          npm run test:relativity
          npm run test:world
          npm run test:admissibility
          npm run test:hybrid
          npm run test:archive
          npm run test:quality
          npm run test:sai
          npm run test:system-atlas
          npm run test:render-portability
      - name: Inherited band C · R38 through R67 convergence lineage
        id: inherited_c
        continue-on-error: true
        run: |
          npm run test:r38
          npm run test:correlation
          npm run test:r39
          npm run test:r40
          npm run test:r41
          npm run test:r43
          npm run test:r44
          npm run test:r45
          npm run test:r45-convergence
          npm run test:r46
          npm run test:r47
          npm run test:r48
          npm run test:r49
          npm run test:r50
          npm run test:r51
          npm run test:r52
          npm run test:r53
          npm run test:r54
          npm run test:r55
          npm run test:r58
          npm run test:r59
          npm run test:r67
      - name: Inherited band D · R77 through R110 advanced recovery lineage
        id: inherited_d
        continue-on-error: true
        run: |
          npm run test:r77
          npm run test:r79
          npm run test:r80
          npm run test:r81
          npm run test:r82
          npm run test:r83
          npm run test:r84
          npm run test:r85
          npm run test:r86
          npm run test:r87
          npm run test:r88
          npm run test:r89
          npm run test:r90
          npm run test:r91
          npm run test:r92
          npm run test:r93
          npm run test:r94
          npm run test:r95
          npm run test:r97
          npm run test:r99
          npm run test:r101
          npm run test:r104
          npm run test:r107
          npm run test:r108
          npm run test:r109
          npm run test:r110
      - name: Production build after inherited contracts
        id: inherited_build
        continue-on-error: true
        run: npm run build
      - name: Aggregate inherited production gate
        if: always()
        shell: bash
        run: |
          echo "band_a=${{ steps.inherited_a.outcome }}"
          echo "band_b=${{ steps.inherited_b.outcome }}"
          echo "band_c=${{ steps.inherited_c.outcome }}"
          echo "band_d=${{ steps.inherited_d.outcome }}"
          echo "build=${{ steps.inherited_build.outcome }}"
          test "${{ steps.inherited_a.outcome }}" = success
          test "${{ steps.inherited_b.outcome }}" = success
          test "${{ steps.inherited_c.outcome }}" = success
          test "${{ steps.inherited_d.outcome }}" = success
          test "${{ steps.inherited_build.outcome }}" = success
      - name: Canonical Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r168
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact production build locally
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/omega-r168-preview.log 2>&1 &
          echo $! >/tmp/omega-r168-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-r168-preview.log
          exit 1
      - name: Exercise all 44 routes on desktop and mobile
        run: node tests/r118-browser-operational-e2e.mjs
      - name: Exercise R164 reflex swarm UI after R168 restoration
        run: node tests/r164-reflex-autonomic-browser-e2e.mjs
      - name: Exercise R168 full restoration convergence on desktop and mobile
        run: node tests/r168-full-restoration-browser-e2e.mjs
      - name: Browser diagnostics on failure
        if: failure()
        run: cat /tmp/omega-r168-preview.log || true
