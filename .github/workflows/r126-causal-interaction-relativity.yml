name: OMEGA R126 Causal Interaction Relativity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: omega-r126-causal-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  causal-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Execute causal interaction invariants
        run: node --experimental-strip-types tests/r126-causal-interaction-relativity.mjs
      - name: Preserve R125 accuracy gate
        run: node tests/r125-accuracy-engine-invariants.mjs
      - name: Preserve inherited R124-R121 gates
        run: |
          node tests/r124-self-contained-build-invariants.mjs
          node tests/r123-living-total-experience-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
      - name: Production build
        run: npm run build
