name: R236 Dependency Lock Repair

on:
  workflow_dispatch:
  push:
    branches: [r236-source-spatial-control-attestation]
    paths:
      - '.github/workflows/r236-dependency-lock-repair.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  repair-and-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: r236-source-spatial-control-attestation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve current audited dependency tree
        run: |
          npm install
          npm audit fix
          npm audit --audit-level=high
          npm ls wrangler miniflare sharp
      - name: Commit exact repaired dependency lock
        shell: bash
        run: |
          git config user.name 'OMEGA R236 Dependency Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency tree already resolves cleanly; no lock repair commit required.'
            exit 0
          fi
          git commit -m 'R236 repair audited dependency lock'
          git push origin HEAD:r236-source-spatial-control-attestation
