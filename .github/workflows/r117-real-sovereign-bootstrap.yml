name: OMEGA R117 Real Sovereign Bootstrap

on:
  push:
    branches: [main, r117-real-sovereign-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev

jobs:
  verify-r117:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax-check proven runtime with R117 connector bootstrap
        run: node --check src/workerR116.js
      - name: Execute R117 real bootstrap invariants
        run: node tests/r117-real-sovereign-bootstrap-invariants.mjs
      - name: Execute full inherited regression and production build gate
        run: npm run check
      - name: Canonical Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r117-canonical

  live-r117:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-r117
    runs-on: ubuntu-latest
    steps:
      - name: Wait for canonical R117 connector bootstrap promotion
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let attempt=1;attempt<=36;attempt++){
            try{
              const r=await fetch(base+'/api/system/convergence',{headers:{'cache-control':'no-cache'}});
              const j=await r.json().catch(()=>({}));
              const rev=r.headers.get('x-omega-connector-revision')||j.connectorRevision||j.connectorPolicy?.currentRevision;
              if(r.ok&&rev==='R117'){console.log(`R117 connector promotion observed on attempt ${attempt}`);process.exit(0)}
              last=`HTTP ${r.status} connector ${rev}`;
            }catch(e){last=String(e)}
            await sleep(10000);
          }
          throw new Error(`R117 connector promotion not observed: ${last}`);
          NODE
      - name: Prove canonical Hybrid agent matches current launcher identity contract
        shell: bash
        run: |
          node <<'NODE'
          import {createHash} from 'node:crypto';
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const r=await fetch(base+'/api/hybrid/agent-download?r117=1',{headers:{'cache-control':'no-cache'}});
          const source=await r.text();
          if(!r.ok)throw new Error(`agent download failed: HTTP ${r.status} ${source.slice(0,240)}`);
          for(const marker of [
            '#!/usr/bin/env python3',
            'OMEGA R34 local Hybrid Link agent',
            "DEFAULT_SERVER='https://omegav6.jeffdeweyeljefe.workers.dev'",
            'Pairing is explicit.'
          ]) if(!source.includes(marker)) throw new Error(`canonical agent missing launcher marker: ${marker}`);
          if(!source.startsWith('#!/usr/bin/env python3'))throw new Error('canonical agent shebang is not first bytes');
          if(source.length<1000)throw new Error(`canonical agent unexpectedly small: ${source.length}`);
          const sha=createHash('sha256').update(source).digest('hex');
          const receipt=r.headers.get('x-omega-agent-sha256');
          const origin=r.headers.get('x-omega-canonical-origin');
          if(receipt&&receipt!==sha)throw new Error(`agent SHA receipt mismatch: ${receipt} != ${sha}`);
          if(origin&&origin!==base)throw new Error(`canonical origin receipt mismatch: ${origin}`);
          console.log(`R117 AGENT COMPAT LIVE PASS · bytes ${source.length} · sha256 ${sha}`);
          NODE
      - name: Prove fresh durable pairing bootstrap end-to-end
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const session=`r117_ci_bootstrap_${Date.now()}`;
          const bRes=await fetch(base+'/api/hybrid/bootstrap',{
            method:'POST',
            headers:{'content-type':'application/json','x-omega-session-id':session,'cache-control':'no-cache'},
            body:JSON.stringify({rotate:true})
          });
          const b=await bRes.json();
          if(!bRes.ok||b.schema!=='OMEGA_SOVEREIGN_BOOTSTRAP_R117'||!b.bridgeId||!b.secret||!b.pairingCode)throw new Error(`bootstrap failed: HTTP ${bRes.status} ${JSON.stringify({...b,secret:b.secret?'[redacted]':null,pairingCode:b.pairingCode?'[redacted]':null})}`);
          if(b.nativeExecutionClaimed!==false)throw new Error('bootstrap falsely claimed native execution');
          if(b.canonicalOrigin!==base)throw new Error(`wrong canonical origin ${b.canonicalOrigin}`);
          const sRes=await fetch(base+'/api/hybrid/status',{headers:{'x-omega-session-id':session,'x-omega-bridge-id':b.bridgeId,'x-omega-bridge-secret':b.secret,'cache-control':'no-cache'}});
          const s=await sRes.json();
          if(!sRes.ok)throw new Error(`fresh credential did not authenticate status: HTTP ${sRes.status} ${JSON.stringify(s)}`);
          if(s.nativeExecutionClaimed===true)throw new Error('CI bootstrap bridge claimed PC ONLINE without a real heartbeat');
          console.log(`R117 BOOTSTRAP LIVE PASS · bridge authenticated · state ${s.state} · nativeExecutionClaimed false`);
          NODE
