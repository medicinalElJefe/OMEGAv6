name: R895 Exact-Head Portable State Proof

on:
  push:
    branches:
      - feature/r895-canonical-durable-state
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-r895-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r895-source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install exact candidate dependencies
        run: npm install --no-fund
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: R887-R895 inherited deterministic source verification
        run: npm run test:r777
      - name: Build exact OMEGA7 candidate
        run: npm run build
      - name: Install pinned Chromium for real desktop/mobile proof
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Start local-only OMEGA7 preview
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/r895-preview.log 2>&1 &
          echo $! > /tmp/r895-preview.pid
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4173/?omega7=1" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r895-preview.log
          exit 1
      - name: Browser-prove legacy continuity and R895 portable checkpoint transfer
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
          OMEGA_R888_USE_FIXTURES: '1'
        run: node tests/r888-sphere-agent-browser-e2e.mjs
      - name: Stop local preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/r895-preview.pid ]; then kill "$(cat /tmp/r895-preview.pid)" || true; fi
