name: R291 Full Archive Genome Runtime Convergence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r291-full-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-r291:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: npm install
      - name: Audit locked application dependency tree
        run: npm audit --audit-level=high
      - name: Install bounded native donor test dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow matplotlib
      - name: Prove R291 recovered executors and boundaries
        run: |
          node tests/r291-rsc-proof-runtime-invariants.mjs
          node tests/r291-implementation-canon-reconciler-invariants.mjs
          node tests/r291-qti-controlled-agent-invariants.mjs
          node tests/r290-singmaster-proof-atlas-invariants.mjs
      - name: Prove recovered native GPU hierarchy
        run: python tests/r291_native_gpu_donor_test.py
      - name: Prove recovered safe archive scar logic
        run: python tests/r291_safe_archive_recovery_test.py
      - name: Re-prove inherited archive and Hybrid authority
        run: |
          node tests/r241-archive-convergence-invariants.mjs
          node tests/r237-hybrid-command-authority-invariants.mjs
          node tests/r245-full-overall-canon-invariants.mjs
          npx --yes tsx tests/r282-bio-medical-production-invariants.mts
          npx --yes tsx tests/r284-bio-mode-experience-invariants.mts
      - name: Run complete application check and production build
        run: npm run check
      - name: Prove Worker package remains deployable without deployment
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-r291
      - name: Install pinned browser proof runtime
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Prove R291 rendered convergence
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/omega-r291-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null || { cat /tmp/omega-r291-vite.log; exit 1; }
          OMEGA_E2E_URL=http://127.0.0.1:4173 node tests/r291-archive-genome-browser-e2e.mjs
          OMEGA_E2E_URL=http://127.0.0.1:4173 node tests/r284-bio-mode-workbench-browser-e2e.mjs
          OMEGA_E2E_URL=http://127.0.0.1:4173 node tests/r289-live-master-menu-browser-e2e.mjs
          OMEGA_E2E_URL=http://127.0.0.1:4173 node tests/r286-all-surface-browser-e2e.mjs
      - name: Summarize R291 proof boundary
        if: always()
        run: |
          {
            echo '## R291 Full Archive Genome Runtime Convergence'
            echo "- Candidate: $GITHUB_SHA"
            echo '- RSC proof runtime is symbolic/model-space only and fail-closed on failed equivalence.'
            echo '- 675-row Implementation Canon is bound by exact workbook SHA/counts; archive PLANNED is never implementation proof.'
            echo '- QTI controlled-agent core separates proposal/simulation from independent authorization/execution.'
            echo '- Native GPU parenting/supersampling donor is source-recovered and regression-tested; live OpenGL device execution remains device-gated.'
            echo '- B053-derived safe recovery rejects traversal, absolute paths, symlinks, duplicate normalized paths and collisions and verifies multipart size/hash.'
            echo '- Archive Census/Operators render native convergence plus the 26-family Genome queue; search/filter/P1/receipt/scar controls are browser-proven.'
            echo '- Heavy Bio read-only comparison is machine-bound with measurement-authority delta zero.'
            echo '- R290 Singmaster global theorem status remains OPEN.'
            echo '- Existing R125/R141/R146/R147/Hybrid/deployment authorities remain unchanged.'
            echo '- This workflow verifies only; it does not deploy.'
          } >> "$GITHUB_STEP_SUMMARY"
