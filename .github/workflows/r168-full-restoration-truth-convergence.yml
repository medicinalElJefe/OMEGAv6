name: OMEGA R168 Full Restoration Truth Convergence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r168-full-restoration-truth-convergence]

permissions:
  contents: read

concurrency:
  group: omega-r168-restoration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r168:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMEGA_E2E_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm install --no-fund
      - name: Reject high-severity dependency regressions
        run: npm audit --audit-level=high
      - name: Prove R168 effective execution and operator convergence
        run: node tests/r168-full-restoration-truth-convergence-invariants.mjs
      - name: Preserve R167 Optical and R166 residual world authorities
        run: |
          node tests/r167-active-optical-r1532-convergence-invariants.mjs
          node tests/r166-development-residual-world-lens-invariants.mjs
          node tests/r164-development-residual-graph-invariants.mjs
      - name: Preserve restored executor evidence and system inventory
        run: |
          node tests/r46-extreme-restoration-invariants.mjs
          node tests/r47-integrated-restoration-invariants.mjs
          node tests/r48-completion-convergence-invariants.mjs
          node tests/r50-live-state-spine-invariants.mjs
          node tests/r83-full-system-inventory-invariants.mjs
          node tests/r137-live-family-proof-fusion-invariants.mjs
      - name: Preserve execution proof and admission spine
        run: |
          node tests/r163-canonical-core-health-truth-invariants.mjs
          node tests/r162-governed-reflex-execution-invariants.mjs
          node tests/r159-sovereign-execution-convergence-invariants.mjs
          node tests/r147-unified-executor-fabric-invariants.mjs
          node tests/r146-durable-operation-execution-invariants.mjs
          node tests/r143-authoritative-ui-operation-chain-invariants.mjs
          node tests/r142-proof-aware-capability-lifecycle-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
      - name: Full inherited production regression and build
        run: npm run check
      - name: Canonical Worker dry-run from preserved R116 entrypoint
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-r168
      - name: Preserve active Optical Worker dry-run
        run: npx wrangler deploy --config wrangler.optical-machine-r1532.jsonc --dry-run --outdir .wrangler-r168-optical
      - name: Install Chromium for user-facing restoration proof
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact production build locally
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/omega-r168-preview.log 2>&1 &
          echo $! >/tmp/omega-r168-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-r168-preview.log
          exit 1
      - name: Exercise restored operator paths on desktop and mobile
        run: node tests/r168-full-restoration-browser-e2e.mjs
      - name: Browser diagnostics on failure
        if: failure()
        run: cat /tmp/omega-r168-preview.log || true
