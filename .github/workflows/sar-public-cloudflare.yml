name: SAR Public Cloudflare Pages · Permission-Gated Fallback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Cloudflare Pages fallback is intentionally manual.'
          echo 'The current OMEGA_CLOUDFLARE_TOKEN authenticates the account but does not have Cloudflare Pages API permission.'
          echo 'No canonical Worker deployment or existing route was attempted.'
          echo 'Primary public R1 view is the immutable commit-addressed CDN release.'
