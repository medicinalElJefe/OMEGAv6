name: SAR Public Cloudflare Pages

on:
  push:
    branches:
      - release/sar-accumulation-studio-public-r1
  workflow_dispatch:

permissions:
  contents: read

env:
  SAR_PAGES_PROJECT: omega-sar-accumulation-studio-r1
  SAR_PUBLIC_URL: https://omega-sar-accumulation-studio-r1.pages.dev

concurrency:
  group: sar-public-cloudflare-r1
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout sealed SAR release
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sar-accumulation-studio/processor/requirements.txt

      - name: Verify Cloudflare authority is available
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error title=Cloudflare auth required::OMEGA_CLOUDFLARE_TOKEN is unavailable.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error title=Cloudflare account required::CLOUDFLARE_ACCOUNT_ID is unavailable.'; exit 1; }
          npx --yes wrangler@latest whoami

      - name: Install native SAR processor dependencies
        working-directory: sar-accumulation-studio
        run: python -m pip install -r processor/requirements.txt

      - name: Re-prove sealed public build
        working-directory: sar-accumulation-studio
        run: |
          npm run check
          npm test
          python -m compileall -q processor
          python -m pytest -q tests/test_nisar_gcov.py tests/test_nisar_gunw.py tests/test_omega_sar_public.py
          python -m processor.cli --help | grep -q 'gunw-extract'
          grep -q 'PUBLIC SCIENTIFIC WORKSTATION' index.html
          grep -q 'GCOV + GUNW' index.html
          grep -q 'omega.sar.nisar.gunw.measurement.v1' src/nisar-console.mjs

      - name: Prove isolated deployment target
        shell: bash
        run: |
          test "$SAR_PAGES_PROJECT" != 'omegav6'
          test "$SAR_PAGES_PROJECT" != 'omega-genesis-v1'
          if grep -RniE 'wrangler[[:space:]]+deploy|omegav6\.jeffdeweyeljefe\.workers\.dev' sar-accumulation-studio --exclude-dir=node_modules; then
            echo '::error title=Authority isolation failed::Standalone package contains canonical Worker deployment text.'
            exit 1
          fi
          echo "Standalone target: $SAR_PAGES_PROJECT"

      - name: Create isolated Pages project if absent
        shell: bash
        run: |
          npx --yes wrangler@latest pages project list --json > /tmp/pages-projects.json
          if node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/pages-projects.json','utf8'));process.exit(Array.isArray(x)&&x.some(p=>p.name===process.env.SAR_PAGES_PROJECT)?0:1)"; then
            echo "Pages project $SAR_PAGES_PROJECT already exists; reusing only that isolated project."
          else
            npx --yes wrangler@latest pages project create "$SAR_PAGES_PROJECT" --production-branch "release/sar-accumulation-studio-public-r1"
          fi

      - name: Deploy verified static workstation
        shell: bash
        run: |
          npx --yes wrangler@latest pages deploy sar-accumulation-studio \
            --project-name "$SAR_PAGES_PROJECT" \
            --branch "release/sar-accumulation-studio-public-r1" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "OMEGA SAR public R1 $GITHUB_SHA"

      - name: Verify live public workstation
        shell: bash
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --location --max-time 20 "$SAR_PUBLIC_URL/" > /tmp/sar-public.html; then
              if grep -q 'PUBLIC SCIENTIFIC WORKSTATION' /tmp/sar-public.html && grep -q 'GCOV + GUNW' /tmp/sar-public.html; then
                curl --fail --silent --show-error --location "$SAR_PUBLIC_URL/src/nisar-console.mjs" | grep -q 'omega.sar.nisar.gunw.measurement.v1'
                curl --fail --silent --show-error --location "$SAR_PUBLIC_URL/src/canon-console.mjs" >/dev/null
                curl --fail --silent --show-error --location "$SAR_PUBLIC_URL/public.css" >/dev/null
                echo "PUBLIC_SAR_URL=$SAR_PUBLIC_URL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::error title=Public verification failed::Cloudflare Pages URL did not serve the sealed SAR workstation.'
          exit 1
