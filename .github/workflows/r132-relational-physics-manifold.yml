name: OMEGA R132 Relational Physics Manifold

on:
  push:
    branches:
      - r132-physics-relational-manifold
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relational-physics-manifold:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: R132 relational physics manifold invariants
        run: node tests/r132-relational-physics-manifold-invariants.mjs
      - name: Preserve all inherited source, mode, relativity and visual gates
        run: npm run check
      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r132-dry-run
