name: OMEGA R125 Accuracy First Engine

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows:
      - OMEGA R144 Runtime Deployment Attestation
      - OMEGA Release Evidence Live Verify
      - OMEGA R143 Authoritative UI Operation Chain
      - OMEGA R124 Self-Contained Continuous Build
      - OMEGA R123 Living Total Experience
      - OMEGA R122 Computed Reality Convergence
      - OMEGA R121 Spherical Earth Connector Gate
      - OMEGA Cloud Bridge CI
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: omega-r125-accuracy-engine-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  observe-and-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Collect objective workflow evidence
        shell: bash
        run: |
          gh run list --branch main --limit 40 --json databaseId,workflowName,status,conclusion,headSha,url,createdAt > /tmp/omega-r125-runs.json
      - name: Verify inherited accuracy operation-chain lifecycle and deployment boundaries
        run: |
          node tests/r144-runtime-deployment-attestation-invariants.mjs
          node tests/r143-authoritative-ui-operation-chain-invariants.mjs
          node tests/r142-proof-aware-capability-lifecycle-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r124-self-contained-build-invariants.mjs
          node tests/r123-living-total-experience-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
      - name: Observe measured residuals
        run: node scripts/r125-accuracy-engine.mjs
      - name: Apply only registered low-risk high-confidence repair
        env:
          OMEGA_R125_APPLY: '1'
        run: node scripts/r125-accuracy-engine.mjs
      - name: Prove repaired tree
        run: |
          node tests/r144-runtime-deployment-attestation-invariants.mjs
          node tests/r143-authoritative-ui-operation-chain-invariants.mjs
          node tests/r142-proof-aware-capability-lifecycle-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r124-self-contained-build-invariants.mjs
          node tests/r123-living-total-experience-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
          npm run build
      - name: Admit only an actual proved repair
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          REPAIR=$(node -e "const fs=require('fs');const p='public/omega-r125-proposal.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));process.stdout.write(x.repairApplied===true?'1':'0')")
          if [ "$REPAIR" != "1" ]; then
            echo 'Observation only; no canonical mutation.'
            exit 0
          fi
          START=$(git rev-parse HEAD)
          git fetch origin main
          CURRENT=$(git rev-parse origin/main)
          if [ "$START" != "$CURRENT" ]; then
            echo "main moved from $START to $CURRENT; refusing stale mutation"
            exit 42
          fi
          git config user.name 'OMEGA R125 Accuracy Engine'
          git config user.email 'actions@users.noreply.github.com'
          if [ -e src/generated/selfbuild/index.ts ]; then git add -- src/generated/selfbuild/index.ts; fi
          git add -- public/omega-r125-accuracy-state.json public/omega-r125-proposal.json
          if git diff --cached --quiet; then
            echo 'Repair produced no canonical delta; refusing empty admission.'
            exit 0
          fi
          git commit -m 'R125 accuracy engine: admit proved bounded repair'
          git push origin HEAD:main
