name: OMEGA R238 Hybrid Correlated Snapshot Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Prove R238 shared snapshot invariants
        run: node tests/r238-hybrid-correlated-snapshot-invariants.mjs
      - name: Preserve R237 command authority
        run: node tests/r237-hybrid-command-authority-invariants.mjs
      - name: Full inherited regression and build
        run: npm run check
      - name: Worker dry-run only
        run: npx wrangler deploy --dry-run --outdir .wrangler-r238-dry-run

  browser-proof:
    needs: source-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Prove one observation epoch feeds R212 and R237
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/r238-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          let hybridGets=0,missionGets=0;
          const caps=['DESKTOP_HEALTH','HASH_TREE','FORENSIC_HASH_LEDGER','INDEX','BUILD','TEST','PACKAGE','TRAIN_LOCAL'];
          const now=Date.now();
          const hybrid={state:'VERIFIED_DEVICE_ONLINE',nativeExecutionClaimed:true,devices:[
            {id:'dev-a',name:'OMEGA PC A',online:true,revoked:false,lastSeen:now,rootLabel:'J:/OMEGA-A',capabilities:caps},
            {id:'dev-b',name:'OMEGA PC B',online:true,revoked:false,lastSeen:now,rootLabel:'J:/OMEGA-B',capabilities:caps}
          ],jobs:[
            {id:'job_a',targetDeviceId:'dev-a',status:'QUEUED',steps:[{id:'S01',op:'HASH_TREE'}]},
            {id:'job_b',targetDeviceId:'dev-b',status:'QUEUED',steps:[{id:'S01',op:'BUILD'}]},
            {id:'ret_a',targetDeviceId:'dev-a',status:'COMPLETE',completedAt:now-5000,returnPacket:{receivedAt:now-5000,resultFingerprint:'fp-a',stepProofs:[{id:'S01',op:'BUILD',ok:true,result:{exitCode:0}}]}},
            {id:'ret_b',targetDeviceId:'dev-b',status:'COMPLETE',completedAt:now-4000,returnPacket:{receivedAt:now-4000,resultFingerprint:'fp-b',stepProofs:[{id:'S01',op:'TEST',ok:true,result:{exitCode:0}}]}}
          ]};
          const missions={ok:true,state:'VERIFIED_DEVICE_ONLINE',missions:[
            {id:'mission_a',targetDeviceId:'dev-a',status:'ACTIVE',cycle:2,maxCycles:12,currentJobId:'job_a'},
            {id:'mission_b',targetDeviceId:'dev-b',status:'ACTIVE',cycle:4,maxCycles:12,currentJobId:'job_b'}
          ]};
          await page.route('**/api/hybrid/status',route=>{hybridGets++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(hybrid)})});
          await page.route('**/api/missions',route=>{missionGets++;return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(missions)})});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.locator('.r132-inspector-tabs').getByRole('button',{name:'TOOLS',exact:true}).click();
          const hybridEntry=page.locator('.r96-quick-card button').filter({hasText:'Hybrid'}).first();
          await hybridEntry.waitFor({state:'visible'}); await hybridEntry.click();
          const r212=page.locator('[data-r212-host-effects="FIRST_HAND_RETURN_ONLY"]');
          const r237=page.locator('[data-r237-command-authority="AUTHENTICATED_BOUNDED_NATIVE_CONTROL"]');
          await Promise.all([r212.waitFor({state:'visible'}),r237.waitFor({state:'visible'})]);
          const select=r237.getByRole('combobox',{name:'Authenticated compute host'});
          await select.selectOption('dev-b');
          await page.waitForFunction(()=>document.querySelector('[data-r212-host-effects]')?.getAttribute('data-r212-selected-device')==='dev-b'&&document.querySelector('[data-r237-command-authority]')?.getAttribute('data-r237-selected-device')==='dev-b');
          const e212=await r212.getAttribute('data-r212-snapshot-epoch');
          const e237=await r237.getAttribute('data-r237-snapshot-epoch');
          if(!e212||e212!==e237)throw new Error(`R238 epoch divergence R212=${e212} R237=${e237}`);
          if(await r237.getAttribute('data-r237-correlation')!=='LOCKED')throw new Error('R238 shared correlation not locked');
          const t212=await r212.innerText(),t237=await r237.innerText();
          for(const token of ['OMEGA PC B','job_b','mission_b'])if(!t237.includes(token))throw new Error(`R237 missing selected-host ${token}`);
          if(!t212.includes('fp-b'))throw new Error('R212 did not expose selected-host return fingerprint');
          for(const forbidden of ['job_a','mission_a','fp-a'])if(t212.includes(forbidden)||t237.includes(forbidden))throw new Error(`R238 leaked foreign host context ${forbidden}`);
          const beforeH=hybridGets,beforeM=missionGets;
          await r237.getByRole('button',{name:'Refresh shared snapshot'}).click();
          await page.waitForFunction(([h,m])=>window.__r238_dummy!==true,{timeout:50}).catch(()=>{});
          await page.waitForTimeout(250);
          if(hybridGets-beforeH!==1||missionGets-beforeM!==1)throw new Error(`R238 refresh should issue one paired GET, saw hybrid +${hybridGets-beforeH} missions +${missionGets-beforeM}`);
          if(pageErrors.length)throw new Error(pageErrors.join(' | '));
          console.log(`R238 BUILT BROWSER PASS · R212/R237 device dev-b · shared epoch ${e212} · paired refresh · foreign host isolated`);
          await browser.close();
          NODE
