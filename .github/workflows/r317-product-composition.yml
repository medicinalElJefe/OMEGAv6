name: R317 Product Composition
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  prove-r317:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove single canonical product composition
        run: node tests/r317-single-product-composition-invariants.mjs
      - name: Typecheck and production build
        run: npm run check && npm run build
