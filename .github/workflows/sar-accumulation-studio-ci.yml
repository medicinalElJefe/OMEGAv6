name: SAR Accumulation Studio CI

on:
  push:
    branches:
      - feature/sar-accumulation-studio
    paths:
      - 'sar-accumulation-studio/**'
      - '.github/workflows/sar-accumulation-studio-ci.yml'
  pull_request:
    paths:
      - 'sar-accumulation-studio/**'
      - '.github/workflows/sar-accumulation-studio-ci.yml'

permissions:
  contents: read

concurrency:
  group: sar-accumulation-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sar-accumulation-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sar-accumulation-studio/processor/requirements.txt

      - name: Runtime versions
        run: |
          node --version
          python --version

      - name: Install native SAR processor dependencies
        run: python -m pip install -r processor/requirements.txt

      - name: Syntax checks
        run: |
          npm run check
          python -m compileall -q processor
          python -m processor.cli --help >/tmp/omega-sar-cli.txt
          grep -q 'gunw-extract' /tmp/omega-sar-cli.txt
          grep -q 'stack' /tmp/omega-sar-cli.txt

      - name: Deterministic JS unit and invariant tests
        run: npm test

      - name: Native NISAR GCOV GUNW and accumulation tests
        run: python -m pytest -q tests/test_nisar_gcov.py tests/test_nisar_gunw.py tests/test_omega_sar_public.py

      - name: Static public workstation smoke
        run: |
          python -m http.server 8765 >/tmp/sar-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/ >/tmp/sar-index.html; then break; fi
            sleep 0.25
          done
          grep -q 'OMEGA · SAR ACCUMULATION STUDIO' /tmp/sar-index.html
          grep -q 'GCOV + GUNW' /tmp/sar-index.html
          grep -q 'PUBLIC SCIENTIFIC WORKSTATION' /tmp/sar-index.html
          grep -q 'src/canon-console.mjs' /tmp/sar-index.html
          grep -q 'src/nisar-console.mjs' /tmp/sar-index.html
          grep -q 'public.css' /tmp/sar-index.html
          curl --fail --silent http://127.0.0.1:8765/src/charted-canon.mjs >/dev/null
          curl --fail --silent http://127.0.0.1:8765/src/sentinel1-calibration.mjs >/dev/null
          curl --fail --silent http://127.0.0.1:8765/src/nisar-console.mjs | grep -q 'omega.sar.nisar.gunw.measurement.v1'
          curl --fail --silent http://127.0.0.1:8765/public.css >/dev/null
          curl --fail --silent http://127.0.0.1:8765/data/earth-grid.part06.txt >/dev/null

      - name: Prove non-deployment authority
        run: |
          if grep -RniE 'wrangler[[:space:]]+deploy|vercel[[:space:]]+deploy|cloudflare.*deploy' . --exclude-dir=node_modules; then
            echo 'Unexpected deployment authority text found in standalone SAR package.' >&2
            exit 1
          fi
          echo 'SAR CI is read/test only; no production deploy command is present.'
