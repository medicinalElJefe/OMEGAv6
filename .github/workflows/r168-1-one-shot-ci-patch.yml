name: R168.1 One-Shot CI Patch

on:
  push:
    branches: [r168-1-rcwa-byte-attestation-repair]
    paths:
      - '.github/workflows/r168-1-one-shot-ci-patch.yml'

permissions:
  contents: write

jobs:
  patch-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r168-1-rcwa-byte-attestation-repair
      - name: Replace one-shot RCWA verification with bounded R168.1 verifier
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/ci.yml')
          text=path.read_text()
          start=text.index('      - name: Verify Federation Run and canonical RCWA downloads')
          end=text.index('      - name: Verify R8 Earth evidence and governed Hybrid contracts',start)
          replacement='''      - name: Verify Federation Run and canonical RCWA downloads\n        run: node scripts/verify_federation_live_r1681.mjs\n'''
          updated=text[:start]+replacement+text[end:]
          if updated==text:
              raise SystemExit('CI patch produced no change')
          path.write_text(updated)
          PY
      - name: Commit exact CI repair
        run: |
          git config user.name 'OMEGA governed CI repair'
          git config user.email 'noreply@github.com'
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'R168.1 use bounded RCWA propagation verifier in canonical deploy gate'
          git push origin HEAD:r168-1-rcwa-byte-attestation-repair
