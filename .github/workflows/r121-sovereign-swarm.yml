name: OMEGA R121 Sovereign Swarm

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-r121:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify R121 pure swarm invariants
        run: node tests/r121-swarm-runtime-invariants.mjs
      - name: Verify R121 Worker syntax
        run: node --check src/workerR121.js
      - name: Run complete inherited OMEGA regression/build gate
        run: npm run check
      - name: Verify canonical Wrangler bundle with new Durable Object classes
        run: npx wrangler deploy --dry-run --outdir .wrangler-r121-dry-run

  live-r121:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-r121
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for canonical deployment then verify 1728-cell runtime
        env:
          OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let manifest=null,last='';
          for(let i=0;i<30;i++){
            try{
              const r=await fetch(base+'/api/swarm/manifest',{headers:{'cache-control':'no-cache'}});
              const j=await r.json();
              if(r.ok&&j.runtimeRevision==='R121'&&j.hierarchy?.cells===1728&&j.hierarchy?.lanes===20736){manifest=j;break}
              last=`${r.status} ${JSON.stringify(j).slice(0,300)}`;
            }catch(e){last=String(e)}
            await sleep(10000);
          }
          if(!manifest)throw new Error('R121 manifest not live: '+last);
          const cells=await fetch(base+'/api/swarm/cells?offset=0&limit=2',{headers:{'cache-control':'no-cache'}}).then(r=>r.json());
          if(cells.total!==1728||cells.cells?.length!==2)throw new Error('cell directory failed');
          const launch=await fetch(base+'/api/swarm/missions',{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({intent:'R121 live deterministic swarm proof',mode:'SOLO',requestedCells:1,providerBudget:0})});
          const created=await launch.json();
          if(!launch.ok||!created.mission?.id)throw new Error('SOLO mission create failed: '+JSON.stringify(created).slice(0,400));
          let complete=null;
          for(let i=0;i<20;i++){
            const r=await fetch(base+'/api/swarm/missions/'+created.mission.id,{headers:{'cache-control':'no-cache'}}),j=await r.json();
            if(j.mission?.status==='COMPLETE'){complete=j.mission;break}
            await sleep(1500);
          }
          if(!complete||complete.completed!==1||complete.proofState!=='RETURNED_NOT_ADMITTED')throw new Error('SOLO mission did not close truthfully');
          console.log('R121 LIVE PASS · 1728 cells · 20736 lanes · mission '+created.mission.id);
          NODE
