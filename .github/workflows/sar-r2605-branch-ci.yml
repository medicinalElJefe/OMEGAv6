name: SAR R260.5 Branch Verification

on:
  push:
    branches:
      - r260-5-nonstarvable-field-lemma-handoff
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r2605:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify SAR source and invariants
        working-directory: sar-accumulation-studio
        run: |
          npm run check
          npm test
          node --check src/omega-field-console.mjs
          node --check src/omega-lemma-translator-runtime.mjs
          node --check src/sar-smooth-motion-runtime.mjs
          node --check tests/r251-global-motion-e2e.mjs
          node --check tests/r260-5-field-lemma-handoff.test.mjs
      - name: Run R260.5 handoff invariants explicitly
        working-directory: sar-accumulation-studio
        run: node --test tests/r260-5-field-lemma-handoff.test.mjs
