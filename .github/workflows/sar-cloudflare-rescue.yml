name: SAR Cloudflare Rescue

on:
  push:
    branches:
      - release/sar-public-rescue
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sar-cloudflare-rescue
  cancel-in-progress: true

env:
  SAR_PUBLIC_URL: https://omega-sar-rescue.jeffdeweyeljefe.workers.dev

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout rescue branch
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify SAR source
        working-directory: sar-accumulation-studio
        run: |
          npm run check
          npm test

      - name: Verify Cloudflare authorization
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error title=AUTH REQUIRED::OMEGA_CLOUDFLARE_TOKEN unavailable'; exit 1; }
          npx wrangler@latest whoami

      - name: Dry-run standalone SAR Worker
        run: npx wrangler@latest deploy --config wrangler.sar-rescue.jsonc --dry-run --outdir .wrangler-sar-rescue

      - name: Deploy standalone SAR Worker
        run: npx wrangler@latest deploy --config wrangler.sar-rescue.jsonc

      - name: Verify live SAR application and module MIME
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            code="$(curl -sS -o /tmp/sar-index.html -w '%{http_code}' -H 'cache-control: no-cache' "$SAR_PUBLIC_URL/" || true)"
            if [ "$code" = 200 ] && grep -q 'OMEGA · SAR ACCUMULATION STUDIO' /tmp/sar-index.html; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              echo "::error title=LIVE ROOT FAILED::SAR root did not become healthy; HTTP $code"
              exit 1
            fi
            sleep 3
          done
          code="$(curl -sS -D /tmp/app.headers -o /tmp/app.mjs -w '%{http_code}' -H 'cache-control: no-cache' "$SAR_PUBLIC_URL/src/app.mjs")"
          test "$code" = 200 || { echo "::error title=MODULE FAILED::app.mjs HTTP $code"; exit 1; }
          grep -qiE '^content-type:.*(javascript|ecmascript|text/plain)' /tmp/app.headers || { cat /tmp/app.headers; echo '::error title=MIME FAILED::Unexpected module MIME'; exit 1; }
          grep -q 'const renderer' /tmp/app.mjs || { echo '::error title=MODULE CONTENT FAILED::app.mjs content missing'; exit 1; }
          echo "SAR_RESCUE_LIVE=$SAR_PUBLIC_URL"
