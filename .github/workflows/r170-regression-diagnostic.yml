name: OMEGA R170 Regression Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [r170-continuous-geometric-selfbuild-main]
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-fund
      - name: Worker syntax
        continue-on-error: true
        run: node --check src/worker.js && node --check src/workerR34.js && node --check src/workerR101.js && node --check src/workerLiveStateR51.js && node --check src/workerPacketProofR52.js && node --check src/workerDeltaMeshR53.js && node --check src/workerProofChainR54.js && node --check src/workerPerformanceProviderR55.js && node --check src/workerR8.js && node --check src/workerR9.js && node --check src/workerR27.js && node --check src/workerR32.js && node --check src/workerR33.js
      - name: Routes
        continue-on-error: true
        run: npm run test:routes
      - name: Restore
        continue-on-error: true
        run: npm run test:restore
      - name: Navigation
        continue-on-error: true
        run: npm run test:navigation
      - name: Home
        continue-on-error: true
        run: npm run test:home
      - name: Portability
        continue-on-error: true
        run: npm run test:portability
      - name: Applications
        continue-on-error: true
        run: npm run test:applications
      - name: Cloud
        continue-on-error: true
        run: npm run test:cloud
      - name: Visual
        continue-on-error: true
        run: npm run test:visual
      - name: Depth
        continue-on-error: true
        run: npm run test:depth
      - name: Lineage
        continue-on-error: true
        run: npm run test:lineage
      - name: PC spine
        continue-on-error: true
        run: npm run test:pc-spine
      - name: Trajectory
        continue-on-error: true
        run: npm run test:trajectory
      - name: Relativity
        continue-on-error: true
        run: npm run test:relativity
      - name: World
        continue-on-error: true
        run: npm run test:world
      - name: Admissibility
        continue-on-error: true
        run: npm run test:admissibility
      - name: Hybrid
        continue-on-error: true
        run: npm run test:hybrid
      - name: Archive
        continue-on-error: true
        run: npm run test:archive
      - name: Quality
        continue-on-error: true
        run: npm run test:quality
      - name: SAI
        continue-on-error: true
        run: npm run test:sai
      - name: System Atlas
        continue-on-error: true
        run: npm run test:system-atlas
      - name: Render portability
        continue-on-error: true
        run: npm run test:render-portability
      - name: R38
        continue-on-error: true
        run: npm run test:r38
      - name: Correlation
        continue-on-error: true
        run: npm run test:correlation
      - name: R39-R48
        continue-on-error: true
        run: npm run test:r39 && npm run test:r40 && npm run test:r41 && npm run test:r43 && npm run test:r44 && npm run test:r45 && npm run test:r45-convergence && npm run test:r46 && npm run test:r47 && npm run test:r48
      - name: R49-R59
        continue-on-error: true
        run: npm run test:r49 && npm run test:r50 && npm run test:r51 && npm run test:r52 && npm run test:r53 && npm run test:r54 && npm run test:r55 && npm run test:r58 && npm run test:r59
      - name: R67-R95
        continue-on-error: true
        run: npm run test:r67 && npm run test:r77 && npm run test:r79 && npm run test:r80 && npm run test:r81 && npm run test:r82 && npm run test:r83 && npm run test:r84 && npm run test:r85 && npm run test:r86 && npm run test:r87 && npm run test:r88 && npm run test:r89 && npm run test:r90 && npm run test:r91 && npm run test:r92 && npm run test:r93 && npm run test:r94 && npm run test:r95
      - name: R97-R110
        continue-on-error: true
        run: npm run test:r97 && npm run test:r99 && npm run test:r101 && npm run test:r104 && npm run test:r107 && npm run test:r108 && npm run test:r109 && npm run test:r110
      - name: Build
        continue-on-error: true
        run: npm run build
      - name: Package check static wrapper
        continue-on-error: true
        run: npm run check:static
      - name: Package full check wrapper
        continue-on-error: true
        run: npm run check
