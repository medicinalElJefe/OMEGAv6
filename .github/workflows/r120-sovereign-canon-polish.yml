name: OMEGA R120 Sovereign Canon Polish

on:
  push:
    branches: [main, r120-sovereign-canon-polish]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev

jobs:
  verify-r120:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify R120 storage, navigation, Canon and SAI invariants
        run: node tests/r120-sovereign-canon-polish-invariants.mjs
      - name: Verify inherited real Sovereign bootstrap
        run: node tests/r117-real-sovereign-bootstrap-invariants.mjs
      - name: Verify inherited Sovereign living fabric
        run: node tests/r112-sovereign-living-fabric-invariants.mjs
      - name: Execute full inherited regression and production build gate
        run: npm run check
      - name: Canonical Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r120-canonical

  live-r120:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-r120
    runs-on: ubuntu-latest
    steps:
      - name: Wait for promoted canonical runtime
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let attempt=1;attempt<=36;attempt++){
            try{
              const r=await fetch(base+'/api/health',{headers:{'cache-control':'no-cache'}});
              if(r.ok){console.log(`Canonical runtime reachable on attempt ${attempt}`);process.exit(0)}
              last=`HTTP ${r.status}`;
            }catch(e){last=String(e)}
            await sleep(10000);
          }
          throw new Error(`canonical runtime not reachable: ${last}`);
          NODE
      - name: Re-prove canonical Hybrid asset identity without claiming Windows execution
        shell: bash
        run: |
          node <<'NODE'
          import {createHash} from 'node:crypto';
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const r=await fetch(base+'/api/hybrid/agent-download?r120=1',{headers:{'cache-control':'no-cache'}});
          const source=await r.text();
          if(!r.ok)throw new Error(`agent download failed: HTTP ${r.status}`);
          for(const marker of ['#!/usr/bin/env python3','OMEGA R34 local Hybrid Link agent',"DEFAULT_SERVER='https://omegav6.jeffdeweyeljefe.workers.dev'",'Pairing is explicit.'])if(!source.includes(marker))throw new Error(`missing canonical marker: ${marker}`);
          const sha=createHash('sha256').update(source).digest('hex');
          const receipt=r.headers.get('x-omega-agent-sha256');
          if(receipt&&receipt!==sha)throw new Error(`agent receipt mismatch ${receipt} != ${sha}`);
          console.log(`R120 CLOUD ASSET PASS · ${source.length} bytes · sha256 ${sha}`);
          console.log('Windows CMD syntax, J-root storage, and PC heartbeat remain target-host evidence domains.');
          NODE
