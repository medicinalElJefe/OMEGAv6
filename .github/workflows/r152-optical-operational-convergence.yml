name: OMEGA R152 Optical Operational Convergence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, r152-optical-operational-convergence]

permissions:
  contents: read

env:
  OPTICAL_R152_URL: https://omega-optical-machine-r152.jeffdeweyeljefe.workers.dev

concurrency:
  group: omega-r152-optical-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify-r152:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax-check R152 service and Vercel exporter
        run: |
          node --check services/opticalMachineR152.js
          node --check services/opticalUiR152.js
          node --check apps/omega-optical-r152/build.mjs
      - name: Prove R152 optical convergence invariants
        run: node tests/r152-optical-operational-convergence-invariants.mjs
      - name: Export the single-source Vercel surface
        working-directory: apps/omega-optical-r152
        run: |
          npm run build
          test -s dist/index.html
          grep -q "VOLUMETRIC ADDRESS FIELD" dist/index.html
          grep -q "PREPARED_NOT_SOLVED" dist/index.html
      - name: Preserve inherited optical and sovereign truth gates
        run: |
          node tests/r115-machine-adapters-invariants.mjs
          node tests/r151-sovereign-build-execution-spine-invariants.mjs
      - name: Full inherited production regression
        run: npm run check
      - name: R152 machine Worker dry run
        run: npx wrangler deploy --config wrangler.optical-machine-r152.jsonc --dry-run --outdir .wrangler-r152-optical
      - uses: actions/upload-artifact@v4
        with:
          name: omega-optical-r152-vercel-surface
          path: apps/omega-optical-r152/dist
          if-no-files-found: error

  deploy-r152-machine:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-r152
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Cloudflare authorization preflight
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error title=AUTH REQUIRED::OMEGA_CLOUDFLARE_TOKEN unavailable"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error title=ACCOUNT REQUIRED::CLOUDFLARE_ACCOUNT_ID unavailable"; exit 1; }
      - name: Deploy additive R152 optical SCREEN worker
        run: npx wrangler deploy --config wrangler.optical-machine-r152.jsonc
      - name: Live-probe R152 machine, atlas, UI and candidate screen
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OPTICAL_R152_URL.replace(/\/$/,'');
          const healthResponse=await fetch(base+'/api/health',{headers:{'cache-control':'no-cache'}}),health=await healthResponse.json();
          if(!healthResponse.ok||health.ok!==true||health.version!=='R152.0'||health.authority!=='SCREEN_ONLY'||health.atlasSize!==20736)throw new Error(`R152 health failed: ${JSON.stringify(health)}`);
          const atlasResponse=await fetch(base+'/api/optical/atlas?offset=0&limit=12&wavelength_nm=532',{headers:{'cache-control':'no-cache'}}),atlas=await atlasResponse.json();
          if(!atlasResponse.ok||atlas.items?.length!==12||atlas.total!==20736)throw new Error(`R152 atlas failed: ${JSON.stringify(atlas)}`);
          const uiResponse=await fetch(base+'/',{headers:{'cache-control':'no-cache'}}),ui=await uiResponse.text();
          if(!uiResponse.ok||!ui.includes('VOLUMETRIC ADDRESS FIELD')||!ui.includes('PREPARED_NOT_SOLVED'))throw new Error('R152 UI live probe failed');
          const proposal={schema:'OMEGA_PACKET_v1',packet_id:'r152_live_probe',source_node:'omega-genesis',source_sha:'r152_live_probe',wavelength_nm:532,target_phase_deg:150,geometry:{pitch_nm:330,width_nm:105,length_nm:290,height_nm:575,orientation_deg:75,material:'TIO2_DESIGN_NOMINAL_ON_SIO2_FUSED'},polarization:'circular',lineage:['r152-live-probe']};
          const screenResponse=await fetch(base+'/api/federation/screen',{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({proposal})}),screen=await screenResponse.json();
          if(!screenResponse.ok||screen.authority!=='SCREEN_ONLY'||screen.packet?.source_node!=='omega-optical'||screen.canonical_mutation!==false)throw new Error(`R152 screen failed: ${JSON.stringify(screen)}`);
          if(screen.tier2_job&&screen.tier2_job.state!=='PREPARED_NOT_SOLVED')throw new Error('R152 Tier-2 truth boundary failed');
          console.log(`R152 LIVE PASS · ${health.service} · atlas ${atlas.total} · ${screen.packet.proof.gate} · UI served`);
          NODE
