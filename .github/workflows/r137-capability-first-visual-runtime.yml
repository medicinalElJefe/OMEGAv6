name: OMEGA R137 Capability First Visual Runtime
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  prove-r137:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prove R137 capability-first visuals
        run: node tests/r137-capability-first-visual-runtime.mjs
      - name: Preserve R136 living world frame
        run: node tests/r136-living-world-frame-invariants.mjs
      - name: Preserve R134 continuity layers
        run: |
          node tests/r134-canonical-world-continuity.mjs
          node tests/r134-woven-relativity-continuum-invariants.mjs
      - name: Preserve R132 advanced physics and Hybrid execution
        run: |
          node tests/r132-relational-physics-manifold-invariants.mjs
          node tests/r132-hybrid-execution-plane-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Worker bundle dry run
        run: npx wrangler deploy --dry-run
