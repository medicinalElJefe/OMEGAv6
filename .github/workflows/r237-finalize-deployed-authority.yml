name: R237 Finalize Deployed Authority

on:
  push:
    branches:
      - r237-hybrid-command-authority

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r237-hybrid-command-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact deployed-authority finalization
        run: python .github/r237_finalize_authority.py
      - name: Prove focused R117 and R237 authority contracts
        run: |
          node --check src/workerR116.js
          node --check src/workerR32.js
          node tests/r117-real-sovereign-bootstrap-invariants.mjs
          node tests/r237-hybrid-command-authority-invariants.mjs
      - name: Commit exact finalization and remove scaffold
        run: |
          git rm -f .github/workflows/r237-finalize-deployed-authority.yml
          git rm -f .github/r237_finalize_authority.py
          git rm -f .github/r237-finalize.trigger || true
          git add src/workerR116.js .github/workflows/ci.yml
          git config user.name 'Jeffrey A Dewey'
          git config user.email 'b6qrfb57ky@privaterelay.appleid.com'
          git commit -m 'R237: bind authenticated rotation into canonical deployment'
          git push origin HEAD:r237-hybrid-command-authority
