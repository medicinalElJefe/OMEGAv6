name: OMEGA R130 Max Capacity Organism

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, r130-max-capacity-organism]

permissions:
  contents: read

concurrency:
  group: omega-r130-organism-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-r130:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove R130 maximum-capacity organism
        run: node tests/r130-max-capacity-organism-invariants.mjs
      - name: Preserve R129 reproducible empirical experiment runtime
        run: node --experimental-strip-types tests/r129-empirical-experiment-runtime.mjs
      - name: Preserve R128 empirical calibration and replay discipline
        run: node --experimental-strip-types tests/r128-empirical-calibration-replay.mjs
      - name: Preserve R127 evidence execution proof fabric
        run: node --experimental-strip-types tests/r127-evidence-execution-proof-fabric.mjs
      - name: Preserve R126 maximum and causal interaction fabrics
        run: |
          node tests/r126-total-maximum-build-invariants.mjs
          node --experimental-strip-types tests/r126-causal-interaction-relativity.mjs
          node tests/r126-causal-interaction-invariants.mjs
      - name: Preserve R125 accuracy and autonomic authority
        run: |
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
      - name: Preserve inherited organism self-build reality Earth continuity relativity federation SAI gates
        run: |
          node tests/r124-self-contained-build-invariants.mjs
          node tests/r123-organism-swarm-invariants.mjs
          node tests/r123-living-total-experience-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
          node tests/r121-swarm-runtime-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
          node tests/r77-woven-continuity-invariants.mjs
          node tests/dimensional-relativity-r24-invariants.mjs
          node tests/r97-federation-run-invariants.mjs
          node tests/sai-b059-invariants.mjs
      - name: Verify successor runtime syntax
        run: |
          node --check src/swarm/swarmCortexR130.js
          node --check src/swarm/swarmCortexApiR130.js
          node --check src/workerR130.js
          node --check src/swarm/swarmAutonomicR125.js
          node --check src/workerR116.js
      - name: Execute complete inherited OMEGA regression and production build
        run: npm run check
      - name: Verify R130 Durable Object migration and Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-r130-dry-run
      - name: Assert R130 public manifest emitted
        shell: bash
        run: |
          test -f dist/omega-r130-max-capacity-organism.json
          grep -q 'OMEGA_R130_MAX_CAPACITY_ORGANISM' dist/omega-r130-max-capacity-organism.json
          echo 'R130 MAX CAPACITY ORGANISM: PROVED'

  live-r130:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prove-r130
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for governed deploy and prove real cell-to-body execution
        env:
          OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}}),j=await r.json();if(!r.ok)throw new Error(`${path} ${r.status} ${JSON.stringify(j).slice(0,500)}`);return j}
          async function post(path,body={}){const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(`${path} ${r.status} ${JSON.stringify(j).slice(0,500)}`);return j}
          let manifest,last='';
          for(let i=0;i<48;i++){
            try{const j=await get('/api/swarm/cortex/manifest');if(j.runtime==='OMEGA_R130_MAX_CAPACITY_ORGANISM'&&j.hierarchy?.cells===1728&&j.fullBodyExecutionTasks===undefined){manifest=j;break}last=JSON.stringify(j).slice(0,400)}catch(e){last=String(e)}
            await sleep(10000);
          }
          if(!manifest)throw new Error('R130 organism not live after governed deployment: '+last);
          const plan=await post('/api/swarm/cortex/plan',{intent:'R130 live proof bounded cell-to-body verification',mode:'FULL',scope:{type:'CELL',domain:10,phase:11,regulation:3},providerBudget:0,dispatchWidth:8,projection:'PROOF'});
          if(plan.plan?.selectedCellCount!==1||plan.plan?.totalTaskCount!==7||plan.plan?.authority!=='CORTEX_EXECUTION_FABRIC_NOT_CANON')throw new Error('R130 live plan contract failed: '+JSON.stringify(plan).slice(0,700));
          const created=await post('/api/swarm/cortex/missions',{intent:'R130 live proof bounded cell-to-body verification',mode:'FULL',scope:{type:'CELL',domain:10,phase:11,regulation:3},providerBudget:0,dispatchWidth:8,projection:'PROOF'});
          const id=created.mission?.id;if(!id)throw new Error('R130 live mission id missing');
          let mission;
          for(let i=0;i<24;i++){
            mission=(await get(`/api/swarm/cortex/missions/${encodeURIComponent(id)}`)).mission;
            if(mission?.status==='COMPLETE')break;
            if(['FAILED','BLOCKED','CANCELLED'].includes(mission?.status))throw new Error('R130 mission entered terminal failure: '+JSON.stringify(mission).slice(0,700));
            await post(`/api/swarm/cortex/missions/${encodeURIComponent(id)}/advance`,{batchSize:8});
            await sleep(600);
          }
          if(mission?.status!=='COMPLETE'||mission?.completedCellTasks!==1||mission?.canonicalMutation!==false)throw new Error('R130 live execution contract failed: '+JSON.stringify(mission).slice(0,700));
          const evidence=await get(`/api/swarm/cortex/missions/${encodeURIComponent(id)}/evidence`);
          if(evidence.executionEvidence?.verified!==true||evidence.empiricalBoundary?.r128ExternalValidationCredit!==0)throw new Error('R130 proof/empirical boundary failed');
          const returned=await post(`/api/swarm/cortex/missions/${encodeURIComponent(id)}/rejoin`,{});
          if(returned.authority!=='CORTEX_RECEIPT_RETURNED_NOT_ADMITTED'||returned.canonicalMutation!==false)throw new Error('R130 rejoin authority drifted');
          console.log(`R130 LIVE PASS · ${manifest.hierarchy.cells} available cells · mission ${id} · ${mission.completedTasks}/${mission.totalTaskCount} tasks · external validation credit ${evidence.empiricalBoundary.r128ExternalValidationCredit}`);
          NODE
