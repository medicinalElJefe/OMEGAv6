name: R180 Living World Execution Dispatch
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/execution/livingWorldExecutionDispatchR180.js'
      - 'src/livingWorldExecutionClientR180.ts'
      - 'src/LivingWorldPulseR174.tsx'
      - 'src/livingWorldPulseR174.css'
      - 'tests/r180-living-world-execution-dispatch-invariants.mjs'
      - 'public/omega-r170-self-build-governor.json'
      - 'tests/r170-self-build-governor-invariants.mjs'
      - 'tests/r180-current-authority-convergence-invariants.mjs'
      - '.github/workflows/r170-current-convergence.yml'
      - '.github/workflows/r180-living-world-execution-dispatch.yml'
  push:
    branches: [r180-live-dispatch-current-main]
permissions:
  contents: read
concurrency:
  group: r180-living-world-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prove-r180-living-world-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund
      - name: Prove focused R180 authorization to dispatch bridge
        run: |
          node --check src/execution/livingWorldExecutionDispatchR180.js
          node tests/r180-living-world-execution-dispatch-invariants.mjs
      - name: Preserve R179 through R175 living-world authority chain
        run: |
          node tests/r179-living-world-durable-authorization-invariants.mjs
          node tests/r178-living-world-contract-resolution-invariants.mjs
          node tests/r177-living-world-mission-composer-invariants.mjs
          node tests/r176-living-world-intent-proposal-invariants.mjs
          node tests/r175-multidomain-living-world-truth-invariants.mjs
      - name: Preserve R147 R146 and reflex execution authorities
        run: |
          node tests/r147-unified-executor-fabric-invariants.mjs
          node tests/r146-durable-operation-execution-invariants.mjs
          node tests/r162-governed-reflex-execution-invariants.mjs
          node tests/r161-reflex-mission-durable-handoff-invariants.mjs
      - name: Preserve current self-build and convergence authority
        run: |
          node tests/r170-self-build-governor-invariants.mjs
          node tests/r180-current-authority-convergence-invariants.mjs
          node tests/r176-r164-mobile-containment-invariants.mjs
          node scripts/verify_workflow_topology_r170.mjs
      - name: Preserve federation Hybrid Earth computed-reality and Canon truth gates
        run: |
          node tests/r173-federation-ledger-world-observer-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
      - name: Run full inherited production regression and build
        run: npm run check
      - name: Prove canonical Worker package remains deployable
        run: npx wrangler deploy --dry-run --outdir .wrangler-r180-dry-run
