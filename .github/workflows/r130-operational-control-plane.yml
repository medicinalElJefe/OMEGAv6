name: OMEGA R130 Operational Control Plane

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: omega-r130-control-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r130:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prove R130 organization and control-plane contracts
        run: node tests/r130-operational-control-plane.mjs
      - name: Preserve R129-R127 proof and empirical chain
        run: |
          node --experimental-strip-types tests/r129-empirical-experiment-runtime.mjs
          node --experimental-strip-types tests/r128-empirical-calibration-replay.mjs
          node --experimental-strip-types tests/r127-evidence-execution-proof-fabric.mjs
      - name: Preserve R126 causal and maximum runtime contracts
        run: |
          node --experimental-strip-types tests/r126-causal-interaction-relativity.mjs
          node tests/r126-causal-interaction-invariants.mjs
          node tests/r126-total-maximum-build-invariants.mjs
      - name: Preserve R125-R121 execution and truth boundaries
        run: |
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
          node tests/r124-self-contained-build-invariants.mjs
          node tests/r123-organism-swarm-invariants.mjs
          node tests/r123-living-total-experience-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
          node tests/r121-swarm-runtime-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
      - name: Verify entrypoint syntax and runtime export contract
        run: |
          node --check src/workerR130.js
          grep -q '"main": "src/workerR130.js"' wrangler.jsonc
      - name: Full inherited regression and production build
        run: npm run check
      - name: Worker bundle dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r130-dry-run
