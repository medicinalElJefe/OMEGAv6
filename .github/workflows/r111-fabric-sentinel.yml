name: OMEGA R111 Fabric Sentinel

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloud/fabric-sentinel/**'
      - 'wrangler.fabric-sentinel.jsonc'
      - '.github/workflows/r111-fabric-sentinel.yml'
      - 'src/workerR111.js'
      - 'src/federation/fabricMeshR111.js'
  push:
    branches: [main]
    paths:
      - 'cloud/fabric-sentinel/**'
      - 'wrangler.fabric-sentinel.jsonc'
      - '.github/workflows/r111-fabric-sentinel.yml'
      - 'src/workerR111.js'
      - 'src/federation/fabricMeshR111.js'

permissions:
  contents: read

env:
  SENTINEL_URL: https://omega-fabric-sentinel.jeffdeweyeljefe.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check cloud/fabric-sentinel/src/index.js
      - run: npx wrangler deploy --dry-run --config wrangler.fabric-sentinel.jsonc --outdir .wrangler-r111-sentinel-dry-run

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require production Cloudflare authorization
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::OMEGA_CLOUDFLARE_TOKEN missing'; exit 1; }
      - name: Deploy independent advisory sentinel
        run: npx wrangler deploy --config wrangler.fabric-sentinel.jsonc
      - name: Verify sentinel and current fabric
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.SENTINEL_URL.replace(/\/$/,'');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){let last='';for(let i=1;i<=12;i++){try{const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}}),t=await r.text();if(r.ok){return JSON.parse(t)}last=`HTTP ${r.status}: ${t.slice(0,300)}`}catch(e){last=String(e)}await sleep(5000)}throw new Error(`${path} failed: ${last}`)}
          const health=await get('/health');
          if(health.service!=='omega-fabric-sentinel'||health.authority!=='ADVISORY_ONLY')throw new Error('sentinel authority boundary failed');
          const fabric=await get('/fabric');
          if(fabric.schema!=='OMEGA_FABRIC_SENTINEL_R111'||fabric.canonicalAuthority!=='omega-v6')throw new Error('sentinel fabric contract failed');
          if(!Array.isArray(fabric.authorities)||fabric.authorities.length!==4)throw new Error(`expected four authority observations, got ${fabric.authorities?.length}`);
          console.log(`R111 SENTINEL LIVE PASS · ${base} · authorities ${fabric.authorities.map(x=>`${x.id}:${x.state}`).join(' | ')}`);
          NODE
