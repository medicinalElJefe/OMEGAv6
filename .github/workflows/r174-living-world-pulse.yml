permissions:
  contents: read

jobs:
  prove-r174-living-world-pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Prove R236 source spatial control attestation
        run: node tests/r236-source-spatial-control-attestation-invariants.mjs
      - name: Prove R236 Living World source-attestation wiring
        run: node tests/r236-living-world-source-attestation-invariants.mjs
      - name: Syntax-check R236 source attestation
        run: node --check src/world/sourceSpatialControlAttestationR236.js
      - name: Prove R234 calibration sufficiency envelope
        run: node tests/r234-calibration-sufficiency-envelope-invariants.mjs
      - name: Syntax-check R234 calibration sufficiency
        run: node --check src/world/sourceSpatialCalibrationSufficiencyR234.js
      - name: Prove R232 independent spatial calibration validation
        run: node tests/r232-independent-spatial-calibration-validation-invariants.mjs
      - name: Syntax-check R232 calibration validation
        run: node --check src/world/sourceSpatialCalibrationValidationR232.js
      - name: Prove R230 exact-byte computed frame
        run: node tests/r230-proof-bound-computed-frame-invariants.mjs
      - name: Prove R228 exact-bound source spatial reconstruction
        run: node tests/r228-source-spatial-reconstruction-invariants.mjs
      - name: Prove R228 Living World reconstruction surface and truth boundary
        run: node tests/r228-living-world-source-spatial-reconstruction-invariants.mjs
      - name: Syntax-check R228 numeric source geometry
        run: node --check src/world/sourceSpatialReconstructionR228.js
      - name: Prove R227 source-backed camera/depth evidence binding
        run: node tests/r227-source-spatial-evidence-bundle-invariants.mjs
      - name: Prove R227 visual-first Living World evidence intake
        run: node tests/r227-living-world-spatial-evidence-intake-invariants.mjs
      - name: Prove R226 source-backed spatial reconstruction evidence contract
        run: node tests/r226-spatial-reconstruction-evidence-invariants.mjs
      - name: Prove R225 canonical Living World terrain interaction
        run: node tests/r225-living-world-terrain-surface-invariants.mjs
      - name: Prove R224 operator-invokable Living World source terrain experience
        run: node tests/r224-living-source-terrain-experience-invariants.mjs
      - name: Prove R222 source-backed terrain visual projection
        run: node tests/r222-source-backed-terrain-visual-invariants.mjs
      - name: Prove R221 canonical Worker-mediated elevation runtime bridge
        run: node tests/r221-canonical-elevation-runtime-bridge-invariants.mjs
      - name: Prove R220 bounded USGS elevation evidence acquisition
        run: node tests/r220-bounded-usgs-elevation-acquisition-invariants.mjs
      - name: Prove R219 source-backed elevation scene mesh
        run: node tests/r219-source-backed-elevation-mesh-invariants.mjs
      - name: Prove R218 evidence-bound WGS84 geospatial scene field
        run: node tests/r218-geospatial-scene-field-invariants.mjs
      - name: Prove R217 exact-byte evidence reconstruction frame receipt
        run: node tests/r217-evidence-reconstruction-frame-invariants.mjs
      - name: Prove R216 evidence-bound reconstruction intent
        run: node tests/r216-evidence-reconstruction-intent-invariants.mjs
      - name: Prove R215 byte-hashed representational artifact continuity
        run: node tests/r215-render-artifact-continuity-invariants.mjs
      - name: Prove R214 recoverable render-attempt continuity
        run: node tests/r214-render-attempt-continuity-invariants.mjs
      - name: Prove R213 adaptive render-attempt lineage
        run: node tests/r213-adaptive-render-attempt-lineage-invariants.mjs
      - name: Prove R211 deterministic pre-render lineage receipt
        run: node tests/r211-render-intent-lineage-invariants.mjs
      - name: Prove R208 durable mission-world head binding
        run: node tests/r208-durable-mission-world-head-binding-invariants.mjs
      - name: Prove R206 world mission continuity bridge
        run: node tests/r206-world-mission-continuity-invariants.mjs
      - name: Prove R203 interface and navigation polish
        run: node tests/r203-interface-navigation-polish-invariants.mjs
      - name: Prove focused R174 living-world pulse
        run: node tests/r174-living-world-pulse-invariants.mjs
      - name: Preserve R173 live ledger observer
        run: node tests/r173-federation-ledger-world-observer-invariants.mjs
      - name: Preserve R172 and R171 federation-world truth
        run: |
          node tests/r172-federation-ledger-world-binding-invariants.mjs
          node tests/r171-federation-receipt-world-reconciler-invariants.mjs
      - name: Preserve R114 durable federation closure law
        run: node tests/r114-federation-closure-invariants.mjs
      - name: Preserve living-world continuity authorities
        run: |
          node tests/r140-unified-living-operation-fabric.mjs
          node tests/r136-living-world-frame-invariants.mjs
          node tests/r134-canonical-world-continuity.mjs
          node tests/r149-durable-world-head-continuity-invariants.mjs
      - name: Preserve Hybrid, Earth and computed-reality truth gates
        run: |
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
      - name: Preserve R125 admission authority
        run: node tests/r125-accuracy-engine-invariants.mjs
      - name: Syntax-check R174 projection
        run: node --check src/world/livingWorldPulseR174.js
      - name: Run inherited regression and production build
        run: npm run check
      - name: Prove canonical Worker package remains deployable
        run: npx wrangler deploy --dry-run --outdir .wrangler-r174-dry-run
