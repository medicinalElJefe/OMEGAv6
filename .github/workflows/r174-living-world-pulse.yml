name: R174 Living World Pulse Surface

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/world/livingWorldPulseR174.js'
      - 'src/LivingWorldPulseR174.tsx'
      - 'src/livingWorldPulseR174.css'
      - 'src/interfacePolishR203.css'
      - 'src/MissionWorldContinuityR206.tsx'
      - 'src/missionWorldContinuityR206.css'
      - 'src/world/missionWorldHeadBindingR208.ts'
      - 'src/world/renderIntentLineageR211.js'
      - 'src/world/adaptiveRenderAttemptR213.js'
      - 'src/world/renderAttemptContinuityR214.js'
      - 'src/OmegaGovernanceProjectMediaR29.tsx'
      - 'src/world/operationWorldBridgeR140.ts'
      - 'src/omegaOperationBusR86.ts'
      - 'src/HybridMissionControl.tsx'
      - 'src/App.tsx'
      - 'tests/r174-living-world-pulse-invariants.mjs'
      - 'tests/r203-interface-navigation-polish-invariants.mjs'
      - 'tests/r206-world-mission-continuity-invariants.mjs'
      - 'tests/r208-durable-mission-world-head-binding-invariants.mjs'
      - 'tests/r211-render-intent-lineage-invariants.mjs'
      - 'tests/r213-adaptive-render-attempt-lineage-invariants.mjs'
      - 'tests/r214-render-attempt-continuity-invariants.mjs'
      - 'tests/r215-render-artifact-continuity-invariants.mjs'
      - '.github/workflows/r174-living-world-pulse.yml'
  push:
    branches: [r174-living-world-pulse-surface]

permissions:
  contents: read

jobs:
  prove-r174-living-world-pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove R215 byte-hashed representational artifact continuity
        run: node tests/r215-render-artifact-continuity-invariants.mjs
      - name: Prove R214 recoverable render-attempt continuity
        run: node tests/r214-render-attempt-continuity-invariants.mjs
      - name: Prove R213 adaptive render-attempt lineage
        run: node tests/r213-adaptive-render-attempt-lineage-invariants.mjs
      - name: Prove R211 deterministic pre-render lineage receipt
        run: node tests/r211-render-intent-lineage-invariants.mjs
      - name: Prove R208 durable mission-world head binding
        run: node tests/r208-durable-mission-world-head-binding-invariants.mjs
      - name: Prove R206 world mission continuity bridge
        run: node tests/r206-world-mission-continuity-invariants.mjs
      - name: Prove R203 interface and navigation polish
        run: node tests/r203-interface-navigation-polish-invariants.mjs
      - name: Prove focused R174 living-world pulse
        run: node tests/r174-living-world-pulse-invariants.mjs
      - name: Preserve R173 live ledger observer
        run: node tests/r173-federation-ledger-world-observer-invariants.mjs
      - name: Preserve R172 and R171 federation-world truth
        run: |
          node tests/r172-federation-ledger-world-binding-invariants.mjs
          node tests/r171-federation-receipt-world-reconciler-invariants.mjs
      - name: Preserve R114 durable federation closure law
        run: node tests/r114-federation-closure-invariants.mjs
      - name: Preserve living-world continuity authorities
        run: |
          node tests/r140-unified-living-operation-fabric.mjs
          node tests/r136-living-world-frame-invariants.mjs
          node tests/r134-canonical-world-continuity.mjs
          node tests/r149-durable-world-head-continuity-invariants.mjs
      - name: Preserve Hybrid, Earth and computed-reality truth gates
        run: |
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
      - name: Preserve R125 admission authority
        run: node tests/r125-accuracy-engine-invariants.mjs
      - name: Syntax-check R174 projection
        run: node --check src/world/livingWorldPulseR174.js
      - name: Run inherited regression and production build
        run: npm run check
      - name: Prove canonical Worker package remains deployable
        run: npx wrangler deploy --dry-run --outdir .wrangler-r174-dry-run
