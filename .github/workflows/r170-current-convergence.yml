          echo 'R147 remains dispatch authority; R146 remains durable lifecycle and execution-history authority; R141 remains exact-return proof authority; R125 remains sole CanonState admission authority.'
          echo 'R175 world truth → R176 intent → R177 mission → R178 contract → R179 authorization → R180 dispatch → R182/R186 verified-return continuity remains proved.'
          echo 'Hybrid/Build native execution, trained weights, factual truth, Earth truth, federation closure, solver validity, deployment and computed-photoreal reality remain separately proof-gated.'
          echo 'R170.3 remains low-cost OBSERVE/PROPOSE control; canonical deployment remains exclusively governed by ci.yml two-parent merge law.'