name: R170 Current Convergence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 9 * * *'

permissions:
  contents: read

concurrency:
  group: omega-r170-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-current-authority-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund
      - name: Prove focused R196.2 living-world intelligence proof projection
        run: |
          node --check src/world/livingWorldIntelligenceProofR196.js
          node tests/r196-living-world-intelligence-proof-invariants.mjs
      - name: Prove focused R182 verified-return world reconciliation
        run: |
          node --check src/world/verifiedExecutionWorldReconcilerR182.js
          node tests/r182-verified-execution-world-reconciliation-invariants.mjs
      - name: Prove R182-R190 visual, interference, reconstruction, differential, calibration and global-analysis chain
        run: |
          node tests/r182-visual-coherence-restoration-invariants.mjs
          node tests/r183-visual-atlas-invariants.mjs
          node tests/r184-r185-interference-reconstruction-invariants.mjs
          node tests/r186-differential-relativity-invariants.mjs
          node tests/r187-chained-formula-calibration-invariants.mjs
          node tests/r188-r190-global-analysis-convergence-invariants.mjs
      - name: Prove current R185 performance and R186 verified-return ingress authority
        run: |
          node tests/r185-temporal-relativity-performance-invariants.mjs
          node tests/r186-verified-return-live-world-ingress-invariants.mjs
      - name: Prove R180 current-authority convergence contract
        run: node tests/r180-current-authority-convergence-invariants.mjs
      - name: Prove bounded active workflow topology and R170.3 self-build governance
        run: |
          node scripts/verify_workflow_topology_r170.mjs
          node tests/r170-self-build-governor-invariants.mjs
      - name: Prove current R180 living-world execution chain
        run: |
          node tests/r180-living-world-execution-dispatch-invariants.mjs
          node tests/r179-living-world-durable-authorization-invariants.mjs
          node tests/r178-living-world-contract-resolution-invariants.mjs
          node tests/r177-living-world-mission-composer-invariants.mjs
          node tests/r176-living-world-intent-proposal-invariants.mjs
          node tests/r176-r164-mobile-containment-invariants.mjs
          node tests/r175-multidomain-living-world-truth-invariants.mjs
          node tests/r174-living-world-pulse-invariants.mjs
          node tests/r173-federation-ledger-world-observer-invariants.mjs
          node tests/r172-federation-ledger-world-binding-invariants.mjs
          node tests/r171-federation-receipt-world-reconciler-invariants.mjs
          node tests/r140-unified-living-operation-fabric.mjs
          node tests/r136-living-world-frame-invariants.mjs
          node tests/r134-canonical-world-continuity.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
      - name: Prove current read-only successor workflow chain dynamically
        run: node scripts/prove_successor_workflow_invariants_r175.mjs
      - name: Prove federation and Genesis attestation foundations
        run: |
          node tests/r169-federation-attestation-world-lens-invariants.mjs
          node tests/r168-genesis-r192-attestation-invariants.mjs
      - name: Preserve active Optical R153.2 convergence
        run: |
          node tests/r167-active-optical-r1532-convergence-invariants.mjs
          node tests/r1532-adaptive-external-search-invariants.mjs
          node tests/r1531-external-ai-tool-push-invariants.mjs
          node tests/r152-optical-operational-convergence-invariants.mjs
