name: OMEGA R139 Unified Capability Engine
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-r139:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prove unified mode, menu, capability and lifecycle runtime
        run: node --experimental-strip-types tests/r139-unified-capability-engine-invariants.mjs
      - name: Preserve capability-first visuals and live family proof
        run: |
          node tests/r138-capability-first-visual-runtime.mjs
          node tests/r137-live-family-proof-fusion-invariants.mjs
      - name: Preserve living world, continuity and Hybrid truth
        run: |
          node tests/r136-living-world-frame-invariants.mjs
          node tests/r134-canonical-world-continuity.mjs
          node tests/r134-woven-relativity-continuum-invariants.mjs
          node tests/r132-hybrid-execution-plane-invariants.mjs
          node tests/r127-hybrid-zero-drift-invariants.mjs
      - name: Preserve swarm, accuracy and self-build authority
        run: |
          node tests/r126-total-maximum-build-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
          node tests/r124-self-contained-build-invariants.mjs
          node tests/r123-organism-swarm-invariants.mjs
          node tests/r121-swarm-runtime-invariants.mjs
          node tests/enacted-runtime-r32-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Cloudflare Worker dry run with declarative DO exports
        run: npx wrangler deploy --dry-run --outdir .wrangler-r139-dry-run
