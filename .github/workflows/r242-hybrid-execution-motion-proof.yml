name: OMEGA R242 Hybrid Execution Motion Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/workerR101.js'
      - 'src/workerR102.js'
      - 'src/execution/adaptiveSovereignMissionR152.js'
      - 'public/omega-hybrid-agent-r141.py'
      - 'src/HybridExecutionMotionR242.tsx'
      - 'src/hybridExecutionMotionR242.css'
      - 'src/HybridLinkR32.tsx'
      - 'tests/r242-hybrid-execution-motion-invariants.mjs'
      - 'tests/r242-hybrid-terminal-fence-invariants.mjs'
      - 'tests/r242-hybrid-execution-motion-browser-e2e.mjs'
      - '.github/workflows/r242-hybrid-execution-motion-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Compile R242 host wrapper
        run: python -m py_compile public/omega-hybrid-agent-r141.py
      - name: Prove execution motion and fail-closed stall recovery
        run: |
          node tests/r242-hybrid-execution-motion-invariants.mjs
          node tests/r242-hybrid-terminal-fence-invariants.mjs
      - name: Preserve adaptive mission progression
        run: node tests/r153-adaptive-sovereign-build-missions-invariants.mjs
      - name: Preserve Hybrid command and host-proof authorities
        run: |
          node tests/r237-hybrid-command-authority-invariants.mjs
          node tests/r238-hybrid-host-intelligence-invariants.mjs
      - name: Full inherited application verification
        run: npm run check
      - name: Worker package dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r242-dry-run

  built-browser-motion-proof:
    needs: source-runtime-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Start exact built preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/r242-vite.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/r242-vite.log; exit 1; fi
      - name: Prove exact selected-host running motion in built UI
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r242-hybrid-execution-motion-browser-e2e.mjs
