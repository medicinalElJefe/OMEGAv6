name: OMEGA R237 Hybrid Command Authority Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install exact locked graph
        run: npm install
      - name: Audit locked application dependency tree
        run: npm audit --audit-level=high
      - name: Prove R237 Hybrid command authority
        run: node tests/r237-hybrid-command-authority-invariants.mjs
      - name: Run full inherited regression and production build
        run: npm run check
      - name: Prove Worker package without deployment
        run: npx wrangler deploy --dry-run --outdir .wrangler-r237-dry-run
      - name: Prove canonical OMEGA production remains single-writer
        shell: bash
        run: |
          matches="$(
            grep -R --line-number --include='*.yml' --include='*.yaml' -E 'wrangler[[:space:]]+deploy([[:space:]]|$)' .github/workflows \
              | grep -v -- '--dry-run' \
              | grep -v '/ci.yml:' \
              | grep -v -E '/r223-cloudflare-evolution.yml:.*--config[[:space:]]+wrangler\.evolution-machine-r223\.jsonc([[:space:]]|$)' \
              || true
          )"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo '::error title=DEPLOY AUTHORITY REGRESSION::Unexpected production Wrangler writer discovered outside canonical ci.yml or the separately named R223 ancillary evolution-machine config.'
            exit 1
          fi
          grep -q "Deploy canonical OMEGA Worker" .github/workflows/ci.yml
          grep -q "npx wrangler deploy" .github/workflows/ci.yml
          grep -q "wrangler.evolution-machine-r223.jsonc" .github/workflows/r223-cloudflare-evolution.yml
          echo 'R237 production authority PASS · ci.yml owns canonical omegav6 deployment; R223 remains a separately configured ancillary evolution Worker; dry-runs are non-mutating.'

  local-browser-proof:
    needs: source-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Prove R237 command deck in built browser surface
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/r237-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/r237-vite.log; exit 1; fi
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          let hybridStatus={state:'DEVICE_PROOF_REQUIRED',nativeExecutionClaimed:false,devices:[],jobs:[]};
          let missionStatus={ok:true,missions:[],state:'DEVICE_PROOF_REQUIRED'};
          await page.route('**/api/hybrid/status',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(hybridStatus)}));
          await page.route('**/api/missions',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(missionStatus)}));
          const openHybrid=async()=>{
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.locator('.r132-inspector-tabs').getByRole('button',{name:'TOOLS',exact:true}).click();
            const hybridEntry=page.locator('.r96-quick-card button').filter({hasText:'Hybrid'}).first();
            await hybridEntry.waitFor({state:'visible'});
            await hybridEntry.click();
            const deck=page.locator('[data-r237-command-authority="AUTHENTICATED_BOUNDED_NATIVE_CONTROL"]');
            await deck.waitFor({state:'visible'});
            return deck;
          };

          let deck=await openHybrid();
          let text=await deck.innerText();
          for(const token of ['DEVICE PROOF REQUIRED','ROOT-CONFINED','PROVE_HOST','VERIFY_PROJECT','PACKAGE_VERIFIED','TRAIN_LOCAL_INDEX','R141/R146/R147/R125 authority remains unchanged','intentionally contain no APPLY_PATCH or WRITE_TEXT']){
            if(!text.includes(token)) throw new Error(`R237 built browser missing ${token}`);
          }
          const runButtons=deck.getByRole('button',{name:/Run on this PC|Device busy/});
          const count=await runButtons.count();
          if(count!==4)throw new Error(`R237 expected four bounded native presets, saw ${count}`);
          for(let i=0;i<count;i++)if(!(await runButtons.nth(i).isDisabled()))throw new Error('R237 allowed native queueing without current device proof');

          const caps=['DESKTOP_HEALTH','HASH_TREE','FORENSIC_HASH_LEDGER','INDEX','BUILD','TEST','PACKAGE','TRAIN_LOCAL'];
          hybridStatus={
            state:'VERIFIED_DEVICE_ONLINE',nativeExecutionClaimed:true,
            devices:[
              {id:'dev-a',name:'OMEGA PC A',online:true,revoked:false,lastSeen:Date.now(),rootLabel:'J:/OMEGA-A',capabilities:caps},
              {id:'dev-b',name:'OMEGA PC B',online:true,revoked:false,lastSeen:Date.now(),rootLabel:'J:/OMEGA-B',capabilities:caps}
            ],
            jobs:[
              {id:'job_a',targetDeviceId:'dev-a',status:'QUEUED',steps:[{id:'S01',op:'HASH_TREE'}]},
              {id:'job_b',targetDeviceId:'dev-b',status:'QUEUED',steps:[{id:'S01',op:'BUILD'}]}
            ]
          };
          missionStatus={ok:true,state:'VERIFIED_DEVICE_ONLINE',missions:[
            {id:'mission_a',targetDeviceId:'dev-a',status:'ACTIVE',cycle:2,maxCycles:12,currentJobId:'job_a'},
            {id:'mission_b',targetDeviceId:'dev-b',status:'ACTIVE',cycle:4,maxCycles:12,currentJobId:'job_b'}
          ]};
          deck=await openHybrid();
          const hostSelect=deck.getByRole('combobox',{name:'Authenticated compute host'});
          if(await hostSelect.count()!==1)throw new Error('R237 multi-host selector missing');
          await hostSelect.selectOption('dev-b');
          await page.waitForFunction(()=>document.querySelector('[data-r237-command-authority]')?.getAttribute('data-r237-selected-device')==='dev-b');
          deck=page.locator('[data-r237-command-authority="AUTHENTICATED_BOUNDED_NATIVE_CONTROL"]');
          if(await deck.getAttribute('data-r237-correlation')!=='LOCKED')throw new Error('R237 did not lock execution correlation after selecting dev-b');
          const job=deck.locator('[data-r237-job-device]');
          const mission=deck.locator('[data-r237-mission-device]');
          if(await job.getAttribute('data-r237-job-device')!=='dev-b')throw new Error('R237 selected host displayed another device job');
          if(await mission.getAttribute('data-r237-mission-device')!=='dev-b')throw new Error('R237 selected host displayed another device mission');
          text=await deck.innerText();
          for(const token of ['OMEGA PC B','job_b','mission_b','HOST / JOB / MISSION LOCKED'])if(!text.includes(token))throw new Error(`R237 correlated browser surface missing ${token}`);
          for(const forbidden of ['job_a','mission_a'])if(text.includes(forbidden))throw new Error(`R237 leaked unrelated active execution context ${forbidden} into selected host controls`);
          if(pageErrors.length)throw new Error(`R237 built browser page errors: ${pageErrors.join(' | ')}`);
          console.log('R237 BUILT BROWSER PASS · real Home→TOOLS→Hybrid navigation · no-device fail-closed proof · four bounded presets · explicit two-host selector · selected host/job/mission identity correlation · unrelated mission isolation · source-mutation prohibition visibly stated');
          await browser.close();
          NODE
