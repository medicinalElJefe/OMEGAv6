name: OMEGA R237 Hybrid Command Authority Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install exact locked graph
        run: npm install
      - name: Audit locked application dependency tree
        run: npm audit --audit-level=high
      - name: Prove R237 command authority and R238 shared snapshot
        run: |
          node tests/r237-hybrid-command-authority-invariants.mjs
          node tests/r238-hybrid-correlated-snapshot-invariants.mjs
      - name: Prove R243 execution motion, lease recovery and terminal return fence
        run: |
          node tests/r243-hybrid-execution-motion-invariants.mjs
          node tests/r243-hybrid-terminal-fence-invariants.mjs
      - name: Run full inherited regression and production build
        run: npm run check
      - name: Prove Worker package without deployment
        run: npx wrangler deploy --dry-run --outdir .wrangler-r237-dry-run
      - name: Prove canonical OMEGA production remains single-writer
        shell: bash
        run: |
          matches="$(
            grep -R --line-number --include='*.yml' --include='*.yaml' -E 'wrangler[[:space:]]+deploy([[:space:]]|$)' .github/workflows \
              | grep -v -- '--dry-run' \
              | grep -v '/ci.yml:' \
              | grep -v -E '/r223-cloudflare-evolution.yml:.*--config[[:space:]]+wrangler\.evolution-machine-r223\.jsonc([[:space:]]|$)' \
              || true
          )"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo '::error title=DEPLOY AUTHORITY REGRESSION::Unexpected production Wrangler writer discovered outside canonical ci.yml or the separately named R223 ancillary evolution-machine config.'
            exit 1
          fi
          grep -q "Deploy canonical OMEGA Worker" .github/workflows/ci.yml
          grep -q "npx wrangler deploy" .github/workflows/ci.yml
          grep -q "wrangler.evolution-machine-r223.jsonc" .github/workflows/r223-cloudflare-evolution.yml
          node scripts/verify_workflow_topology_r170.mjs
          echo 'R243 authority PASS · existing R237 read-only successor workflow carries R238/R239 and R243 execution-motion proof without adding pre-merge production authority.'

  local-browser-proof:
    needs: source-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Prove R237 command + R238 shared epoch + R239 resource hold + R243 motion in built browser surface
        shell: bash
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/r238-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/r238-vite.log; exit 1; fi
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          let hybridStatus={state:'DEVICE_PROOF_REQUIRED',nativeExecutionClaimed:false,devices:[],jobs:[]};
          let missionStatus={ok:true,missions:[],state:'DEVICE_PROOF_REQUIRED'};
          await page.route('**/api/hybrid/status',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(hybridStatus)}));
          await page.route('**/api/missions',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(missionStatus)}));
          const openHybrid=async()=>{
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.locator('.r132-inspector-tabs').getByRole('button',{name:'TOOLS',exact:true}).click();
            const entry=page.locator('.r96-quick-card button').filter({hasText:'Hybrid'}).first();
            await entry.waitFor({state:'visible'}); await entry.click();
            const deck=page.locator('[data-r237-command-authority="AUTHENTICATED_BOUNDED_NATIVE_CONTROL"]');
            const effects=page.locator('[data-r212-host-effects="FIRST_HAND_RETURN_ONLY"]');
            await Promise.all([deck.waitFor({state:'visible'}),effects.waitFor({state:'visible'})]);
            return {deck,effects};
          };

          let {deck}=await openHybrid();
          let text=await deck.innerText();
          for(const token of ['DEVICE PROOF REQUIRED','ROOT-CONFINED','PROVE_HOST','VERIFY_PROJECT','PACKAGE_VERIFIED','TRAIN_LOCAL_INDEX','R125','intentionally contain no APPLY_PATCH or WRITE_TEXT'])if(!text.includes(token))throw new Error(`R237/R238/R239 built browser missing ${token}`);
          const runButtons=deck.getByRole('button',{name:/Run on this PC|Device busy|Resource held/});
          if(await runButtons.count()!==4)throw new Error('R237/R239 expected four bounded native preset controls');
          for(let i=0;i<4;i++)if(!(await runButtons.nth(i).isDisabled()))throw new Error('R237/R239 allowed queueing without current device proof');

          const now=Date.now();
          const caps=['DESKTOP_HEALTH','HASH_TREE','FORENSIC_HASH_LEDGER','INDEX','BUILD','TEST','PACKAGE','TRAIN_LOCAL'];
          hybridStatus={state:'VERIFIED_DEVICE_ONLINE',nativeExecutionClaimed:true,devices:[
            {id:'dev-a',name:'OMEGA PC A',online:true,revoked:false,lastSeen:now,rootLabel:'J:/OMEGA-A',capabilities:caps},
            {id:'dev-b',name:'OMEGA PC B',online:true,revoked:false,lastSeen:now,rootLabel:'J:/OMEGA-B',capabilities:caps}
          ],jobs:[
            {id:'job_a',targetDeviceId:'dev-a',status:'QUEUED',steps:[{id:'S01',op:'HASH_TREE'}]},
            {id:'job_b',targetDeviceId:'dev-b',status:'QUEUED',steps:[{id:'S01',op:'BUILD'}]},
            {id:'ret_a',targetDeviceId:'dev-a',status:'COMPLETE',completedAt:now-5000,returnPacket:{receivedAt:now-5000,resultFingerprint:'fp-a',stepProofs:[{id:'S01',op:'BUILD',ok:true,result:{exitCode:0}}]}},
            {id:'ret_b',targetDeviceId:'dev-b',status:'COMPLETE',completedAt:now-4000,returnPacket:{receivedAt:now-4000,resultFingerprint:'fp-b',stepProofs:[{id:'S01',op:'TEST',ok:true,result:{exitCode:0}}]}}
          ]};
          missionStatus={ok:true,state:'VERIFIED_DEVICE_ONLINE',missions:[
            {id:'mission_a',targetDeviceId:'dev-a',status:'ACTIVE',cycle:2,maxCycles:12,currentJobId:'job_a'},
            {id:'mission_b',targetDeviceId:'dev-b',status:'ACTIVE',cycle:4,maxCycles:12,currentJobId:'job_b'}
          ]};
          let opened=await openHybrid(); deck=opened.deck; const effects=opened.effects;
          const select=deck.getByRole('combobox',{name:'Authenticated compute host'});
          if(await select.count()!==1)throw new Error('R237 multi-host selector missing');
          await select.selectOption('dev-b');
          await page.waitForFunction(()=>document.querySelector('[data-r212-host-effects]')?.getAttribute('data-r212-selected-device')==='dev-b'&&document.querySelector('[data-r237-command-authority]')?.getAttribute('data-r237-selected-device')==='dev-b');
          const e212=await effects.getAttribute('data-r212-snapshot-epoch');
          const e237=await deck.getAttribute('data-r237-snapshot-epoch');
          if(!e212||e212!==e237)throw new Error(`R238 shared snapshot epoch diverged: R212=${e212}, R237=${e237}`);
          if(await deck.getAttribute('data-r237-correlation')!=='LOCKED')throw new Error('R237/R238 execution correlation not locked');
          if(await deck.locator('[data-r237-job-device]').getAttribute('data-r237-job-device')!=='dev-b')throw new Error('selected host displayed another device job');
          if(await deck.locator('[data-r237-mission-device]').getAttribute('data-r237-mission-device')!=='dev-b')throw new Error('selected host displayed another device mission');
          const deckText=await deck.innerText(),effectsText=await effects.innerText();
          for(const token of ['OMEGA PC B','job_b','mission_b','HOST / JOB / MISSION / EPOCH LOCKED'])if(!deckText.includes(token))throw new Error(`R237/R238 command surface missing ${token}`);
          if(!effectsText.includes('fp-b'))throw new Error('R212 did not expose selected-host return fingerprint');
          for(const forbidden of ['job_a','mission_a','fp-a'])if(deckText.includes(forbidden)||effectsText.includes(forbidden))throw new Error(`R238 leaked foreign-host context ${forbidden}`);
          if(pageErrors.length)throw new Error(`built browser page errors: ${pageErrors.join(' | ')}`);
          console.log(`R239 BUILT BROWSER PASS · real Home→TOOLS→Hybrid · resource-held controls counted · two hosts · selected dev-b shared by R212/R237 · shared epoch ${e237} · foreign host isolated · R237 command gates retained`);
          await browser.close();
          NODE
          OMEGA_E2E_URL=http://127.0.0.1:4173 node tests/r243-hybrid-execution-motion-browser-e2e.mjs
