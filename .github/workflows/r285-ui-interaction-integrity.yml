name: OMEGA R285 UI Interaction Integrity

on:
  push:
    branches:
      - r285-ui-interaction-integrity
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  interface-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: R285 current interaction invariant
        run: node tests/r285-ui-interaction-integrity-invariants.mjs

      - name: Preserve full inherited OMEGA invariant and build gate
        run: npm run check

      - name: Install Chromium browser proof dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start exact candidate preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/r285-preview.log 2>&1 &
          echo $! > /tmp/r285-preview.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r285-preview.log
          exit 1

      - name: Exercise all 44 canonical surfaces on desktop and mobile
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r285-all-surface-browser-e2e.mjs

      - name: Preview log on failure
        if: failure()
        run: cat /tmp/r285-preview.log || true

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/r285-preview.pid ]; then kill "$(cat /tmp/r285-preview.pid)" || true; fi
