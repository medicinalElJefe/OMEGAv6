name: OMEGA R146 Preservation Interface Convergence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r146-preservation-interface-convergence]

permissions:
  contents: read

concurrency:
  group: omega-r146-preservation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r146:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove preservation-first interface laws
        run: node tests/r146-preservation-interface-convergence-invariants.mjs
      - name: Preserve advanced computation and execution authorities
        shell: bash
        run: |
          node --check src/computation/adaptiveComputationCampaignR145.js
          node tests/r145-advanced-computation-fabric-invariants.mjs
          node tests/r145-runtime-attestation-world-scar-invariants.mjs
          node tests/r144-runtime-deployment-attestation-invariants.mjs
          node tests/r143-authoritative-ui-operation-chain-invariants.mjs
          node tests/r142-proof-aware-capability-lifecycle-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
      - name: Preserve navigation, surface and actionable-control layers
        shell: bash
        run: |
          node tests/r88-global-side-navigator-invariants.mjs
          node tests/r81-surface-integrity-invariants.mjs
          node tests/r94-hybrid-navigation-invariants.mjs
          node scripts/r67-product-reset-invariant.mjs
          node scripts/actionable-controls-invariants.mjs
      - name: Full static regression and production build
        run: npm run check
      - name: Canonical Worker dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r146-canonical
      - name: Optical machine dry-run
        run: npx wrangler deploy --config wrangler.optical-machine-r115.jsonc --dry-run --outdir .wrangler-r146-optical
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production build locally
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/omega-r146-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-r146-preview.log
          exit 1
      - name: Re-run all 44 registered destinations on desktop and mobile
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r118-browser-operational-e2e.mjs
      - name: Prove R146 menus, search, shortcuts, touch and route controls
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r146-navigation-controls-e2e.mjs
      - name: Re-prove R145 advanced computation on desktop and mobile
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r145-browser-computation-e2e.mjs
      - name: Browser diagnostics on failure
        if: failure()
        run: cat /tmp/omega-r146-preview.log || true
