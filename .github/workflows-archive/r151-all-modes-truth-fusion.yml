name: OMEGA R151 All Modes Truth Fusion

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r151-all-modes-truth-fusion]

permissions:
  contents: read

concurrency:
  group: omega-r151-all-modes-fusion-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r151:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove R151 provenance and authority invariants
        run: node tests/r151-all-modes-truth-fusion-invariants.mjs
      - name: Execute full 20,736 × 241 canonical all-modes census
        run: npx --yes tsx scripts/r151-full-atlas-scan.ts
      - name: Preserve admitted operation capability and mode boundaries
        shell: bash
        run: |
          node tests/r140-unified-living-operation-fabric.mjs
          node tests/r140-mode-completion-fabric-invariants.mjs
          node tests/r139-unified-capability-engine-invariants.mjs
          node tests/all-modes-authority-r12-invariants.mjs
          node tests/capability-truth-r23-invariants.mjs
      - name: Preserve durable execution executor Hybrid swarm and admission boundaries
        shell: bash
        run: |
          node tests/r147-unified-executor-fabric-invariants.mjs
          node tests/r146-durable-operation-execution-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Canonical Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r151-dry-run
