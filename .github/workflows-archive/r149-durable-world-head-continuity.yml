name: OMEGA R149 Durable World Head Continuity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r149-durable-world-head-continuity]

permissions:
  contents: read

concurrency:
  group: omega-r149-durable-world-head-continuity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r149:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove R149 durable world-head continuity
        run: node tests/r149-durable-world-head-continuity-invariants.mjs
      - name: Preserve durable execution and executor authority
        shell: bash
        run: |
          node tests/r147-unified-executor-fabric-invariants.mjs
          node tests/r146-durable-operation-execution-invariants.mjs
      - name: Preserve attestation, world, Hybrid and admission truth boundaries
        shell: bash
        run: |
          node tests/r145-runtime-attestation-world-scar-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r140-living-world-operation-bridge-invariants.mjs
          node tests/r136-living-world-frame-invariants.mjs
          node tests/r134-canonical-world-continuity.mjs
          node tests/r125-accuracy-engine-invariants.mjs
      - name: Preserve archive donor governance and Earth/computed-reality boundaries
        shell: bash
        run: |
          node tests/archive-governance-invariants.mjs
          node tests/appdeploy-b023-b037-correlation-invariants.mjs
          node tests/r121-spherical-earth-connector-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Prove packaged source binds the exact workflow SHA
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='dist/omega-build-receipt.json';
          if(!fs.existsSync(p))throw new Error('dist build receipt missing');
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r?.source?.sha!==process.env.GITHUB_SHA)throw new Error(`packaged source ${r?.source?.sha||'NONE'} != workflow ${process.env.GITHUB_SHA}`);
          if(r?.schema!=='OMEGA_GOVERNED_BUILD_RECEIPT_V1'||!String(r?.receiptSha256||'').match(/^[a-f0-9]{64}$/))throw new Error('governed build receipt binding invalid');
          console.log(`R149 packaged source bound to ${process.env.GITHUB_SHA} · ${r.receiptSha256}`);
          NODE
      - name: Canonical Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r149-dry-run
