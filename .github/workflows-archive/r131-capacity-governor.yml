name: OMEGA R131 Capacity Governor

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: omega-r131-capacity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r131:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove bounded maximum-capacity semantics
        run: |
          node tests/r131-capacity-governor.mjs
          node scripts/r131-capacity-plan.mjs --manifest > /tmp/r131-manifest.json
          node scripts/r131-capacity-plan.mjs --cells 1728 --allow-full-body --latency BATCH > /tmp/r131-plan.json
          node -e "const x=require('/tmp/r131-plan.json'); if(x.admittedCells!==1728||x.logicalLanes!==20736||x.canonicalMutation!==false) process.exit(1)"
      - name: Preserve R130-R127 organization and proof chain
        run: |
          node tests/r130-operational-control-plane.mjs
          node --experimental-strip-types tests/r129-empirical-experiment-runtime.mjs
          node --experimental-strip-types tests/r128-empirical-calibration-replay.mjs
          node --experimental-strip-types tests/r127-evidence-execution-proof-fabric.mjs
      - name: Preserve R126-R121 execution and authority boundaries
        run: |
          node --experimental-strip-types tests/r126-causal-interaction-relativity.mjs
          node tests/r126-total-maximum-build-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
          node tests/r124-self-contained-build-invariants.mjs
          node tests/r123-organism-swarm-invariants.mjs
          node tests/r122-computed-reality-invariants.mjs
          node tests/r121-swarm-runtime-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Worker bundle dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r131-dry-run
