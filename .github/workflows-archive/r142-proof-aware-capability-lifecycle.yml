name: OMEGA R142 Proof Aware Capability Lifecycle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r142-proof-aware-capability-lifecycle]

permissions:
  contents: read

concurrency:
  group: omega-r142-capability-lifecycle-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r142:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove R142 route plugin and Hybrid execution lifecycle
        run: node tests/r142-proof-aware-capability-lifecycle-invariants.mjs
      - name: Preserve R141 exact Hybrid proof scar replay authority
        run: node tests/r141-hybrid-proof-scar-replay-invariants.mjs
      - name: Preserve R140 operation and mode fabrics plus R139 capability engine
        shell: bash
        run: |
          node tests/r140-unified-living-operation-fabric.mjs
          node tests/r140-living-world-operation-bridge-invariants.mjs
          node tests/r140-mode-completion-fabric-invariants.mjs
          node tests/r139-unified-capability-engine-invariants.mjs
          node tests/r138-capability-first-visual-runtime.mjs
      - name: Preserve Hybrid execution root safety and canonical admission
        shell: bash
        run: |
          node tests/r132-hybrid-execution-plane-invariants.mjs
          node tests/r127-hybrid-zero-drift-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
          node tests/r124-self-contained-build-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Install Chromium for operational route proof
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start built application locally
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/omega-r142-preview.log 2>&1 &
          echo $! >/tmp/omega-r142-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-r142-preview.log
          exit 1
      - name: Exercise all registered routes in desktop and mobile browsers
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r118-browser-operational-e2e.mjs
      - name: Browser diagnostics on failure
        if: failure()
        run: cat /tmp/omega-r142-preview.log || true
      - name: Canonical Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r142-dry-run
