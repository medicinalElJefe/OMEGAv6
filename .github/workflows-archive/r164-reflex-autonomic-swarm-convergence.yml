name: OMEGA R164 Reflex Autonomic Swarm Convergence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r164-reflex-autonomic-swarm-convergence]

jobs:
  prove-r164:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMEGA_E2E_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm install --no-fund
      - name: Reject high-severity dependency regressions
        run: npm audit --audit-level=high
      - name: Prove R164 returned-reflex autonomic convergence
        run: node tests/r164-reflex-autonomic-swarm-convergence-invariants.mjs
      - name: Preserve R163 through R159 governed execution chain
        run: |
          node tests/r163-canonical-core-health-truth-invariants.mjs
          node tests/r162-governed-reflex-execution-invariants.mjs
          node tests/r161-reflex-mission-durable-handoff-invariants.mjs
          node tests/r160-reflex-operation-ingress-invariants.mjs
          node tests/r159-sovereign-execution-convergence-invariants.mjs
      - name: Preserve R125 swarm, R146 history, R147 dispatch and R141 proof
        run: |
          node tests/r125-autonomic-swarm-invariants.mjs
          node tests/r126-total-maximum-build-invariants.mjs
          node tests/r146-durable-operation-execution-invariants.mjs
          node tests/r147-unified-executor-fabric-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Canonical Worker dry run from preserved R116 entrypoint
        run: npx wrangler deploy --dry-run --outdir .wrangler-r164
      - name: Install Chromium for R164 desktop/mobile proof
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact production build locally
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/omega-r164-preview.log 2>&1 &
          echo $! >/tmp/omega-r164-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-r164-preview.log
          exit 1
      - name: Exercise R164 returned-reflex swarm convergence on desktop and mobile
        run: node tests/r164-reflex-autonomic-browser-e2e.mjs
      - name: Browser diagnostics on failure
        if: failure()
        run: cat /tmp/omega-r164-preview.log || true
