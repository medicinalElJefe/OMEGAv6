name: OMEGA R39 Full PB Ledger
on:
  push:
    branches: [r39-full-12-state-pb-ledger]
  pull_request:
    branches: [main]
jobs:
  full-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip numpy grcwa
      - name: Build convergence-qualified canonical primitive
        run: |
          cat > /tmp/r39.json <<'JSON'
          {"schema":"OMEGA_FULLWAVE_QUEUE_v1","solver":"rcwa","job_id":"ci_r39","source_packet_id":"ci_r39_primitive","geometry":{"pitch_nm":330,"width_nm":90,"length_nm":260,"height_nm":550,"theta_deg":0},"polarization":"s","material_names":{"incident":"air","feature":"tio2_design","background":"air","substrate":"sio2_fused"},"numerics":{"nx":96,"ny":96,"harmonics_low":25,"harmonics_high":49,"convergence_tolerance":0.08,"energy_tolerance":0.08},"proof":{"gate":"STAY","mode188_score":1.2}}
          JSON
      - name: Execute complete 12-state real-RCWA PB ledger at 470/532/650 nm
        working-directory: sovereign
        run: python omega_pb_ledger_r39.py --input /tmp/r39.json --output /tmp/r39-ledger.json --csv /tmp/r39-ledger.csv --wavelengths 470,532,650
      - name: Report exact wavelength-by-wavelength optical verdict
        run: |
          python - <<'PY'
          import json, statistics
          d=json.load(open('/tmp/r39-ledger.json'))
          print('R39 ALL WAVELENGTHS VERIFIED:', d['all_wavelengths_verified'])
          for p in d['proofs']:
              wl=p['wavelength_nm']
              print('\nWAVELENGTH',wl)
              print('BASIS VERIFIED:', p['basis_verified'])
              print('PB VERIFIED:', p['pb_phase_verified'])
              print('QUALIFIED STATES:', p['qualified_states'])
              print('RMS PHASE ERROR DEG:', p['rms_phase_error_deg'])
              rows=[r for r in d['rows'] if r['wavelength_nm']==wl]
              for ch in ('LR','RL'):
                  cr=[r for r in rows if r['channel']==ch]
                  qs=[r for r in cr if r['qualified']]
                  conv=[r['conversion'] for r in cr]
                  errs=[abs(r['error_deg']) for r in qs]
                  print(ch,'conversion min/mean/max=',min(conv),statistics.fmean(conv),max(conv))
                  print(ch,'qualified error abs mean/max=',statistics.fmean(errs) if errs else None,max(errs) if errs else None)
          print('\nR39 SHA:', d['ledger_sha256'])
          PY
      - name: Verify complete 72-row evidence ledger
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/r39-ledger.json'))
          assert d['schema']=='OMEGA_PB_LEDGER_v1'
          assert len(d['proofs'])==3
          assert all(len(p['states'])==12 for p in d['proofs'])
          assert len(d['rows'])==72
          assert {r['theta_deg'] for r in d['rows']}=={15.0*k for k in range(12)}
          assert {r['channel'] for r in d['rows']}=={'LR','RL'}
          assert {r['wavelength_nm'] for r in d['rows']}=={470.0,532.0,650.0}
          assert isinstance(d['all_wavelengths_verified'],bool)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: omega-r39-pb-ledger
          path: |
            /tmp/r39-ledger.json
            /tmp/r39-ledger.csv
