name: OMEGA R140 Unified Living Operation Fabric

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r140-unified-living-operation-fabric]

permissions:
  contents: read

concurrency:
  group: omega-r140-living-operation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r140:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove R140 unified living operation fabric
        run: node tests/r140-unified-living-operation-fabric.mjs
      - name: Preserve R139.1 unified capability and R138 capability-first contracts
        run: |
          node tests/r139-unified-capability-engine-invariants.mjs
          node tests/r138-capability-first-visual-runtime.mjs
          node tests/r93-visual-truth-enforcement-invariants.mjs
      - name: Preserve live proof, living world and woven continuity
        run: |
          node tests/r137-live-family-proof-fusion-invariants.mjs
          node tests/r136-living-world-frame-invariants.mjs
          node tests/r134-woven-relativity-continuum-invariants.mjs
          node tests/r134-canonical-world-continuity.mjs
      - name: Preserve Hybrid execution and zero-drift transport
        run: |
          node tests/r132-hybrid-execution-plane-invariants.mjs
          node tests/r127-hybrid-zero-drift-invariants.mjs
      - name: Preserve accuracy, admission, swarm and self-build authority
        run: |
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
          node tests/r124-self-contained-build-invariants.mjs
          node tests/r123-organism-swarm-invariants.mjs
          node tests/r121-swarm-runtime-invariants.mjs
          node tests/enacted-runtime-r32-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r140-dry-run
