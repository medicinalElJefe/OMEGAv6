name: OMEGA R147 Unified Executor Fabric

on:
  workflow_dispatch:
  pull_request:
    branches: [main, r146-durable-operation-execution]
  push:
    branches: [main, r147-unified-executor-fabric]

permissions:
  contents: read

concurrency:
  group: omega-r147-executor-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r147:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove unified executor fabric
        run: node tests/r147-unified-executor-fabric-invariants.mjs
      - name: Preserve durable execution, runtime attestation and proof closure
        run: |
          node tests/r146-durable-operation-execution-invariants.mjs
          node tests/r145-runtime-attestation-world-scar-invariants.mjs
          node tests/r144-runtime-deployment-attestation-invariants.mjs
          node tests/r143-authoritative-ui-operation-chain-invariants.mjs
          node tests/r142-proof-aware-capability-lifecycle-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
      - name: Preserve operation fabric, Hybrid host, swarm and admission boundaries
        run: |
          node tests/r140-unified-living-operation-fabric.mjs
          node tests/r139-unified-capability-engine-invariants.mjs
          node tests/r132-hybrid-execution-plane-invariants.mjs
          node tests/r127-hybrid-zero-drift-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
      - name: Syntax-check proven production spine
        run: node --check src/workerR116.js
      - name: Full inherited regression and production build
        run: npm run check
      - name: Canonical Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r147-dry-run
