name: OMEGA R133 Build Potential Map

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: omega-r133-potential-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r133:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prove R133 family truth, priority lanes and responsive potential surface
        run: node tests/r133-build-potential-map-invariants.mjs
      - name: Preserve R132 whole-system experience organization
        run: node tests/r132-whole-system-experience-invariants.mjs
      - name: Preserve complete R83 system inventory and route coverage
        run: node tests/r83-full-system-inventory-invariants.mjs
      - name: Preserve R131-R125 capacity, control and canonical admission
        run: |
          node tests/r131-capacity-governor.mjs
          node tests/r130-operational-control-plane.mjs
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r125-autonomic-swarm-invariants.mjs
      - name: Full inherited regression and production build
        run: npm run check
      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r133-dry-run
