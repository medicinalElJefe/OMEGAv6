name: OMEGA R111 Fabric Sentinel

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloud/fabric-sentinel/**'
      - 'wrangler.fabric-sentinel.jsonc'
      - '.github/workflows/r111-fabric-sentinel.yml'
      - 'src/workerR111.js'
      - 'src/federation/fabricMeshR111.js'
  push:
    branches: [main]
    paths:
      - 'cloud/fabric-sentinel/**'
      - 'wrangler.fabric-sentinel.jsonc'
      - '.github/workflows/r111-fabric-sentinel.yml'
      - 'src/workerR111.js'
      - 'src/federation/fabricMeshR111.js'

permissions:
  contents: read

env:
  SENTINEL_URL: https://omega-fabric-sentinel.jeffdeweyeljefe.workers.dev
  OMEGA_PUBLIC_URL: https://omegav6.jeffdeweyeljefe.workers.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check cloud/fabric-sentinel/src/index.js
      - run: npx wrangler deploy --dry-run --config wrangler.fabric-sentinel.jsonc --outdir .wrangler-r111-sentinel-dry-run
      - name: Diagnose current canonical fabric inputs
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.OMEGA_PUBLIC_URL.replace(/\/$/,'');
          async function get(path){const r=await fetch(base+path,{headers:{accept:'application/json','cache-control':'no-cache'}}),text=await r.text();let body=null;try{body=JSON.parse(text)}catch{};return{path,status:r.status,contentType:r.headers.get('content-type')||'',body,text}}
          const [fabric,federation,hybrid]=await Promise.all([get('/api/fabric/status'),get('/api/federation/run/status'),get('/api/hybrid/status')]);
          console.log('CANONICAL FABRIC DIAGNOSTIC',JSON.stringify({http:fabric.status,schema:fabric.body?.schema,authorityNodes:fabric.body?.authorityNodes?.map(x=>({id:x.id,state:x.state,ready:x.ready}))},null,2));
          console.log('FEDERATION INPUT DIAGNOSTIC',JSON.stringify({http:federation.status,schema:federation.body?.schema,nodes:federation.body?.nodes&&Object.fromEntries(Object.entries(federation.body.nodes).map(([k,v])=>[k,{state:v?.state,jsonVerified:v?.jsonVerified}]))},null,2));
          console.log('HYBRID INPUT DIAGNOSTIC',JSON.stringify({http:hybrid.status,state:hybrid.body?.state,nativeExecutionClaimed:hybrid.body?.nativeExecutionClaimed,pairingState:hybrid.body?.pairingState},null,2));
          if(!fabric.status||!federation.status||!hybrid.status)process.exitCode=1;
          NODE

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OMEGA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require production Cloudflare authorization
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::OMEGA_CLOUDFLARE_TOKEN missing'; exit 1; }
      - name: Deploy independent advisory sentinel
        run: npx wrangler deploy --config wrangler.fabric-sentinel.jsonc
      - name: Verify sentinel and wait for canonical R111 fabric
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.SENTINEL_URL.replace(/\/$/,'');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){const r=await fetch(base+path,{headers:{'cache-control':'no-cache'}}),t=await r.text();if(!r.ok)throw new Error(`HTTP ${r.status}: ${t.slice(0,300)}`);return JSON.parse(t)}
          let last='';
          for(let attempt=1;attempt<=18;attempt++){
            try{
              const health=await get('/health');
              if(health.service!=='omega-fabric-sentinel'||health.authority!=='ADVISORY_ONLY')throw new Error('sentinel authority boundary failed');
              const fabric=await get('/fabric');
              if(fabric.schema!=='OMEGA_FABRIC_SENTINEL_R111'||fabric.canonicalAuthority!=='omega-v6')throw new Error('sentinel fabric contract failed');
              if(!Array.isArray(fabric.authorities)||fabric.authorities.length!==4)throw new Error(`canonical R111 fabric not promoted yet; authority observations ${fabric.authorities?.length||0}`);
              console.log(`R111 SENTINEL LIVE PASS · ${base} · attempt ${attempt} · authorities ${fabric.authorities.map(x=>`${x.id}:${x.state}`).join(' | ')}`);
              process.exit(0);
            }catch(e){last=String(e)}
            await sleep(5000);
          }
          throw new Error(`sentinel/fabric verification failed after promotion window: ${last}`);
          NODE
