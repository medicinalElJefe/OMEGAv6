name: OMEGA R155 Whole-System Convergence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [r155-whole-system-convergence-authority]

permissions:
  contents: read

concurrency:
  group: omega-r155-whole-system-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prove-r155:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm install --no-fund
      - name: Reject high-severity dependency regressions
        run: npm audit --audit-level=high
      - name: Prove R155 family authority and one-system convergence
        run: node tests/r155-whole-system-convergence-invariants.mjs
      - name: Preserve R48 predecessor lineage and corrected successor ownership
        run: node tests/r48-completion-convergence-invariants.mjs
      - name: Preserve R130 control-plane endpoint ownership
        run: node tests/r130-operational-control-plane.mjs
      - name: Preserve R153 full-system completion authority
        run: node tests/r153-full-system-completion-invariants.mjs
      - name: Prove R154 relative capacity
        run: npx --yes tsx tests/r154-relative-capacity-fabric.mts
      - name: Preserve R153 causal NOW and lemma motion continuity
        run: npx --yes tsx tests/r153-lemma-motion-now-continuity.mts
      - name: Preserve R152 empirical evidence precedence
        run: npx --yes tsx tests/r152-universal-truth-envelope.mts
      - name: Preserve R151 provenance fusion and complete 4,997,376-reading census
        shell: bash
        run: |
          node tests/r151-all-modes-truth-fusion-invariants.mjs
          npx --yes tsx scripts/r151-full-atlas-scan.ts
      - name: Preserve route execution causal and admission authorities
        shell: bash
        run: |
          node tests/r143-authoritative-ui-operation-chain-invariants.mjs
          node tests/r142-proof-aware-capability-lifecycle-invariants.mjs
          node tests/r141-hybrid-proof-scar-replay-invariants.mjs
          node tests/r140-unified-living-operation-fabric.mjs
          node tests/r139-unified-capability-engine-invariants.mjs
          node tests/r126-causal-interaction-invariants.mjs
          node tests/r125-accuracy-engine-invariants.mjs
          node tests/r124-self-contained-build-invariants.mjs
      - name: Preserve navigation and interface information architecture
        shell: bash
        run: |
          node tests/r155-navigation-information-architecture-invariants.mjs
          npm run test:navigation
          npm run test:applications
      - name: Full inherited regression and production build
        run: npm run check
      - name: Canonical Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-r155-dry-run
      - name: Install Chromium for complete route proof
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start built application locally
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/omega-r155-preview.log 2>&1 &
          echo $! >/tmp/omega-r155-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omega-r155-preview.log
          exit 1
      - name: Exercise all 44 routes in desktop and mobile Chromium
        env:
          OMEGA_E2E_URL: http://127.0.0.1:4173
        run: node tests/r118-browser-operational-e2e.mjs
      - name: Browser diagnostics on failure
        if: failure()
        run: cat /tmp/omega-r155-preview.log || true
