<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>OMEGA R123 Living Runtime</title><style>html,body{margin:0;background:#03080b;color:#d9f4ef;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}main{min-height:100vh;padding:18px;display:grid;grid-template-rows:auto auto auto 1fr;gap:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:800;letter-spacing:.12em}.muted{color:#7ba09a}.pill{padding:5px 9px;border:1px solid #315c57;border-radius:999px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:linear-gradient(180deg,rgba(14,35,40,.88),rgba(5,15,18,.9));border:1px solid #21443f;border-radius:14px;padding:12px;min-height:105px}.card b{display:block;font-size:18px;margin-top:5px}.body{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.55fr);gap:12px}.world{position:relative;border:1px solid #21443f;border-radius:18px;min-height:610px;overflow:hidden;background:radial-gradient(circle at 50% 48%,#102f33 0,#071519 34%,#03080b 74%)}canvas{width:100%;height:100%;display:block;min-height:610px}.hud{position:absolute;inset:12px;pointer-events:none}.hud .row{display:flex;justify-content:space-between;gap:8px}.stack{display:grid;gap:10px}.panel{border:1px solid #21443f;background:#071116;border-radius:14px;padding:12px}.panel h3{margin:0 0 8px;font-size:13px;letter-spacing:.1em}.bar{height:7px;border-radius:99px;background:#102126;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6bb8ad,#d8b66d)}.stages{display:grid;gap:5px}.stage{display:grid;grid-template-columns:28px 1fr auto;gap:7px;align-items:center;font-size:12px;padding:6px;border:1px solid #17302d;border-radius:8px}.nav{display:flex;gap:6px;overflow:auto}.nav button{background:#09171b;color:#a9cbc5;border:1px solid #21443f;padding:8px 10px;border-radius:10px;white-space:nowrap}.nav button.active{border-color:#d6b56c;color:#f6e7bb}.intent{display:grid;grid-template-columns:1fr auto;gap:8px}.intent input{width:100%;background:#071116;border:1px solid #21443f;color:#d9f4ef;padding:11px 12px;border-radius:11px}.intent button{background:#15241d;color:#f1d79b;border:1px solid #665533;padding:0 16px;border-radius:11px}.truth{color:#f0c985}.bad{color:#ff9b8a}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.body{grid-template-columns:1fr}.world,canvas{min-height:440px}}@media(max-width:560px){main{padding:9px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.world,canvas{min-height:390px}}</style></head><body><main><header class='top'><div><div class='brand'>OMEGA · R123 LIVING TOTAL EXPERIENCE</div><div class='muted'>one canonical world · many lawful projections · adaptive performance · continuous proof</div></div><div class='pill' id='runtime'>RUNTIME UNVERIFIED</div></header><nav class='nav' id='nav'></nav><div class='intent'><input id='intent' placeholder='Describe the mission; OMEGA assembles the working surface…'><button id='route'>ROUTE MISSION</button></div><section class='grid' id='summary'></section><section class='body'><section class='world'><canvas id='field'></canvas><div class='hud'><div class='row'><span class='pill' id='projection'>FIELD</span><span class='pill' id='address'>STATE —</span></div></div></section><aside class='stack'><section class='panel'><h3>MISSION ROUTE</h3><div class='stages' id='stages'></div></section><section class='panel'><h3>PERFORMANCE RELATIVITY</h3><div id='budget'></div></section><section class='panel'><h3>TRUTH BOUNDARY</h3><div id='truth' class='muted'>Loading proof-bound runtime state…</div></section></aside></section></main><script>const projections=['FIELD','EARTH','MATTER','TRAVERSAL','FORECAST','RELATIVITY','OPTICAL','PROOF','BUILD'];let active='FIELD',state={},raf=0;const nav=document.querySelector('#nav'),summary=document.querySelector('#summary'),stages=document.querySelector('#stages'),budget=document.querySelector('#budget'),truth=document.querySelector('#truth');function button(){nav.innerHTML=projections.map(x=>`<button class='${x===active?'active':''}' data-x='${x}'>${x}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.x;document.querySelector('#projection').textContent=active;button()})}function card(k,v,s=''){return `<article class='card'><span class='muted'>${k}</span><b>${v}</b><small>${s}</small></article>`}async function get(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():null}catch{return null}}function infer(text){if(/earth|satellite|terrain|mountain|weather|map/i.test(text))return'EARTH';if(/atom|matter|material|molecule|field/i.test(text))return'MATTER';if(/optical|light|rcwa|fdtd|etch|metasurface/i.test(text))return'OPTICAL';if(/forecast|future|predict|trajectory/i.test(text))return'FORECAST';if(/build|code|repair|software|deploy/i.test(text))return'BUILD';if(/proof|evidence|verify|audit/i.test(text))return'PROOF';if(/relative|inverse|outverse|observer/i.test(text))return'RELATIVITY';return'FIELD'}function routeIntent(){active=infer(document.querySelector('#intent').value);document.querySelector('#projection').textContent=active;button()}async function load(){const [status,hybrid,manifest,computed,earth]=await Promise.all([get('/api/status'),get('/api/hybrid/status'),get('/r123-living-runtime.json'),get('/omega-r122-computed-reality-manifest.json'),get('/api/earth/noaa/catalog')]);state={status,hybrid,manifest,computed,earth};const live=!!status;document.querySelector('#runtime').textContent=live?'RUNTIME SOURCE REACHED':'RUNTIME UNVERIFIED';document.querySelector('#runtime').className='pill '+(live?'truth':'bad');const pc=hybrid?.nativeExecutionClaimed===true&&(hybrid?.authenticatedHeartbeat===true||hybrid?.heartbeatAuthenticated===true);const cells=20736;summary.innerHTML=card('CANONICAL FIELD',cells.toLocaleString()+' states','12 × 12 × 12 × 12 address topology')+card('SOVEREIGN',pc?'PC ONLINE':'DEVICE PROOF REQUIRED','authenticated heartbeat required')+card('COMPUTED REALITY',computed?.computedRealityPipeline?.length===21?'21 STAGES DEFINED':'UNVERIFIED','no generated substitute')+card('SELF BUILD',manifest?.selfBuild?.mode??'GOVERNED','propose → test → compare → admit');const address=Number(status?.address??status?.runtime?.address??11498);document.querySelector('#address').textContent='STATE '+Math.max(0,Math.min(20735,address));const route=manifest?.missionRoute||['PROPOSE','SCREEN','EXECUTE','VERIFY','RENDER','ADMIT'];stages.innerHTML=route.map((x,i)=>`<div class='stage'><b>${String(i+1).padStart(2,'0')}</b><span>${x}</span><small>${i===0?'GENESIS':i===1?'OPTICAL/FEDERATION':i===2?'SOVEREIGN':'OMEGAV6'}</small></div>`).join('');const w=innerWidth,tier=w<760?'PHONE':pc?'SOVEREIGN':'DESKTOP';const fps=tier==='PHONE'||tier==='DESKTOP'||tier==='SOVEREIGN'?60:30;budget.innerHTML=[['DEVICE',tier,1],['TARGET FPS',fps,Math.min(1,fps/60)],['GEOMETRY',tier==='PHONE'?'.48':tier==='SOVEREIGN'?'1.00':'.82',tier==='PHONE'?.48:tier==='SOVEREIGN'?1:.82],['PROOF','HIGH',.9],['HISTORY',tier==='PHONE'?'.42':tier==='SOVEREIGN'?'1.00':'.82',tier==='PHONE'?.42:tier==='SOVEREIGN'?1:.82]].map(([a,b,p])=>`<div><small>${a} · ${b}</small><div class='bar'><i style='width:${Number(p)*100}%'></i></div></div>`).join('');truth.innerHTML=`<b class='truth'>Computed reality remains proof-gated.</b><br>Visible geometry must trace to empirical source data and computed state. Observer projection and LOD may compress display work; they may not erase canonical state, scar, or provenance. ${pc?'Sovereign heartbeat is authenticated.':'Sovereign native execution is not claimed online.'}`}
function draw(){const c=document.querySelector('#field'),dpr=Math.min(2,devicePixelRatio||1),r=c.getBoundingClientRect();if(c.width!==Math.round(r.width*dpr)||c.height!==Math.round(r.height*dpr)){c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr))}const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const W=r.width,H=r.height,cx=W/2,cy=H/2,R=Math.min(W,H)*.27;x.clearRect(0,0,W,H);const t=performance.now()/1000,modeIndex=Math.max(0,projections.indexOf(active));for(let ring=0;ring<12;ring++){x.strokeStyle=`rgba(${70+ring*5},${150+ring*6},${145+ring*5},${.05+ring*.008})`;x.lineWidth=1;x.beginPath();x.arc(cx,cy,R*(.35+ring*.075),0,Math.PI*2);x.stroke()}const N=active==='FIELD'?1728:active==='EARTH'?864:432;for(let i=0;i<N;i++){const a=i/N*Math.PI*2+t*.025*(1+(i%5)*.08),shell=(i%12)/12,rr=R*(.3+.74*shell),wave=Math.sin(a*(3+((i+modeIndex)%7))+(i%12)+modeIndex)*(.055+.007*modeIndex)*R;const px=cx+Math.cos(a)*(rr+wave),py=cy+Math.sin(a)*(rr+wave);const role=(i+modeIndex)%5,colors=['245,245,236','214,181,108','185,70,62','75,120,190','116,190,139'];x.fillStyle=`rgba(${colors[role]},${.22+.45*((i%17)/17)})`;x.fillRect(px,py,1.1+(i%3)*.45,1.1+(i%3)*.45)}x.strokeStyle='rgba(216,182,109,.75)';x.lineWidth=1.4;x.beginPath();for(let i=0;i<180;i++){const a=i/180*Math.PI*2*(2.1+modeIndex*.08)+t*.08,rr=R*(.18+.65*i/180),px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;if(!i)x.moveTo(px,py);else x.lineTo(px,py)}x.stroke();raf=requestAnimationFrame(draw)}button();document.querySelector('#route').onclick=routeIntent;document.querySelector('#intent').addEventListener('keydown',e=>{if(e.key==='Enter')routeIntent()});load();draw();</script></body></html>
